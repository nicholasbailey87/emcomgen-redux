# lr_sweep_8_attention_discriminator arm: `AttentionDiscriminator` at 1e-4 on CUB.
#
# See `01_shapeworld_1e-12.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate, in the dataset, and in
# carrying a `[data]` block, since ShapeWorld is the default.
#
# ---
#
# **This arm: `AttentionDiscriminator` at 1e-4 on CUB**, copying ablation rung 16.

name = "lr_sweep_8_attention_discriminator"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerBidirectionalLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7

[receiver]
feature_model = "BirdsViT"
language_model = "ReceiverCrossAttentionLM"
discriminator = "AttentionDiscriminator"

[receiver_discriminator]
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[receiver_language_model]
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
layers = 6
bidirectional = true

[optimiser.implementation_lr.receiver_discriminator]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
AttentionDiscriminator = 1e-4

[scheduler]
epochs = 30

[experiment]
repeats = 1
