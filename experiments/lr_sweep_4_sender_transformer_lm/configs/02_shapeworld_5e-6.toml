# lr_sweep_4_sender_transformer_lm arm: `SenderTransformerLM` at 5e-6 on ShapeWorld.
#
# See `01_shapeworld_2e-6.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate, and in carrying no
# `[slurm]` block, which is read from the first config by filename alone.
#
# ---
#
# **This arm: `SenderTransformerLM` at 5e-6 on ShapeWorld**, copying ablation rung 07.

name = "lr_sweep_4_sender_transformer_lm"

[sender]
feature_model = "ShapeWorldViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7
bidirectional = false

[optimiser.implementation_lr.sender_language_model]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
SenderTransformerLM = 5e-6

[scheduler]
epochs = 60

[experiment]
repeats = 1
