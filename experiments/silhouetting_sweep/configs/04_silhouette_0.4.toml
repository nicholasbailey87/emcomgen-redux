# silhouetting_sweep arm 5 of 5: rung 1 of the ShapeWorld ablation
# (`ablation_shapeworld/configs/01_shapeworld_baseline.toml`) at
# `silhouette_p_receiver = 0.4`.
#
# The five arms are 0.0, 0.1, 0.2, 0.3 and 0.4 and differ in that key alone.
# `silhouette_p_sender` stays at 0.0 on every arm, as on rung 1.
#
# Prompted by two baseline runs (2026-10-02/03): at 0.0 test shape stayed at
# chance for 100 epochs while colour held ~0.75; at 0.3 test shape climbed to
# 0.69 by epoch 100, still rising, while test colour fell to ~0.62. This sweep
# looks for where shape starts to be learnt and what it costs colour. Read
# `test_acc_md_shape` and `test_acc_md_color` per seed before averaging.
#
# `epochs` and `repeats` are read straight from this file by
# scripts/job_utils.py, and `[slurm]` from the first config in the folder, so
# every arm restates them.

name = "silhouetting_sweep"

[data]
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.4

[scheduler]
epochs = 100

[experiment]
repeats = 3

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
