# Rung 1: ShapeWorld with the GRU/CNN baseline agents.
#
# ResNet56 on both agents, AveragePrototyper, SenderGRULM,
# ReceiverGRULM, BilinearDiscriminator. This is the reference point every other
# rung is measured against, and it overrides nothing.
#
# The ladder, in order. Each rung is the one below it plus exactly one change:
#
#    1,  2  baseline: CNN vision -- `ResNet56` on ShapeWorld, `ResNet18` on
#           CUB -- AveragePrototyper, SenderGRULM, ReceiverGRULM,
#           BilinearDiscriminator
#    3,  4  + sender ViT2
#    5,  6  + AttentionPrototyper
#    7,  8  + SenderTransformerLM
#    9, 10  + receiver ViT2
#   11, 12  + ReceiverTransformerAutoregressiveLM, in place of ReceiverGRULM
#   13, 14  + ReceiverTransformerBidirectionalLM, in place of the causal one
#   15, 16  + SenderTransformerBidirectionalLM, in place of the autoregressive one
#   17, 18  + ReceiverCrossAttentionLM, in place of the bidirectional encoder
#
# The discriminator is `BilinearDiscriminator` on every rung.
#
# **Rungs 11-18 re-cut on 2026-10-01.** `lr_sweep_6_receiver_cross_attention_lm`
# found the cross-attention encoder has the attention discriminator's shortcut,
# stronger: `train_shuffled_message_acc` ~0.65 (test ~0.58) against live
# accuracy ~0.75 / ~0.63 on every birds arm, where the discriminator had
# reached ~0.55 / ~0.51. Reading the candidate set gives the encoder a set
# summary whatever the tokens say. So the attention discriminator was deleted
# outright, two Transformer encoders that never see the candidates went in at
# 11-14, the parallel speaker moved up to 15/16 over them, and the
# cross-attention encoder went to the top at 17/18. The correspondence is old
# 11 -> new 17 and old 13 -> new 15 (12 -> 18, 14 -> 16 on birds), both rebased
# onto new listeners; old 15/16 has no successor. Results filed under the old
# numbers belong to the old order.
#
# **Rungs 11-16 reordered on 2026-09-30**, the first of two re-cuts that week.
# The attention discriminator was 11/12, the cross-attention encoder 13/14 and
# the parallel speaker 15/16. It moved to the top because its candidate
# self-attention lets the listener score birds games without the message: on
# its learning-rate sweep (then sweep 6, later sweep 8, now deleted) every
# birds arm with the discriminator learning reached `train_shuffled_message_acc`
# 0.53-0.56, where every other sweep sits at 0.50. The correspondence is old
# 11-16 -> new 15, 11, 13 (and 16, 12, 14 on birds). Results filed under the
# old numbers belong to the old order.
#
# **Fourteen rungs since 2026-09-16, and this is the second renumbering.** The
# old 7/8 pair was `+ ExampleContrast upstream of the prototyper`; that stage is
# part of `AttentionPrototyper` now, so the pair went and everything above it
# came down by two. The correspondence is old 9-16 -> new 7-14, and
# experiments/README.md carries it beside the first renumbering's.
#
# Odd numbers are ShapeWorld, even are CUB. The two datasets never mix: rung 4
# is rung 2 plus one change, not rung 3 plus a dataset. That is why the ladder
# is two experiments -- the odd rungs here in `ablation_shapeworld`, the even
# ones in `ablation_birds` -- so either arm can be queued, re-run and read
# without waiting on the other. The numbers did not change with the split, so
# this folder runs 1, 3, 5, ..., 17 and the gaps are the birds arm.
#
# **The backbone is `ResNet56` as of 2026-09-06, and this is the third one.**
# It was `Conv4` (113,088 parameters), then `ResNet18SmallInput` (11,168,832),
# and is now He et al. 2015 section 4.2's CIFAR network at 852,368: a 3x3
# stride-1 stem at 16 channels, three stages of nine blocks at 16 / 32 / 64,
# option-A shortcuts, `final_feat_dim` 64. ShapeWorld's 64px input reaches the
# last stage as a 16x16 map, against 8x8 under the small-input ResNet-18 and 2x2
# under the stock one -- which still matters more than the parameter count on a
# task whose known failure mode is the speaker naming colours.
#
# **The reason for the move is the learning rate.** jayelm's `--lr` default of
# 1e-4 was tuned on `Conv4`, and this repo restored it on 2026-09-05 as "jayelm's
# own rate" while running 11.2M from random init -- 99x the size it was measured
# at. His CUB runs are not a precedent: `run_cub.sh` passes
# `--pretrained_feat_model` on every one, so 1e-4 there is fine-tuning from
# ImageNet weights. `experiments/baseline_lr_sweeps/` measures the backbone rate
# at the scale the ladder runs; this is the other half, bringing the scale back
# to somewhere the inherited rate is at least arguable. It also closes the hole
# between 113k and 11.2M, which is what made "wrong for this scale" and "wrong
# for this architecture" inseparable.
#
# **The ShapeWorld ViT narrowed with it**, to 128 / 6 / 4 / 256 with GELU --
# 876,599 parameters, 1.03x the CNN. The Conv4/ViT2 comparison this ladder was
# built on had been 0.11M against 10.3M. CUB keeps the 320-wide SwiGLU stack, so
# **the two arms are no longer parameter-matched to each other** and must not be
# read across; see rung 2.
#
# **Nothing recorded before 2026-09-06 pools with anything after it, on either
# arm.** Both agents' backbones changed architecture and size on ShapeWorld, the
# birds micro-batch doubled, and `[optimiser] weight_decay` became 0.1 on both
# datasets. Every parameter count in this experiment moved.
#
# The settings this rung used to carry -- `silhouette_p_receiver` and the
# `logit_scale_lr` / `uniform_weight` pair -- are DEFAULT.toml's own values, so
# every rung inherits them rather than rung 1 alone.
#
# **The ladder rebaselines again on 2026-09-05, and harder.** Four inherited
# settings moved that day, in two commits aimed at the channel rather than at
# this experiment, and the decision was to let the ladder move with them rather
# than pin it back:
#
#     [optimiser] lr                          5e-5  -> 1e-4   both halves
#     [scheduler] warm_up_epochs              10    -> 0      both halves
#     [sender_language_model] normalise_logits true  -> false  both halves
#     [data] silhouette_p_receiver            0.1   -> 0.5    ShapeWorld only
#     [data] silhouette_fill                  mean  -> white  ShapeWorld only
#     [data] flip / affine / mixup            off   -> on     ShapeWorld only
#
# `[birds.data]` pins the three augmentations back off, so the birds half takes
# the rate, the warm-up and the channel only.
#
# Two of those have moved again since: `normalise_logits` is back to true, and
# `silhouette_p_receiver` is 0.1 from 2026-10-07 (`silhouette_p_sender` 0.0),
# chosen on this rung by `silhouetting_sweep`; see DEFAULT.toml for both. The
# module rates are no longer flat at the base either: each backbone and
# language model takes its own rate from `[optimiser.implementation_lr]` in
# DEFAULT.toml.
#
# **Read no ShapeWorld `train_acc` across that date.** With `mixup_alpha` on,
# `per_game_accuracy` scores against `lis_y > 0.5` -- the dominant source of each
# blend -- so it is a different quantity from the one every recorded ablation
# trace holds, and from `test_acc` in the same row. `train_loss` and the eval
# splits are unaffected; eval is never mixed and never silhouetted.
#
# **Historical, from 2026-09-05; the premise no longer holds.** Every ViT now runs
# at 5e-5, half the rate this paragraph is about.
#
# **The rate carries a known risk and it is being taken deliberately.** On the
# 2026-08-30 ladder rung 3 collapsed at epoch 10 -- `logit_prior_share` 0.891 ->
# 0.9992 and `referent_spread` 0.221 -> 0.0040 in one epoch, then flat to four
# decimals for the remaining twenty. DEFAULT.toml reads that not as a shock at
# the warm-up join, which is continuous, but as the first point the rate reached
# its maximum and stayed there, i.e. a stability threshold; halving the rate was
# the direct test of the reading. Both halves of that test are now off. If the
# reading holds, rung 3 meets the same rate at step one with no ramp to escape
# in first, so a rung 3 that dies immediately is the *expected* outcome under
# that hypothesis rather than a new failure -- and rung 7's escape at epoch 3
# happened at roughly 30% of base rate, which was the ramp. Watch
# `logit_prior_share` and `referent_spread` in the first two epochs on rungs 3
# and 9, and if they go, that is the evidence for the threshold rather than
# against the ladder.
#
# **Nine configs here, one per ShapeWorld rung, and no variants.** Half-rate and
# silhouette-rate forks of rungs 3 and 8 lived here through August 2026; the
# half-rate one is now DEFAULT.toml's `[optimiser] lr` and the silhouette ones
# are the `silhouette_titration` experiment, so the ladder is back to one file
# per rung and every file differs from the one two below it by exactly one
# architectural change.
#
# `epochs` and `repeats` below are not overrides: scripts/job_utils.py reads
# both straight out of this file rather than out of the merged config, so every
# config in an experiment must carry them even when they restate the default.
# `[slurm]` is read from the *first* config in the folder only (sorted by
# filename), so the block here governs this experiment's whole array -- it is
# sized for the heaviest job in the set, which is rung 17. The birds arm's array
# is governed by rung 2's block, not this one.

name = "ablation_shapeworld"

[scheduler]
epochs = 100

[experiment]
repeats = 3

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
