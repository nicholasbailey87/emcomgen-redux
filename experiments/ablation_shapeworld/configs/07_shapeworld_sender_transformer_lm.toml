# Rung 7: rung 5 with a Transformer sender language model.
#
# The speaker is an autoregressive Transformer: a learned query array
# cross-attends the two prototypes into a latent array, seven blocks run over that
# array under a causal mask, and the message is its tail -- one slot per content
# symbol, each read and then overwritten by the symbol it produced, so the next
# slot is conditioned on it. The slots ahead of the message are never
# overwritten, so every symbol reads the referents through them.
#
# 6,758,354 parameters against the GRU baseline's 6,813,499 on ShapeWorld, and
# 6,764,120 against 6,822,649 on CUB -- 0.992x and 0.991x. The width is the
# language model's own 320, independent of the ViT below it, since the adapter
# brings the prototypes to it. See `[sender_language_model] layers`.
#
# This is the rung the rebalancing was for. At the old widths it was 533,943
# parameters against the GRU's 6,813,499 -- 12.8x smaller -- because
# `SenderTransformerLM` pins its width to the vision model's and ShapeWorld's
# ViT had been sized against Conv4's 113,088. Whatever that rung measured, it was
# not architecture.
#
# The GRU baseline is autoregressive too, so this rung moves the language model's
# architecture and not its generation regime. The parallel arm, which moves only
# the regime, is the top rung: 15 on ShapeWorld, 16 on birds.
#
# It also no longer moves *how the concept arrives*, which it silently used to.
# `SenderGRULM` builds its initial hidden state from the prototypes through
# `init_h`, so the concept is the state the first symbol is generated from. The
# Transformer speaker used to begin its sequence at SOS -- a constant -- and let
# the concept in only through cross-attention branches scaled by DeepNorm's
# `beta / alpha`, which at init left one seed in five emitting the same first
# symbol for every concept. Reading the message off the latent array puts the
# concept back in the residual stream on both speakers. See docs/anecdotes.md.

name = "ablation_shapeworld"

[sender]
feature_model = "ShapeWorldViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerAutoregressiveLM"

[sender_language_model]
# The two must equal *each other*, and neither has anything to do with the
# vision model's width. `SenderTransformerLM` layer-norms the incoming
# prototypes at its own `d_model` and separately rejects
# `token_embedding_size != referent_embedding_size`, so these two are pinned
# together -- but the referents arrive already at this `d_model`:
# `builder.build_models` sets `sender_referent_width` from *this* table and the
# speaker's adapter brings `final_feat_dim` to it, whatever the backbone emits.
#
# The comment this replaces said both keys "must equal
# `sender_feature_model.d_model`". That was true of the speaker before the
# adapter landed and has been false since; verified by building rung 11 with a
# 128-wide vision model under a 320-wide language model. It is worth naming
# rather than deleting, because ShapeWorld's ViT2 is 128 wide now -- narrowed to
# match `ResNet56` -- and under the old reading that narrowing would have
# dragged this stack, and the whole capacity match against the GRU baseline,
# down with it. Rung 3 still comes before this one, but for the ordering of the
# ladder rather than for a width constraint.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 7 blocks, chosen on parameters rather than on taste, and the third depth this
# rung has taken: 4, then 6, now 7. Each move was the same move -- hold the
# speaker's language model at the GRU baseline's size when something changed
# what that size is.
#
# 4 -> 6 was the blocks getting cheaper. They stopped cross-attending into a
# latent memory when the referents moved into the stack's input, which cost each
# block a sublayer, about 1.6M across the stack, and two more blocks at
# `ff_inner_size = 512` bought it back.
#
# 6 -> 7 is the *baseline* moving, not this rung. `ReferentAdapter` sizes each
# agent from its own language model's `d_model` rather than from its backbone,
# so `SenderGRULM.init_h` -- which reads `2 * referent_width` -- went from
# 512-wide referents to 1024-wide ones and the GRU speaker grew by 1,048,576.
# This stack did not move with it: its width is its own `d_model`, 320, and the
# adapter delivers the referents already at that width. Held at 6 the ratio was
# 0.859x, well outside the 0.05 band `test_the_speakers_language_models_are_
# matched` pins. At 7 it is 6,758,354 against the baseline's 6,813,499 on
# ShapeWorld, so 0.992x -- the closest this rung has ever been to 1.0, against
# 1.015x at 6 blocks and 1.029x at 4.
#
# The alternative was 6 blocks at `ff_inner_size = 640`, which reads 0.968x. It
# was not taken: `ff_inner_size = 512` is argued for in DEFAULT.toml on its own
# grounds and depth is the free variable here, so a depth change is the cheaper
# thing to spend.
#
# The cost of matching on parameters is not matching on depth, and this rung now
# pays it three times over: 7 blocks against the GRU's 1, and 7 against its own
# previous 4 and 6. Depth or parameters, not both, and the ladder is built on
# parameters. Note the depth is *not* free of the design change either, so a
# difference against the runs recorded before 2026-08-26 covers both.
#
# Depth is close to inert for the thing the redesign was for, at least at init:
# measured init-time code strength runs 0.2236 / 0.2158 / 0.2173 / 0.2250 at 4 /
# 5 / 6 / 7 blocks, flat inside the noise. See docs/anecdotes.md.
layers = 7

# The causal arm, chosen by `language_model = "SenderTransformerAutoregressiveLM"`
# above rather than by `bidirectional`, which this class overrides. The blocks
# run over the latent array under a causal mask and the message slots in its
# tail are generated in order, each read and then overwritten by its symbol so
# the next one is conditioned on it.
#
# Causal because the GRU baseline at rung 1 is autoregressive too: rung 7 then
# moves the language model's architecture and nothing else. The parallel arm,
# `SenderTransformerBidirectionalLM`, would move the generation regime at the
# same time, and whatever the combination measured could not be attributed to
# either. It is at the top of the ladder instead -- rungs 15 and 16 -- where it
# moves the regime alone. The two arms are the same blocks at the same size and
# differ by `token_embedding` alone, which only the causal arm needs because
# only it reads a symbol back.

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
