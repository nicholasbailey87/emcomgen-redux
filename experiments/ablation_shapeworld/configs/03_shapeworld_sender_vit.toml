# Rung 3: rung 1 with a Transformer sender vision model.
#
# ViT2 at ShapeWorld's specification comes to 876,599 parameters on its 64px
# images, against `ResNet56`'s 852,368 -- 1.03x, and the closest this rung has
# ever been to the arm it is compared against. It was 10,317,986 against
# `ResNet18SmallInput`'s 11,168,832 until 2026-09-06, and 10,317,986 against
# `Conv4`'s 113,088 before that: a 91x mismatch on the rung whose whole claim is
# that only the architecture moved. See `[sender_feature_model]` in DEFAULT.toml.
#
# **The two datasets are no longer the same ViT, and no longer the same size.**
# ShapeWorld runs 128 / 6 / 4 / 256 with GELU here; CUB runs the 320 / 10 / 5 /
# 576 SwiGLU stack this file used to describe, pinned in
# `[birds.sender_feature_model]`. Each dataset is matched to its own baseline
# backbone -- 0.85M on ShapeWorld, 11.2M on CUB -- because CUB's 224px images do
# not want a CIFAR network. A rung 3 / rung 4 difference therefore covers the
# dataset, the image size *and* two different networks, and is not an
# architecture result. Read each arm against the rung below it, never across.
#
# Note the ViT is *not* the same size on both datasets even at identical
# settings, because its patch tokeniser scales with the image. At 64px the
# pooling kernel is 6 and each token carries 6*6*3 = 108 channels; at 224px the
# kernel is 20 and each token carries 1200. That was true when the two stacks
# were otherwise identical and is one of the reasons matching them to each other
# was never quite reachable. See rung 4 for the birds figure.
#
# The vision swap comes *before* the prototyper now, where the old ladder took
# them the other way round. Two reasons. The prototyper pools the backbone's
# output, so an attention pooler measured over ResNet features and one measured
# over ViT features are different experiments, and putting vision first means
# every rung above it pools the same kind of vector. And the speaker's language
# model at rung 9 pins its width to the vision model's, so the ViT has to be in
# place well before then for that rung to be about the language model.
#
# The ViT's shape is not set here. `[sender_feature_model]` and
# `[receiver_feature_model]` in DEFAULT.toml carry the one specification every
# rung uses -- 320 wide, 10 layers, feedforward inner 576, 5 heads for a head
# dimension of 64 -- so a rung that swaps in a ViT only has to name it.
#
# That is a change of principle, not just of numbers. The widths used to be
# picked per dataset to match each one's own baseline backbone, which is
# defensible for a vision rung on its own but not once `SenderTransformerLM`
# enters at rung 9: it pins its width to the vision model's, so ShapeWorld's
# language model inherited 128 and came out 12.8x smaller than the GRU it is
# compared against. One width for both datasets is what makes rungs 9 and 10
# comparable.

name = "ablation_shapeworld"

[sender]
feature_model = "ViT2"

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
