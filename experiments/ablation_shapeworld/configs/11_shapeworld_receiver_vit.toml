# Rung 11: rung 9 with the receiver's vision model updated to match the
# sender's.
#
# The same ViT2 specification the sender took at rung 3, so the two agents see
# through the same kind of eye again -- 876,599 parameters on ShapeWorld against
# `ResNet56`'s 852,368, and 11,332,626 on CUB against `ResNet18`'s 11,176,512.
#
# The two datasets run different ViTs at different sizes since 2026-09-06, and
# deliberately: each is matched to its own baseline backbone. See rung 3.
#
# The listener is still `ReceiverGRULM` + `BilinearDiscriminator`. The
# discriminator reads the referent embeddings through a bias-free bilinear
# projection, so changing the referent width from 512 to 320 rescales that
# projection and nothing else -- 524,289 parameters down to 327,681 -- and the
# message encoder is untouched. Rungs 13 and 15 replace the two halves in turn.
#
# (Both of those halved when `[receiver_language_model]` was restored to
# jayelm's 1 layer unidirectional: the projection's fan-in is the GRU's
# `output_size`, which went 2048 -> 1024.)

name = "ablation_shapeworld"

[sender]
feature_model = "ShapeWorldViT"
prototyper = "AttentionPrototyper"
contrast = true
language_model = "SenderTransformerLM"

[sender_language_model]
# The two must equal *each other*, and neither has anything to do with the
# vision model's width. `SenderTransformerLM` layer-norms the incoming
# prototypes at its own `d_model` and separately rejects
# `token_embedding_size != referent_embedding_size`, so these two are pinned
# together -- but the referents arrive already at this `d_model`:
# `builder.build_models` sets `sender_referent_width` from *this* table and the
# speaker's adapter brings `final_feat_dim` to it, whatever the backbone emits.
#
# The comment this replaces said both keys "must equal
# `sender_feature_model.d_model`". That was true of the speaker before the
# adapter landed and has been false since; verified by building rung 13 with a
# 128-wide vision model under a 320-wide language model. It is worth naming
# rather than deleting, because ShapeWorld's ViT2 is 128 wide now -- narrowed to
# match `ResNet56` -- and under the old reading that narrowing would have
# dragged this stack, and the whole capacity match against the GRU baseline,
# down with it. Rung 3 still comes before this one, but for the ordering of the
# ladder rather than for a width constraint.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 6 blocks and `ff_inner_size = 512`, which together hold the speaker's language
# model at 1.015x the GRU baseline's. The blocks lost their cross-attention
# sublayer when the referents moved into the stack's input, so they are cheaper
# and there are more of them. The argument is at rung 9; this rung is not
# supposed to touch the speaker at all.
layers = 7

# `false` selects the causal arm: the blocks run over the latent array under a
# causal mask and the message slots in its tail are generated in order, each
# read and then overwritten by its symbol so the next one is conditioned on it.
# `true` selects the parallel arm, which runs the same blocks unmasked and reads
# the whole tail in one shot.
#
# `false` here, because the GRU baseline at rung 1 is autoregressive too: this
# rung then moves the language model's architecture and nothing else. `true`
# would move the generation regime at the same time, and whatever the
# combination measured could not be attributed to either.
#
# The parallel arm is no longer a rung of its own. It used to sit beside the top
# of the ladder as a fork; to measure it again, copy the topmost rung and flip
# this key. A difference then covers the generation regime and nothing else,
# which is new: the two arms used to be different architectures at different
# sizes, and are now the same blocks at the same size under different masks.
# They differ by `token_embedding` alone -- 5,760 parameters, which only the
# causal arm needs because only it reads a symbol back.
bidirectional = false

[receiver]
feature_model = "ShapeWorldViT"

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
