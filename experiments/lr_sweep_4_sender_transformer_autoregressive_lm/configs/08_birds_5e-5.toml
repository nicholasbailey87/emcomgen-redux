# lr_sweep_4_sender_transformer_autoregressive_lm arm: `SenderTransformerAutoregressiveLM` at 5e-5 on CUB.
#
# See `01_birds_frozen.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate alone.
#
# ---
#
# **This arm: `SenderTransformerAutoregressiveLM` at 5e-5 on CUB**, copying ablation rung 08.

name = "lr_sweep_4_sender_transformer_autoregressive_lm"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerAutoregressiveLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7

[optimiser.implementation_lr.sender_language_model]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
SenderTransformerAutoregressiveLM = 5e-5

[scheduler]
epochs = 100

[experiment]
repeats = 1
