# lr_sweep_8_sender_transformer_bidirectional_lm arm: `SenderTransformerBidirectionalLM` at 5e-5 on ShapeWorld.
#
# See `01_shapeworld_2e-6.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate.
#
# ---
#
# **This arm: `SenderTransformerBidirectionalLM` at 5e-5 on ShapeWorld**, copying ablation rung 15.

name = "lr_sweep_8_sender_transformer_bidirectional_lm"

[sender]
feature_model = "ShapeWorldViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerBidirectionalLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7

[receiver]
feature_model = "ShapeWorldViT"
language_model = "ReceiverCrossAttentionLM"
discriminator = "AttentionDiscriminator"

[receiver_discriminator]
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[receiver_language_model]
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
layers = 6
bidirectional = true

[optimiser.implementation_lr.sender_language_model]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
SenderTransformerBidirectionalLM = 5e-5

[scheduler]
epochs = 30

[experiment]
repeats = 1
