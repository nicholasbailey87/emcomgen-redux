# baseline_speed_4 with jayelm's optimisation stack exactly.
#
# Everything else has now been checked against the original and matches:
# conv4 backbone, prototype = mean(positives) || mean(negatives), dropout on the
# pooled prototype at 0.1, single-layer GRU at hidden 1024 / embedding 500,
# init_h = Linear(2 * feat_size, hidden) with no normalisation, vocab 14,
# message_length 7, n_examples 20, batch 32 x accum 4, uniform_weight 0.1,
# percent_novel 1.0, 100 epochs. The data is verified sound and carries the
# paper's 80/20 compositional split.
#
# What is left is the optimiser and schedule, where run_sw.sh and io_util.py
# give: plain Adam at lr 1e-4 with no weight decay, --clip 100.0 (effectively
# off), and no scheduler at all -- jayelm's scheduler step is commented out.
# Ours has been AdamW at wd 0.01, clip 1.0, and a cosine decay to 1.67% of peak
# after a 5-epoch warm-up.
#
# No mechanism is claimed here. Probing shows colour is linearly decodable at
# 0.976 from an *untrained* conv4 while shape decodability peaks at
# initialisation and decays under training, so the failure is a shortcut
# collapse seeded by the init -- which none of these knobs obviously addresses.
# This config exists because it is the last remaining bundle of differences from
# a run that demonstrably escaped, and collapsing them into one A/B is cheaper
# than reasoning about them individually.

name = "baseline_speed" # experiment name - should be the same as file name

[data]
n_workers = 4

[sender]
prototype_dropout = 0.1

[receiver_comparer]
dropout = 0.1

[optimiser]
class = "Adam"        # jayelm: optim.Adam(opt_params, lr=args.lr)
weight_decay = 0.0
clip_grad_norm = 100.0 # jayelm's --clip default; ours has been 1.0

[scheduler]
epochs = 100
warm_up_epochs = 0
lr_schedule_shape = "ascent"
cool_point_multiplier = 1.0 # with "ascent", DEFAULT.toml documents this as a flat line

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
