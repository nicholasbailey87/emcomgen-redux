# baseline_speed_4 with the exploration mixture doubled.
#
# The paper's own remedy for the colour minimum is sampling from 90% original
# logits and 10% uniform (`uniform_weight = 0.1`, section 397 of the NeurIPS
# submission). That was already on for runs 2 and 3 and did not prevent the
# collapse. This takes it to 0.2 on top of baseline_speed_4's restored 0.1
# dropouts, so the ladder reads 3 -> 4 (dropout) -> 5 (dropout + exploration)
# and each step moves one knob against the one before it.

name = "baseline_speed" # experiment name - should be the same as file name

[data]
n_workers = 4

[sender]
prototype_dropout = 0.1

[sender_language_model]
uniform_weight = 0.2

[receiver_comparer]
dropout = 0.1

[scheduler]
epochs = 100

[experiment]
repeats = 5

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
