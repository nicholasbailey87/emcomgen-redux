# Rung 15: rung 13 with the cross-attention message encoder.
#
# The other half of the listener, and the top of the ladder.
# `ReceiverCrossAttentionLM` reads the message with a decoder stack that
# cross-attends into the candidate set, so the meaning it refines is
# discriminative rather than absolute -- its output is referent-conditioned by
# construction, which is the point of the ordering.
#
# Against rung 13 this moves the message encoder only, the discriminator having
# moved there. The two encoders are now parameter-matched, which they were not
# when this rung was written: the GRU it replaces is 4,687,872 and this stack is
# 4,784,566 at the 6 blocks stated below, +2.1%. That match is why `layers` is 6
# here and 3 on `[receiver_discriminator]`, and it is bought at jayelm's width
# rather than at a shared 256 -- see `layers` in `DEFAULT.toml`. It used to be
# 28,262,400 against 2,466,139, so the 13 -> 15 step was a 26M parameter change
# as well as an architecture one.
#
# The discriminator still shrinks across the step, 2,990,663 to 2,548,295,
# because its `memory_adapter` now reads a 256-wide message rather than the
# GRU's 1024-wide one. Parameter parity between the encoders does not make the
# listeners identical in size, and is not meant to.

name = "ablation"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
contrast = true
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`. That pinning is
# why rung 3 has to come before this one -- a Transformer speaker on top of a
# CNN backbone would inherit whatever width the CNN emits.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 4 blocks, chosen on parameters rather than on taste. A decoder block costs
# 1,376,137 parameters at 320 wide with `ff_inner_size = 576`, so against the
# GRU baseline this speaker measures 0.79x at 3 layers, 1.03x at 4 and 1.27x at
# 5. Four is the closest this arm gets, and it is close: 5,933,047 against
# 5,764,923 on ShapeWorld and 5,938,813 against 5,774,073 on CUB.
#
# The cost of matching on parameters is not matching on depth. Depth or
# parameters, not both, and the ladder is built on parameters.
layers = 4

# `false` selects the autoregressive decoder arm: a learned query array
# cross-attends the two prototypes into a latent memory, and four decoder blocks
# then generate the content symbols one at a time, each conditioned on the
# symbols before it. `true` selects the Perceiver IO arm instead, which emits
# every symbol in one shot.
#
# `false` here, because the GRU baseline at rung 1 is autoregressive too: this
# rung then moves the language model's architecture and nothing else. `true`
# would move the generation regime at the same time, and whatever the
# combination measured could not be attributed to either.
#
# The parallel arm is no longer a rung of its own. It used to sit beside the top
# of the ladder as a fork; to measure it again, copy the topmost rung and flip
# this key -- and note that a difference then covers depth as well as regime,
# since the two arms take 5 and 4 blocks to reach comparable size.
bidirectional = false

[receiver]
feature_model = "ViT2"
language_model = "ReceiverCrossAttentionLM"
discriminator = "AttentionDiscriminator"

[receiver_discriminator]
# Neither listener slot's width is tied to any other width in the run -- each
# adapts the referents into its own space -- so this is sized to buy depth
# rather than to match the repo's other transformers. Depth is what matters
# here: every block is another crossing of the message into the stream the
# scores are read off, where the bilinear discriminator it replaces has exactly
# one. Width bought nothing at that margin.
#
# So 256 wide with a feedforward inner size of 320, against DEFAULT's 320 / 5
# heads / 576 for this table. That keeps the repo-wide head dimension of 64 --
# hence 4 heads rather than 5, since 256 % 4 == 0 where 256 % 5 is not -- and
# gives up the repo-wide feedforward proportion of 1.73 for 1.25, which is what
# pays for the extra blocks.
#
# This stack reads no `bidirectional` key at all: its sequence axis is the
# candidate set, whose order is the label vector, so it is unconditionally
# non-causal and takes no positional embedding. `layers` is a block count and
# its DeepNorm constants are resolved from it -- `decoder=True`, three sublayers
# to the block, so alpha 1.732 and beta 0.408 at 3.
#
# No `token_embedding_size` here. The width the message arrives at is the
# language model's `output_size`, which `build_models` passes in, and
# `memory_adapter` brings it to this `d_model` -- so the two tables' widths need
# not agree and a key restating one in the other could only be wrong.
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[receiver_language_model]
# Widths matched to `[receiver_discriminator]` above and held equal for want of
# a reason to favour either -- see there for where 256 / 4 / 320 comes from.
# `layers` is the exception and is argued for below.
#
# `token_embedding_size` *is* restated here, unlike in the discriminator's
# table: the listener's embedding table is built from this key in `builder.py`
# and then adapted into `d_model`, so matching the two keeps the adapter square.
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
# 6 blocks, against 3 on `[receiver_discriminator]` above, and the one place the
# two tables deliberately disagree. This is where listener parameter parity with
# the GRU arm is paid for: `DEFAULT.toml` restores `[receiver_language_model]` to
# jayelm's 1 layer unidirectional at 1024 wide, which is 4,687,872 parameters,
# and a block of this stack is 772,809, so 6 of them is 4,784,566 -- +2.1%.
# Parity is bought by deepening the arm under test rather than by inflating the
# published baseline; see `layers` in `DEFAULT.toml`.
#
# DeepNorm's constants follow the `"deepnorm"` sentinel from this key, so the
# depth change rescales `alpha` and `beta` on its own with nothing further to
# set.
#
# Note this buys parameter parity and not interface parity: `output_size` is 256
# here against the restored GRU's 1024, so the discriminator downstream is a
# different size on the two arms.
layers = 6

# `true`, i.e. no causal mask, for the same reason the speaker's key is `false`:
# neither is about masking for its own sake. The key is shared with
# `ReceiverGRULM`, which passes it to `nn.GRU(bidirectional=)`;
# `ReceiverCrossAttentionLM` turns it into `causal = not bidirectional` on the
# stack that encodes the incoming message. Masking that stack left to right
# models a listener that must commit to an interpretation of symbol 1 before
# seeing symbol 5, which is not the listening task -- the message arrives whole.
bidirectional = true

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
