# Rung 9: rung 7 with a Transformer sender language model.
#
# The speaker is an autoregressive Transformer: a learned query array
# cross-attends the two prototypes into a latent array, six blocks run over that
# array under a causal mask, and the message is its tail -- one slot per content
# symbol, each read and then overwritten by the symbol it produced, so the next
# slot is conditioned on it. The slots ahead of the message are never
# overwritten, so every symbol reads the referents through them.
#
# 5,854,089 parameters against the GRU baseline's 5,764,923 on ShapeWorld, and
# 5,859,855 against 5,774,073 on CUB -- 1.015x on both, which is what the shared
# 320-wide ViT below it buys. See `[sender_language_model] layers`.
#
# This is the rung the rebalancing was for. At the old widths it was 533,943
# parameters against the GRU's 6,813,499 -- 12.8x smaller -- because
# `SenderTransformerLM` pins its width to the vision model's and ShapeWorld's
# ViT had been sized against Conv4's 113,088. Whatever that rung measured, it was
# not architecture.
#
# The GRU baseline is autoregressive too, so this rung moves the language model's
# architecture and not its generation regime. See `[sender_language_model]`
# below for the parallel arm, which is no longer a rung of its own.
#
# It also no longer moves *how the concept arrives*, which it silently used to.
# `SenderGRULM` builds its initial hidden state from the prototypes through
# `init_h`, so the concept is the state the first symbol is generated from. The
# Transformer speaker used to begin its sequence at SOS -- a constant -- and let
# the concept in only through cross-attention branches scaled by DeepNorm's
# `beta / alpha`, which at init left one seed in five emitting the same first
# symbol for every concept. Reading the message off the latent array puts the
# concept back in the residual stream on both speakers. See docs/anecdotes.md.

name = "ablation"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
contrast = true
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`. That pinning is
# why rung 3 has to come before this one -- a Transformer speaker on top of a
# CNN backbone would inherit whatever width the CNN emits.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 6 blocks, chosen on parameters rather than on taste, and 6 rather than the
# 4 this rung used to take because the blocks got cheaper. They stopped
# cross-attending into a latent memory when the referents moved into the stack's
# input, which cost each block a sublayer -- about 1.6M across the stack. Two
# more blocks and `ff_inner_size = 512` (see DEFAULT.toml) buy that back:
# 5,854,089 against the GRU baseline's 5,764,923 on ShapeWorld and 5,859,855
# against 5,774,073 on CUB, so 1.015x on both. That is closer to 1.0 than the
# 1.029x this rung carried at 4 blocks and 576.
#
# The cost of matching on parameters is not matching on depth, and this rung now
# pays it twice over: 6 blocks against the GRU's 1, and 6 against its own
# previous 4. Depth or parameters, not both, and the ladder is built on
# parameters. Note the depth is *not* free of the design change either, so a
# difference against the runs recorded before 2026-08-26 covers both.
#
# Depth is close to inert for the thing the redesign was for, at least at init:
# measured init-time code strength runs 0.2236 / 0.2158 / 0.2173 / 0.2250 at 4 /
# 5 / 6 / 7 blocks, flat inside the noise. See docs/anecdotes.md.
layers = 6

# `false` selects the causal arm: the blocks run over the latent array under a
# causal mask and the message slots in its tail are generated in order, each
# read and then overwritten by its symbol so the next one is conditioned on it.
# `true` selects the parallel arm, which runs the same blocks unmasked and reads
# the whole tail in one shot.
#
# `false` here, because the GRU baseline at rung 1 is autoregressive too: this
# rung then moves the language model's architecture and nothing else. `true`
# would move the generation regime at the same time, and whatever the
# combination measured could not be attributed to either.
#
# The parallel arm is no longer a rung of its own. It used to sit beside the top
# of the ladder as a fork; to measure it again, copy the topmost rung and flip
# this key. A difference then covers the generation regime and nothing else,
# which is new: the two arms used to be different architectures at different
# sizes, and are now the same blocks at the same size under different masks.
# They differ by `token_embedding` alone -- 5,760 parameters, which only the
# causal arm needs because only it reads a symbol back.
bidirectional = false

# The four rates the removed width/depth rule was producing for this rung when
# it was removed, restated as literals so this rung keeps running what it was
# running. They are `1e-4 * 1024 / d_model / layers`: 320 wide and 10 blocks for
# `ViT2`, 320 and 1 for `AttentionPrototyper` and `ExampleContrast`, 320 and 6
# for `SenderTransformerLM`. Everything else stays at the base `lr`, which is
# what the rule gave it too -- the listener is a 1024-wide GRU and a
# `BilinearDiscriminator` whose fan-in is that same 1024.
#
# Kept rather than flattened to 1e-4 because flat is not a neutral baseline
# here: it is the pre-`89ab6fc` configuration, under which `ignition_audit.py`
# recorded this rung as never leaving `ln 2` across a whole run. The shape of
# these four is also the shape that took birds off at epoch 0 -- the two
# single-layer sender stages carrying the highest rates in the pair and the ViT
# the lowest by an order of magnitude. Whether that shape is right is now an
# empirical question with a knob attached, which is the point of the change that
# introduced this table.
[optimiser.module_lr]
sender_vision = 3.2e-5
sender_prototyper = 3.2e-4
sender_contrast = 3.2e-4
sender_language_model = 5.333333e-5

[scheduler]
epochs = 30

# Ten epochs of linear ascent to the configured rates before the schedule
# proper, added 2026-08-28 alongside DEFAULT's move to 6e-3 on the scaling
# scalars.
#
# The two changes are one experiment. 6e-3 is there so the traverses -- the
# channel's fidelity, the listener's volume and offset, the contrast gate -- are
# not what the run is waiting on; the warm-up is there so that arriving fast is
# not the same as arriving first. A scalar at 6e-3 crosses its whole useful
# range in a few hundred steps, and a channel that opens while the speaker's
# argmax is still close to input-independent is exactly the co-adaptation
# `logit_scale`'s docstring warns about. Under the ramp the scalars reach full
# rate only at epoch 10, by which time the representations have had ten epochs
# at their own rates.
#
# Ten of thirty is a third of this rung's budget and a tenth of the 100-epoch
# runs the real ablation uses; if this is kept, revisit the fraction rather than
# the number. `PASS` scales each parameter group from its own recorded base rate,
# so the ramp applies to the elevated groups and the module groups alike and
# preserves the ratio between them throughout -- which is the quantity the 5e-5
# and 4e-3 runs suggested ignition is actually set by.
warm_up_epochs = 10

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
