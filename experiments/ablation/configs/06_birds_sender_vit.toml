# Rung 6: rung 4 with a Transformer sender vision model.
#
# ViT2 at the shared specification comes to 12,430,908 parameters on CUB's 224px
# images, against ResNet18's 11,176,512 -- 1.11x. The gap to rung 5's 0.91x is
# entirely the patch tokeniser, which scales with image size; see there.
#
# So parity is now approximate rather than tuned -- within about 11% on either
# dataset rather than 1.03x on one and unreachable on the other. That is the
# trade this rebalancing makes, and it is the right way round: a vision model
# 11% off its counterpart is a far smaller confound than a language model 12.8x
# off its counterpart, which is what the old per-dataset widths bought.
#
# The ViT's shape is no longer set here. `[sender_feature_model]` and
# `[receiver_feature_model]` in DEFAULT.toml carry the one specification every
# rung uses -- 320 wide, 10 layers, feedforward inner 554, 5 heads for a head
# dimension of 64 -- so a rung that swaps in a ViT now only has to name it.
#
# That is a change of principle, not just of numbers. The widths used to be
# picked per dataset to match each one's own baseline backbone, which is
# defensible for a vision rung on its own but not once `SenderTransformerLM`
# enters: it pins its width to the vision model's, so ShapeWorld's language
# model inherited 128 and came out 12.8x smaller than the GRU it is compared
# against. One width for both datasets is what makes rungs 7 and 8 comparable.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
