# Rung 14: rung 12 with the speaker's language model in its parallel arm.
#
# CUB's copy of rung 13; see that header for why this pair sits beside rungs 11
# and 12 rather than above them, and why the contrast is taken at the top of the
# ladder rather than at the fork in rung 8.
#
# The speaker is 5,563,260 parameters against the GRU baseline's 5,774,073, or
# -3.5%, where rung 12's decoder speaker is +1.5%.
#
# `train_score_scale` is live here, as on rung 12 and everywhere else.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 5, where the decoder arm on rungs 11 and 12 takes 4. Matching the two arms on
# parameters means not matching them on depth: an encoder block is 944,711
# parameters at this width and a decoder block is 1,354,951, because the decoder
# cross-attends into the latent memory inside every block. Five encoder blocks
# put this arm at 0.965x the GRU baseline and four decoder blocks put the decoder
# arm at 1.015x, which is as close as the two get to the same reference without
# one being sized to the other instead.
#
# So a difference between this rung and rung 11 is a difference of regime and of
# depth together. That is the residual confound in the pair, and it is the one
# that could not be removed: parameters, depth and regime cannot all three be
# held.
layers = 5

# `true`: the parallel Perceiver IO arm, and the one thing this rung moves
# against rung 11. See rung 11's `[sender_language_model] bidirectional` for what
# the two settings select and why the word means what it does on this class.
#
# Note the identically-named key in `[receiver_language_model]` below is a
# different knob on a different module and keeps rung 11's value.
bidirectional = true

[receiver]
feature_model = "ViT2"
language_model = "ReceiverCrossAttentionLM"
discriminator = "AttentionDiscriminator"

[receiver_language_model]
# Neither listener slot's width is tied to any other width in the run -- each
# adapts the referents into its own space -- so both are sized to buy depth
# rather than to match the repo's other transformers. Depth is the thing that
# matters here: every block is another crossing of the message into the stream
# the scores are read off, where the structure this replaced had exactly one.
# Width bought nothing at that margin.
#
# So 256 wide with a feedforward inner size of 320, against DEFAULT's
# 1024 / 5 heads / 576 for this table. That keeps the repo-wide head dimension
# of 64 -- hence 4 heads rather than 5, and 256 % 4 == 0 where 256 % 5 is not --
# and gives up the repo-wide feedforward proportion of 1.73, taking 1.25
# instead. The proportion is the one thing here that is not shared with the
# other stacks, and it is what pays for the extra blocks.
#
# `layers` is a block count and this stack's DeepNorm constants are resolved
# from it -- `decoder=True`, so three sublayers to the block. At 3 that is
# alpha 1.732, beta 0.408. The discriminator resolves its own separately.
#
# `token_embedding_size` is restated because the listener's embedding is built
# from it in `builder.py` and then adapted into `d_model`; matching the two
# keeps the adapter square. `stochastic_depth`, `activation` and the rest are
# inherited.
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
layers = 3

# `true`, and for the same reason rung 7 sets it on `[sender_language_model]`:
# no transformer in this ladder runs a causal mask. The key is shared with
# `ReceiverGRULM`, which passes it to `nn.GRU(bidirectional=)`;
# `ReceiverCrossAttentionLM` instead turns it into `causal = not bidirectional`
# on the stack that encodes the incoming message (`receiver.py`). Masking that
# stack left to right models a listener that must commit to an interpretation
# of symbol 1 before seeing symbol 5, which is not the listening task -- the
# message arrives whole.
bidirectional = true

[receiver_discriminator]
# Matched to the language model above, and held equal for want of a reason to
# favour either -- the same argument the old `message_layers` / `referent_layers`
# pair was settled on. This stack reads no `bidirectional` key at all: its
# sequence axis is the candidate set, whose order is the label vector, so it is
# unconditionally non-causal and takes no positional embedding.
#
# `token_embedding_size` is not restated here. The width the message arrives at
# is the language model's `output_size`, which `build_models` passes in, and
# `memory_adapter` brings it to this `d_model` -- so the two tables' widths need
# not agree and a key restating one in the other could only be wrong.
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
