# Rung 14: rung 12 with the speaker's language model in its parallel arm.
#
# CUB's copy of rung 13; see that header for why this pair sits beside rungs 11
# and 12 rather than above them, and why the contrast is taken at the top of the
# ladder rather than at the fork in rung 8.
#
# The speaker is 5,563,260 parameters against the GRU baseline's 5,774,073, or
# -3.5%, where rung 12's decoder speaker is +1.5%.
#
# `train_score_scale` is live here, as on rung 12 and everywhere else.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 5, where the decoder arm on rungs 11 and 12 takes 4. Matching the two arms on
# parameters means not matching them on depth: an encoder block is 944,711
# parameters at this width and a decoder block is 1,354,951, because the decoder
# cross-attends into the latent memory inside every block. Five encoder blocks
# put this arm at 0.965x the GRU baseline and four decoder blocks put the decoder
# arm at 1.015x, which is as close as the two get to the same reference without
# one being sized to the other instead.
#
# So a difference between this rung and rung 11 is a difference of regime and of
# depth together. That is the residual confound in the pair, and it is the one
# that could not be removed: parameters, depth and regime cannot all three be
# held.
layers = 5

# `true`: the parallel Perceiver IO arm, and the one thing this rung moves
# against rung 11. See rung 11's `[sender_language_model] bidirectional` for what
# the two settings select and why the word means what it does on this class.
#
# Note the identically-named key in `[receiver_comparer]` below is a different
# knob on a different module and keeps rung 11's value.
bidirectional = true

[receiver]
feature_model = "ViT2"
comparer = "TransformerCrossAttentionComparer"

[receiver_comparer]
# This module's width is free of every other width in the run -- it adapts the
# referents (`referent_adapter`) and the message (`message_adapter`) into its
# own space -- so it is sized to buy depth rather than to match the repo's other
# transformers. The module is now two decoder stacks, and depth is the thing
# that matters to it: every block is another crossing of the message into the
# stream the scores are read off, where the structure it replaced had exactly
# one. Width bought nothing at that margin.
#
# So 256 wide with a feedforward inner size of 320, against DEFAULT's 320 / 5
# heads / 576. That keeps the repo-wide head dimension of 64 -- hence 4 heads
# rather than 5, and 256 % 4 == 0 where 256 % 5 is not -- and gives up the
# repo-wide feedforward proportion of 1.73, taking 1.25 instead. The proportion
# is the one thing here that is not shared with the other stacks, and it is what
# pays for the extra blocks.
#
# 3 and 3 is then the depth: 4,781,727 parameters, against
# `BilinearGRUComparer`'s 5,015,553 on the ViT referents of rungs 9 and 10, or
# 0.95x -- tighter than the 1.05x the previous structure managed at 5,272,606.
# 2 and 2 would be 0.65x and 4 and 4 would be 1.26x, so 3 is the only depth
# inside the 10% the ladder aims at, and the two stacks are held equal for want
# of a reason to favour either.
#
# `message_layers` and `referent_layers` are block counts, and each stack's
# DeepNorm constants are resolved from its own -- `decoder=True`, so three
# sublayers to the block. At 3 that is alpha 1.732, beta 0.408.
#
# `token_embedding_size` is restated because the listener's embedding is built
# from it in `builder.py` and then adapted into `d_model`; matching the two
# keeps the adapter square. DEFAULT's 1024 `d_model` in that section is
# `BilinearGRUComparer`'s hidden size, not this class's; `stochastic_depth`,
# `activation` and the rest are read only by this class and are inherited.
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
message_layers = 3
referent_layers = 3

# `true`, and for the same reason rung 7 sets it on `[sender_language_model]`:
# no transformer in this ladder runs a causal mask. The key is shared with
# `BilinearGRUComparer`, which passes it to `nn.GRU(bidirectional=)` and where
# DEFAULT.toml's `false` still applies; `TransformerCrossAttentionComparer`
# instead turns it into `causal = not bidirectional` on the stack that encodes
# the incoming message (`receiver.py`). Masking that stack left to right models
# a listener that must commit to an interpretation of symbol 1 before seeing
# symbol 5, which is not the listening task -- the message arrives whole. The
# referent stack is unconditionally non-causal and does not read this key at
# all: its sequence axis is the candidate set, whose order is the label vector.
bidirectional = true

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
