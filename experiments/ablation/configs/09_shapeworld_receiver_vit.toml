# Rung 9: rung 7 with the receiver's vision model updated to match the
# sender's.
#
# The same ViT2 specification the sender took in rung 5, so 10,177,420
# parameters against ResNet18SmallInput's 11,168,832. The comparer is still
# `BilinearGRUComparer`, which reads the referent embeddings through a bias-free
# bilinear projection, so changing the receiver's referent width from 512 to 320
# rescales that projection and nothing else -- the comparer's own GRU is
# unaffected. Rung 11 replaces it.

name = "ablation"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 5

[receiver]
feature_model = "ViT2"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
