# Rung 3b: rung 3 with every learning rate halved.
#
# A variant of rung 3, not a seventeenth rung. It is read as a pair with 03 --
# same seed, same architecture, same schedule shape, same thirty epochs -- and
# means nothing against the ladder on its own.
#
# What it is testing. On the 2026-08-30 ablation rung 3 collapsed at epoch 10:
# `logit_prior_share` 0.891 -> 0.9992 and `referent_spread` 0.221 -> 0.0040 in a
# single epoch, then flat to four decimal places for the remaining twenty, with
# `clip_sender_vision` decaying to 4e-4. The speaker's vision trunk stopped
# varying with its input and never restarted.
#
# Epoch 10 is `warm_up_epochs`, but it is not a discontinuity.
# `train.py:build_lr_schedule` puts an `ascent` from zero to base over the
# warm-up and then a `flat` stage that opens at base, so the two meet and the
# rate is continuous through the join -- at epoch 9 it is already near base.
# What epoch 10 actually is, is the first point at which the rate reaches its
# maximum and stays there. A smooth ramp producing a one-epoch collapse is what
# crossing a stability threshold looks like, not what a shock looks like, and
# halving every rate is the direct test of that reading.
#
# The cost, and why it is affordable. Every traverse doubles in epochs, and
# escape speed is what separates the arms that live from the ones that die --
# rung 9 got out at epoch 3 and rode through epoch 10 untouched, rung 3 never
# did. But rung 9 escaped at roughly 30% of base rate, so escape does not need
# the full one; halved, it should land near epoch 6 and still be clear of the
# join. If 3b escapes and 3 does not, the threshold reading is right. If 3b dies
# on the same epoch, the rate's magnitude is not what is doing it.
#
# Halved uniformly, including the scalars. Halving only the module rates would
# change the ratio between the stack and the four listener-side scalars that run
# at 60x base, and that ratio is not what is being tested.

name = "ablation"

[sender]
feature_model = "ViT2"

[optimiser]
lr = 5e-5
score_scale_lr = 3e-3
score_bias_lr = 3e-3
polarity_embedding_lr = 1e-4
mix_logit_lr = 3e-3
contrast_gate_lr = 3e-3

[optimiser.module_lr]
sender_vision = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 5e-5
receiver_token_embedding = 5e-5
receiver_language_model = 5e-5
receiver_discriminator = 5e-5

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
