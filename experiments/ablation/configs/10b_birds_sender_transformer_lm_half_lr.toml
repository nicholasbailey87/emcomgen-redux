# Rung 10b: rung 10 with every learning rate halved.
#
# A variant of rung 10, read as a pair with it. Everything below the optimiser
# block is rung 10's, verbatim.
#
# Why. Under the straight-through readout
# (`model_util.scale_without_attenuating`, b72e5e6) rung 10 stops improving at
# epoch 21 and sheds seven points by 29 -- test_avg_acc 0.661 -> 0.588 with
# train_acc still climbing to 0.672, so the train/test gap widens 0.031 -> 0.084
# against the same rung before the change. The ceiling barely moved (0.661
# against 0.671); what changed is that the run now turns over. That is
# overfitting, and it arrives with `clip_sender_vision` at 148.6 against 4.15 --
# 36x more gradient reaching the speaker's trunk, which is exactly what the
# change was for and, on this rung, more than it wanted.
#
# The reading behind that. `score_scale` scaled speaker learning by how
# confident the listener was, so it was an automatic gain control: do not train
# the speaker hard while the listener still cannot tell anything apart. Rung 3
# was starved and needed it gone; rung 10 was not, and now overshoots. Halving
# every rate is the cheapest way to ask whether the speaker simply has too much
# step for this rung under the new gradient.
#
# **This rung is now damped on both arms, and that is the risk.** Its own
# `[optimiser]` comment records that it "wants either half the rate or twice the
# batch", and it already took the batch arm at `accumulator_steps = 2`. Those
# two are interchangeable only in a noise-dominated regime, so taking both is
# not twice the fix -- it may be well past the point where the speaker can move
# at all. If 10b is worse than 10 at *both* ends rather than merely flatter,
# that is the answer and the batch arm is the one to give back.
#
# Halved uniformly, including the scalars, so the ratio between the stack and
# the scalars at 60x base is not what is being tested. `logit_scale_lr` is one
# of those again as of 2026-08-31 and is halved with the rest.
#
#
# The speaker is an autoregressive Transformer: a learned query array
# cross-attends the two prototypes into a latent array, six blocks run over that
# array under a causal mask, and the message is its tail -- one slot per content
# symbol, each read and then overwritten by the symbol it produced, so the next
# slot is conditioned on it. The slots ahead of the message are never
# overwritten, so every symbol reads the referents through them.
#
# 5,854,089 parameters against the GRU baseline's 5,764,923 on ShapeWorld, and
# 5,859,855 against 5,774,073 on CUB -- 1.015x on both, which is what the shared
# 320-wide ViT below it buys. See `[sender_language_model] layers`.
#
# This is the rung the rebalancing was for. At the old widths it was 533,943
# parameters against the GRU's 6,813,499 -- 12.8x smaller -- because
# `SenderTransformerLM` pins its width to the vision model's and ShapeWorld's
# ViT had been sized against Conv4's 113,088. Whatever that rung measured, it was
# not architecture.
#
# The GRU baseline is autoregressive too, so this rung moves the language model's
# architecture and not its generation regime. See `[sender_language_model]`
# below for the parallel arm, which is no longer a rung of its own.
#
# It also no longer moves *how the concept arrives*, which it silently used to.
# `SenderGRULM` builds its initial hidden state from the prototypes through
# `init_h`, so the concept is the state the first symbol is generated from. The
# Transformer speaker used to begin its sequence at SOS -- a constant -- and let
# the concept in only through cross-attention branches scaled by DeepNorm's
# `beta / alpha`, which at init left one seed in five emitting the same first
# symbol for every concept. Reading the message off the latent array puts the
# concept back in the residual stream on both speakers. See docs/anecdotes.md.

name = "ablation"

[data]
dataset = "../data/cub"

# 5,000 games an epoch rather than birds' default 3,100, for step parity with
# ShapeWorld under the `accumulator_steps = 2` below: 5,000 / (16 x 2) = 156.25,
# and ShapeWorld's 20,000 / (32 x 4) = 156.25. The same number and the same
# remainder, so the odd trailing batch is left unstepped on both.
#
# Parity is retaken here rather than restored in general. DEFAULT.toml retired
# it deliberately when 3,100 was set for coverage -- the coupon-collector point
# at which an epoch first reaches all 150 species' training images, `N ln N / 20`
# = 3,123 -- and coverage is not what is being traded away: 5,000 clears that
# point by 60%, and `CUBDataset.__getitem__` ignores its index and samples a
# fresh game, so nothing is exhausted by drawing more of them.
#
# What it does not buy is parity of gradient quality. Birds still sees 5,000
# games an epoch at an effective batch of 32 against ShapeWorld's 20,000 at 128.
# The steps are matched; what goes into each of them is not.
games_per_epoch = 5000

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
contrast = true
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`. That pinning is
# why rung 3 has to come before this one -- a Transformer speaker on top of a
# CNN backbone would inherit whatever width the CNN emits.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 6 blocks and `ff_inner_size = 512`, which together hold the speaker's language
# model at 1.015x the GRU baseline's -- 5,859,855 against 5,774,073 here. The
# blocks lost their cross-attention sublayer when the referents moved into the
# stack's input, so they are cheaper and there are more of them. Rung 9 carries
# the argument; this rung is its twin on CUB and takes the same depth, which is
# the point of the pair.
layers = 6

# `false` selects the causal arm: the blocks run over the latent array under a
# causal mask and the message slots in its tail are generated in order, each
# read and then overwritten by its symbol so the next one is conditioned on it.
# `true` selects the parallel arm, which runs the same blocks unmasked and reads
# the whole tail in one shot.
#
# `false` here, because the GRU baseline at rung 1 is autoregressive too: this
# rung then moves the language model's architecture and nothing else. `true`
# would move the generation regime at the same time, and whatever the
# combination measured could not be attributed to either.
#
# The parallel arm is no longer a rung of its own. It used to sit beside the top
# of the ladder as a fork; to measure it again, copy the topmost rung and flip
# this key. A difference then covers the generation regime and nothing else,
# which is new: the two arms used to be different architectures at different
# sizes, and are now the same blocks at the same size under different masks.
# They differ by `token_embedding` alone -- 5,760 parameters, which only the
# causal arm needs because only it reads a symbol back.
bidirectional = false

[optimiser]
# Effective batch 32 rather than birds' default 16 (`batch_size` 16 at
# `[birds.optimiser] accumulator_steps = 1`), against ShapeWorld's 128.
#
# This is the batch-side arm of the observation that this rung wants either half
# the rate or twice the batch. That the two are interchangeable at all is the
# diagnosis: they only buy the same thing in a noise-dominated regime, since a
# step that were simply too large for the curvature would not be rescued by
# averaging more samples into it. The target is therefore the variance of the
# speaker's gradient rather than the size of the step, and this arm attacks it
# where halving `lr` only makes the run less sensitive to it.
#
# What it does not cost. `games_per_epoch = 3100` is set for coverage -- the
# coupon-collector point at which an epoch first reaches all of the training
# images -- and an epoch still draws 3,100 games, so the clock the epoch counter
# provides for the learning-rate schedule is unchanged.
#
# What it does cost. Accumulation halves the step count at a fixed game count,
# which is why `games_per_epoch` above moves with it -- 5,000 games at an
# effective batch of 32 restores the 156 steps an epoch that 3,100 at 16 was
# producing, so no `lr * steps` travel budget is given up. Without that raise
# the cost would fall hardest on the remaining lone scalars -- the listener's
# volume and offset, the contrast gate -- and docs/anecdotes.md works out why:
# sign consistency less 0.5 grows as the root of the batch while the step count
# falls as the batch, so accumulation is a net loss for a lone Adam scalar even
# where it is a net gain for the modules above it.
#
# The speaker's channel scale is the sharpest case of that. It was briefly not a
# parameter at all -- a constant, between 2026-08-30 and 2026-08-31 -- and is a
# lone scalar again, so the traverse is back in the budget: `logit_scale_lr` at
# 6e-3 over 156.25 steps an epoch covers `ln 2` in 0.74 of an epoch. See
# docs/channel.md.
#
# Note those figures are the rate after the warm-up. This rung takes
# DEFAULT.toml's `warm_up_epochs = 10` and its `lr_schedule_shape = "flat"`, so
# the rate ascends from zero over the first ten epochs and then holds at the
# configured value for the remaining ninety. The travel budget over a whole run
# is therefore 95% of what a flat opening would give -- the ramp averages half
# rate across ten of a hundred epochs -- which does not move any of the
# arithmetic above.
#
# This is the first rung to run a warm-up at all: it was configured on every
# rung from `b298da5` and ran on none of them until the schedule was fixed. See
# `train.build_lr_schedule` and docs/training.md.
accumulator_steps = 2

# ---- 10b: every rate halved. See the header. ----
lr = 5e-5
logit_scale_lr = 3e-3
score_scale_lr = 3e-3
score_bias_lr = 3e-3
polarity_embedding_lr = 1e-4
mix_logit_lr = 3e-3
contrast_gate_lr = 3e-3

[optimiser.module_lr]
sender_vision = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 5e-5
receiver_token_embedding = 5e-5
receiver_language_model = 5e-5
receiver_discriminator = 5e-5

[scheduler]
# The smoke-run length rungs 9 and 10 have been using, and the same 30 every
# other rung on the ladder states for itself. DEFAULT.toml's 100 is the notional
# full run and no rung takes it.
#
# Comfortable against the `[slurm] time` below. At ~4 min an epoch on 3,100
# games, 5,000 scales that to ~6.5 min and 30 epochs to ~3.3h against the 24h
# budget; `accumulator_steps` costs nothing, compute following games seen rather
# than optimiser steps. Even the 5.84 min an epoch an older rung 10 ran at
# (`run-10-maybe-old.csv`) would come in around 4.7h.
#
# Note what this does to the warm-up. Ten epochs of ramp is a third of a
# 30-epoch run rather than the tenth DEFAULT.toml sized it as -- its own comment
# says to revisit the figure as a fraction rather than a count if it is kept.
# Rung 9 is in the same position, so the two stay comparable, but neither is
# comparable to a birds trace opening at full rate.
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
