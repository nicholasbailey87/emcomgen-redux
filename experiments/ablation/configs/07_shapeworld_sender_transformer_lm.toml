# Rung 7: rung 5 with a Transformer sender language model.
#
# This is the rung the rebalancing was for. At the old widths it was 533,943
# parameters against the GRU's 6,813,499 -- 12.8x smaller -- because
# `SenderTransformerLM` pins its width to the vision model's and ShapeWorld's
# ViT had been sized against Conv4's 113,088. Whatever that rung measured, it
# was not architecture.
#
# At 320 wide with 5 layers it is 5,562,934 against the GRU's 5,764,923, or
# -3.5%. The GRU figure moved too: its referent width fell from Conv4's 1024 to
# ResNet18's 512 when the baseline backbone changed, which is most of why the
# two now meet.
#
# The speaker also gains a latent phase at this rung -- see
# `latent_message_multiplier` in DEFAULT.toml. It is a Perceiver IO now: the
# learned query array is twice the message length, the self-attention stack runs
# over that, and a second learned query reads it back down to 5 symbols. About
# 419k of the count above is the decoder cross-attention that makes that
# possible.

name = "ablation"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 5

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
