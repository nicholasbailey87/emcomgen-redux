# Rung 3c: rung 3 with receiver silhouetting raised from 0.1 to 0.2.
#
# A variant of rung 3, read as a pair with it. Everything else is rung 3's.
#
# Why now. Under the straight-through readout
# (`model_util.scale_without_attenuating`, b72e5e6) rung 3 escaped the collapse
# it died in -- test_avg_acc 0.497 -> 0.617, `logit_prior_share` 0.9992 -> 0.233,
# `referent_spread` 0.0039 -> 1.09, one message at eval -> 225. What it did not
# escape is the colour shortcut: `test_avg_acc_md_color` 0.794 against
# `test_avg_acc_md_shape` 0.509. The run now learns the shortcut properly where
# it used to learn nothing.
#
# That is the exact trigger DEFAULT.toml writes down for this key -- "if the
# colour-only minimum returns -- the tell is shape falling back to ~0.52 while
# colour sits near 0.80 -- titrate upwards". So this is the documented response
# rather than a new idea.
#
# **0.2, where DEFAULT.toml says to titrate from 0.25.** Deliberately under it.
# The reason that comment gives for 0.5 being too strong is that silhouetting
# suppresses the *channel* and not only the colour feature: at 0.5, half the
# receiver's games contained nothing worth decoding, `unmixed_survival` sat at
# ~0.28 against ~0.45 at 0.0, and "this channel has no learned scale to
# compensate with". Rung 3 has only just escaped a channel collapse, so the
# smaller step is the one that keeps the failure it is coming back from
# distinguishable from the one being probed for.
#
# How to read it, and only this way. On the `md_shape` / `md_color` breakdown,
# never on the aggregate -- which reads the same for a language with one feature
# and for one with both, and is how the 0.5 result hid a bimodal outcome. The
# result wanted is shape rising off 0.51 with colour holding; shape rising while
# colour falls to chance is the mirror-image failure and means 0.2 is already
# too strong here. Watch `unmixed_survival` and `logit_prior_share` alongside:
# if the channel goes back to a constant message, the key has suppressed the
# channel rather than the feature and the answer is not more of it.
#
#
# ViT2 at the shared specification comes to 10,317,986 parameters on
# ShapeWorld's 64px images, against ResNet18SmallInput's 11,168,832 -- 0.92x.
#
# Note the ViT is *not* the same size on both datasets even at identical
# settings, because its patch tokeniser scales with the image. At 64px the
# pooling kernel is 8 and each token carries 8*8*3 = 192 channels; at 224px the
# kernel is 28 and each token carries 2352. Both land on the same 17x17 token
# grid, so only the tokeniser differs -- but it differs by 1,014,640 parameters.
# See rung 4 for the birds figure.
#
# The vision swap comes *before* the prototyper now, where the old ladder took
# them the other way round. Two reasons. The prototyper pools the backbone's
# output, so an attention pooler measured over ResNet features and one measured
# over ViT features are different experiments, and putting vision first means
# every rung above it pools the same kind of vector. And the speaker's language
# model at rung 9 pins its width to the vision model's, so the ViT has to be in
# place well before then for that rung to be about the language model.
#
# The ViT's shape is not set here. `[sender_feature_model]` and
# `[receiver_feature_model]` in DEFAULT.toml carry the one specification every
# rung uses -- 320 wide, 10 layers, feedforward inner 576, 5 heads for a head
# dimension of 64 -- so a rung that swaps in a ViT only has to name it.
#
# That is a change of principle, not just of numbers. The widths used to be
# picked per dataset to match each one's own baseline backbone, which is
# defensible for a vision rung on its own but not once `SenderTransformerLM`
# enters at rung 9: it pins its width to the vision model's, so ShapeWorld's
# language model inherited 128 and came out 12.8x smaller than the GRU it is
# compared against. One width for both datasets is what makes rungs 9 and 10
# comparable.

name = "ablation"

[data]
# 0.1 on the ladder. See the header for why 0.2 and not 0.25.
silhouette_p_receiver = 0.2

[optimiser]
lr = 5e-5
logit_scale_lr = 3e-3
score_scale_lr = 3e-3
score_bias_lr = 3e-3
polarity_embedding_lr = 1e-4
mix_logit_lr = 3e-3
contrast_gate_lr = 3e-3

[optimiser.module_lr]
sender_vision = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 5e-5
receiver_token_embedding = 5e-5
receiver_language_model = 5e-5
receiver_discriminator = 5e-5

[sender]
feature_model = "ViT2"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
