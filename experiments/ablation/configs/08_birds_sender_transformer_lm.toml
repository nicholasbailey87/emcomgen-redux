# Rung 8: rung 6 with a Transformer sender language model.
#
# 5,569,660 parameters against the GRU's 5,774,073, or -3.5% -- the same offset
# rung 7 reaches on ShapeWorld, which is the point of giving both datasets the
# same width. It was 0.2% here before, but only by luck of the per-dataset
# sizing, and the same luck left ShapeWorld 12.8x short.
#
# The message is longer here (8 content symbols against ShapeWorld's 5), so the
# latent array is 16 rather than 10 and the referents reach the language model
# through 5 heads x 16 latents = 80 scalars rather than 50. See
# `latent_message_multiplier` in DEFAULT.toml for why that number is worth
# tracking at all.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 5

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
