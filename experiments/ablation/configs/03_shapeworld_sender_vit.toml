# Rung 3: rung 1 with a Transformer sender vision model.
#
# ViT2 at the shared specification comes to 10,317,986 parameters on
# ShapeWorld's 64px images, against ResNet18SmallInput's 11,168,832 -- 0.92x.
#
# Note the ViT is *not* the same size on both datasets even at identical
# settings, because its patch tokeniser scales with the image. At 64px the
# pooling kernel is 8 and each token carries 8*8*3 = 192 channels; at 224px the
# kernel is 28 and each token carries 2352. Both land on the same 17x17 token
# grid, so only the tokeniser differs -- but it differs by 1,014,640 parameters.
# See rung 4 for the birds figure.
#
# The vision swap comes *before* the prototyper now, where the old ladder took
# them the other way round. Two reasons. The prototyper pools the backbone's
# output, so an attention pooler measured over ResNet features and one measured
# over ViT features are different experiments, and putting vision first means
# every rung above it pools the same kind of vector. And the speaker's language
# model at rung 9 pins its width to the vision model's, so the ViT has to be in
# place well before then for that rung to be about the language model.
#
# The ViT's shape is not set here. `[sender_feature_model]` and
# `[receiver_feature_model]` in DEFAULT.toml carry the one specification every
# rung uses -- 320 wide, 10 layers, feedforward inner 576, 5 heads for a head
# dimension of 64 -- so a rung that swaps in a ViT only has to name it.
#
# That is a change of principle, not just of numbers. The widths used to be
# picked per dataset to match each one's own baseline backbone, which is
# defensible for a vision rung on its own but not once `SenderTransformerLM`
# enters at rung 9: it pins its width to the vision model's, so ShapeWorld's
# language model inherited 128 and came out 12.8x smaller than the GRU it is
# compared against. One width for both datasets is what makes rungs 9 and 10
# comparable.

name = "ablation"

[sender]
feature_model = "ViT2"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
