# Rung 10: rung 8 with the receiver's vision model updated to match the
# sender's.
#
# The same ViT2 specification the sender took in rung 6, so 12,338,428
# parameters against ResNet18's 11,176,512. Unlike the sender's language model,
# the receiver's comparer is not pinned to this width -- it adapts whatever
# referent width it is given through `referent_adapter` -- so this rung changes
# the receiver's vision in isolation.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
feature_model = "ViT2"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerLM"

[sender_language_model]
# Both must equal `sender_feature_model.d_model`: `SenderTransformerLM`
# layer-norms the incoming prototypes at its own `d_model` and separately
# rejects `token_embedding_size != referent_embedding_size`.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 4, where the latent arm takes 5, and the difference is parameters rather than
# taste. A decoder block carries a cross-attention the encoder block does not,
# so it costs about 4*d_model^2 more: 1,376,137 against 965,897 at 320 wide with
# `ff_inner_size = 576`. At 5 layers this speaker would be 7,309,184 parameters,
# or 1.36x the GRU baseline; at 4 it is 5,933,047, or 1.10x. Three would be
# 0.85x, so 4 is the closest this arm gets.
#
# Two of those numbers moved for two different reasons, and only one of them is
# `ff_inner_size`. Raising it 554 -> 576 for tensor-core alignment (see
# DEFAULT.toml) added about 1.4% here, which changes nothing. The ratios are the
# other reason: they read 1.25x, 1.015x and 0.78x when this comment was written,
# against a `SenderGRULM` baseline about 7% larger than the one the code now
# builds. The counts above are measured against the current tree -- 5,371,707 on
# ShapeWorld, 5,380,857 on birds, the two within 0.2% of each other -- so the
# drift is in the baseline, not in this arm.
#
# That reverses one claim this comment used to make. The latent arm at 5 layers
# is now 1.05x, a *tighter* match to the baseline than this arm's 1.10x, where
# it used to be the looser of the two at 0.965x. The ladder still picks 4 here,
# since 3 is further out on the other side, but "closest available" is a weaker
# warrant than "1.015x" was, and the two Transformer arms are no longer matched
# to the same tolerance. Worth re-deriving the ladder against the current
# baseline before the ablation is read as a capacity-matched comparison.
#
# The cost of matching parameters is that the two Transformer arms differ in
# depth as well as in where their layers act. Depth or parameters, not both, and
# the ladder is built on parameters.
layers = 4

# `false`, matching DEFAULT.toml, and the flag does not mean here what it means
# for the GRU baselines -- but it does mean the same *thing*.
#
# The key is shared with `SenderGRULM`, which passes it to
# `nn.GRU(bidirectional=)`; `false` there is a speaker that generates left to
# right and cannot read its own message backwards. On `SenderTransformerLM`
# `false` selects an architecture rather than a mask: a proper autoregressive
# decoder, whose blocks run at message length and cross-attend into the latent
# array, sampling one symbol at a time with each conditioned on the symbols
# before it. `true` selects the other arm -- the Perceiver IO shape, whose
# self-attention runs over the latent array and whose symbols are all emitted in
# one shot. Rungs 13 and 14 run that arm; see their headers.
#
# So `false` is the causal, left-to-right speaker on both classes, which is what
# the word already meant for the GRU. What it no longer does on this class is
# mask the *latent* array left to right, which is what it used to do and which
# bought nothing: the latent array is not a sequence in time, so that mask only
# hid most of the image from the low-index latents.
#
# This is the rung that makes the ladder honest. Against a GRU baseline, the
# `true` arm moves two things at once -- GRU to Transformer, and autoregressive
# to parallel -- so whatever it measures cannot be attributed to architecture.
# This arm moves one.
bidirectional = false

[receiver]
feature_model = "ViT2"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
