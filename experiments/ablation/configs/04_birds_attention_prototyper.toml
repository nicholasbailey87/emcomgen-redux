# Rung 4: rung 2 with the attention prototyper.
#
# The CUB counterpart of rung 3. ResNet18 emits 512-d, so the prototyper adds
# 2 x 513 = 1,026 parameters here -- and since rung 1's backbone changed to
# ResNet18SmallInput, which is the same network with a different stem, rung 3
# now adds exactly the same.

name = "ablation"

[data]
dataset = "../data/cub"

[sender]
prototyper = "AttentionPrototyper"

[scheduler]
epochs = 30

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
