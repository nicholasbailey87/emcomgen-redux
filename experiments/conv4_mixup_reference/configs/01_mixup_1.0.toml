# conv4_mixup_reference: `conv4_lr_reference/02_lr_1e-4.toml` with every
# augmentation this repo has except silhouetting. One arm, one repeat.
#
# Based on the unsilhouetted baseline rather than on
# `conv4_silhouette_reference`, so that mixup is the only difference from a run
# already finished at 100 epochs. That run is the one this is aimed at: 0.913
# train accuracy against 0.564, `test_same` no better than `test` on shape, and
# a `test` accuracy below chance whose shuffled-message baseline is lower still
# -- an image prior fitted to the training concepts and applied to a disjoint
# set, which does not land on 0.5 but under it.
#
# `alpha = 1.0` is `Beta(1, 1)`, uniform `lambda`. The mixup paper prefers 0.2
# on ImageNet because larger values underfit; underfitting is not the problem
# here, and 0.2 leaves most candidates nearly clean.
#
# Read `test_acc - test_shuffled_message_acc` rather than `test_acc`. The gap is
# what the message buys, and it is the quantity the image prior does not mask.
#
# `train_acc` is not comparable to the baseline's: with mixup on,
# `per_game_accuracy` scores against `lis_y > 0.5`, i.e. the dominant source of
# each blend. `train_loss` is comparable, and so is everything on the eval
# splits, which are never mixed.
#
# The flips and the rotation are on alongside the mixup rather than held back.
# They attack the same memorisation from a different side -- the geometry
# changes which pixels a stored image presents, the mixup stops any stored image
# being presented alone -- and this arm is asking whether the memorisation can
# be broken at all, not which of the two breaks it. Separating them is the next
# question and only worth asking if this one answers yes.
#
# Silhouetting stays off, so the comparison against `02_lr_1e-4.toml` is
# augmentation against none, and the comparison against
# `conv4_silhouette_reference` is augmentation against the colour shortcut being
# removed. Those are different interventions and this keeps them apart.

name = "conv4_mixup_reference"

[sender]
feature_model = "Conv4"

[receiver]
feature_model = "Conv4"

[data]
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.0
augment_flip = true
augment_affine_degrees = 10.0
mixup_alpha = 1.0

[scheduler]
epochs = 100
warm_up_epochs = 0
lr_schedule_shape = "flat"

[optimiser]
lr = 1e-4

[optimiser.module_lr]
sender_vision = 1e-4
sender_adapter = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 1e-4
receiver_adapter = 1e-4
receiver_token_embedding = 1e-4
receiver_language_model = 1e-4
receiver_discriminator = 1e-4

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
