# lr_sweep_3_attention_prototyper arm: `AttentionPrototyper` at 1e-5 on CUB.
#
# See `01_shapeworld_1e-5.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate, in the dataset, and in
# carrying a `[data]` block, since ShapeWorld is the default.
#
# ---
#
# **This arm: `AttentionPrototyper` at 1e-5 on CUB**, copying ablation rung 06.

name = "lr_sweep_3_attention_prototyper"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"

[optimiser.implementation_lr.sender_prototyper]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
AttentionPrototyper = 1e-5

[scheduler]
epochs = 20

[experiment]
repeats = 1
