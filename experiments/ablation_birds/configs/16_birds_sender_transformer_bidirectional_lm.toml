# Rung 16: rung 14 with the parallel speaker.
#
# One change: `[sender] language_model` goes from
# `SenderTransformerAutoregressiveLM` to `SenderTransformerBidirectionalLM`. The
# speaker stops generating its message one symbol at a time and reads the whole
# of it off the latent array in one pass. Every other key is rung 14's.
#
# **Why it sits at the top.** This step is Transformer to Transformer, so the
# only thing it moves is the generation regime: the two classes are one
# implementation, `SenderTransformerLM`, running the same blocks under a causal
# mask or none. Placed at rung 8 -- where the GRU gives way to a Transformer --
# it would have moved the regime and the architecture in one step, and whatever
# the combination measured could not be attributed to either. Appended rather
# than inserted, so rungs 1 to 14 keep their numbers.
#
# **Parameter-matched to the rung below.** The speaker's language model is
# 6,756,440 here against 6,764,120 on rung 14; the difference is the causal arm's
# `token_embedding`, which the parallel arm has no use for because it never
# reads a symbol back. Against the GRU baseline's 6,822,649 that is 0.990x, inside
# the band `test_the_speakers_language_models_are_matched` pins.
#
# **What to watch.**
#
# * A drop here may be the channel rather than the regime. The causal speaker
#   reads each committed symbol back, so a symbol the Gumbel noise or the
#   uniform mixture flipped is something the rest of the message is conditioned
#   on and can work around. The parallel speaker has already emitted every
#   symbol by then and cannot compensate. Read `train_realised_survival` against
#   rung 14's before reading accuracy as a verdict on the regime.
# * Order. The parallel arm has no left-to-right structure to impose on its
#   message, so the gap between `test_avg_topsim_s6` (hard Levenshtein, order
#   matters) and `test_avg_topsim_s4` (hard 1-gram MoverScore, order ignored) is
#   the column to set against rung 14's. A gap that closes says the causal
#   speaker's structure was carried by order.

name = "ablation_birds"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerBidirectionalLM"

[sender_language_model]
# The two must equal *each other*, and neither has anything to do with the
# vision model's width. `SenderTransformerLM` layer-norms the incoming
# prototypes at its own `d_model` and separately rejects
# `token_embedding_size != referent_embedding_size`, so these two are pinned
# together -- but the referents arrive already at this `d_model`:
# `builder.build_models` sets `sender_referent_width` from *this* table and the
# speaker's adapter brings `final_feat_dim` to it, whatever the backbone emits.
#
# The comment this replaces said both keys "must equal
# `sender_feature_model.d_model`". That was true of the speaker before the
# adapter landed and has been false since; verified by building rung 11 with a
# 128-wide vision model under a 320-wide language model. It is worth naming
# rather than deleting, because ShapeWorld's ViT2 is 128 wide now -- narrowed to
# match `ResNet56` -- and under the old reading that narrowing would have
# dragged this stack, and the whole capacity match against the GRU baseline,
# down with it. Rung 3 still comes before this one, but for the ordering of the
# ladder rather than for a width constraint.
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere

# 7 blocks and `ff_inner_size = 512`, which together hold the speaker's language
# model at 0.990x the GRU baseline's on this arm. The argument is at rung 8.
layers = 7

# The parallel arm, chosen by `language_model = "SenderTransformerBidirectionalLM"`
# above rather than by `bidirectional`, which this class overrides. The blocks
# run over the latent array unmasked and the message is its tail, read in one
# shot. `layers` is rung 14's: the two arms are parameter-matched at equal
# depth, so no depth change is needed to hold the match.

[receiver]
feature_model = "BirdsViT"
language_model = "ReceiverCrossAttentionLM"
discriminator = "AttentionDiscriminator"

[receiver_discriminator]
# Neither listener slot's width is tied to any other width in the run -- each
# adapts the referents into its own space -- so this is sized to buy depth
# rather than to match the repo's other transformers. Depth is what matters
# here: every block is another crossing of the message into the stream the
# scores are read off, where the bilinear discriminator it replaces has exactly
# one. Width bought nothing at that margin.
#
# So 256 wide with a feedforward inner size of 320, against DEFAULT's 320 / 5
# heads / 576 for this table. That keeps the repo-wide head dimension of 64 --
# hence 4 heads rather than 5, since 256 % 4 == 0 where 256 % 5 is not -- and
# gives up the repo-wide feedforward proportion of 1.73 for 1.25, which is what
# pays for the extra blocks.
#
# This stack reads no `bidirectional` key at all: its sequence axis is the
# candidate set, whose order is the label vector, so it is unconditionally
# non-causal and takes no positional embedding. `layers` is a block count and
# its DeepNorm constants are resolved from it -- `decoder=True`, three sublayers
# to the block, so alpha 1.732 and beta 0.408 at 3.
#
# No `token_embedding_size` here. The width the message arrives at is the
# language model's `output_size`, which `build_models` passes in, and
# `Receiver`'s message interface brings it to this `d_model` -- so the two
# tables' widths need not agree and a key restating one in the other could only
# be wrong.
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[receiver_language_model]
# Widths matched to `[receiver_discriminator]` above and held equal for want of
# a reason to favour either -- see there for where 256 / 4 / 320 comes from.
# `layers` is the exception and is argued for below.
#
# `token_embedding_size` *is* restated here, unlike in the discriminator's
# table: the listener's embedding table is built from this key in `builder.py`
# and then adapted into `d_model`, so matching the two keeps the adapter square.
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
# 6 blocks, against 3 on `[receiver_discriminator]` above, and the one place the
# two tables deliberately disagree. This is where listener parameter parity with
# the GRU arm is paid for: `DEFAULT.toml` restores `[receiver_language_model]` to
# jayelm's 1 layer unidirectional at 1024 wide, which is 4,687,872 parameters,
# and a block of this stack is 772,809, so 6 of them is 4,702,646 -- +0.3%. The
# match got closer, not looser: this stack's `referent_adapter` is one of
# `Receiver`'s interfaces now, and the GRU never had anything corresponding.
# Parity is bought by deepening the arm under test rather than by inflating the
# published baseline; see `layers` in `DEFAULT.toml`.
#
# DeepNorm's constants follow the `"deepnorm"` sentinel from this key, so the
# depth change rescales `alpha` and `beta` on its own with nothing further to
# set.
#
# Note this buys parameter parity and not interface parity: `output_size` is 256
# here against the restored GRU's 1024, so the discriminator downstream is a
# different size on the two arms.
layers = 6

# `true`, i.e. no causal mask, for the same reason the speaker's key is `false`:
# neither is about masking for its own sake. The key is shared with
# `ReceiverGRULM`, which passes it to `nn.GRU(bidirectional=)`;
# `ReceiverCrossAttentionLM` turns it into `causal = not bidirectional` on the
# stack that encodes the incoming message. Masking that stack left to right
# models a listener that must commit to an interpretation of symbol 1 before
# seeing symbol 5, which is not the listening task -- the message arrives whole.
bidirectional = true

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
