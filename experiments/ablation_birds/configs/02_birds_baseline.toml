# Rung 2: CUB with the GRU/CNN baseline agents. The bottom of `ablation_birds`,
# which is the even half of the sixteen-rung ladder -- see rung 1, in
# `ablation_shapeworld`, for the ladder in full and for why the two arms are
# separate experiments. The rungs kept their ladder numbers across the split, so
# this folder runs 2, 4, 6, ..., 16 and the gaps are the ShapeWorld arm.
#
# Naming the dataset is the only structural change needed.
# `parse_config.get_config` switches to the `[birds.*]` family off the *name* of
# the dataset directory, which brings in the stock-stem ResNet18 for both
# agents -- ShapeWorld's default is `ResNet18SmallInput`, the same network with
# SimCLR's 3x3 stride-1 stem, which is right for 64px images and wrong for CUB's
# 224px ones -- plus batch_size 16, n_examples 10, vocabulary 20, message_length
# 10, no silhouetting and accumulator_steps 1.
#
# Note the `[birds.*]` family is merged *under* this file rather than over it,
# so a rung that names a vision model here wins. That is what lets rungs 4, 6, 8,
# 10 and 12 swap in a ViT without the birds defaults putting ResNet18 back.
#
# Nothing else is overridden. The optimiser and channel settings this file used
# to restate -- `weight_decay` 0.0 and the `logit_scale_lr` /
# `uniform_weight` pair
# -- are DEFAULT.toml's values, and the `[birds.*]` family overrides none of the
# three, so birds and ShapeWorld differ in their data and their agents' vision
# models rather than in their optimiser or their channel.
#
# `epochs` and `repeats` below are not overrides: scripts/job_utils.py reads both
# straight out of this file rather than out of the merged config, so every config
# in an experiment must carry them even when they restate the default. `[slurm]`
# is read from the *first* config in the folder only (sorted by filename), which
# in this experiment is this file, so the block here governs the birds array --
# it is sized for the heaviest job in the set, which is rung 16.

name = "ablation_birds"

[data]
dataset = "../data/cub"

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
