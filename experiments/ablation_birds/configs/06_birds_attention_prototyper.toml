# Rung 6: rung 4 with the attention prototyper.
#
# The CUB counterpart of rung 5, and the same change in what it adds, at CUB's
# own width: `[birds.sender_prototyper]` pins 320 wide, 5 heads, feedforward
# inner 576, SwiGLU, which is the birds ViT's own specification exactly as the
# ShapeWorld block takes ShapeWorld's. 967,171 parameters here against
# ShapeWorld's 132,738; the gap is the width and SwiGLU's double-width
# `linear_in`, and it is the gap the two ViT stacks already carry.
#
# Everything else -- what the block is for, what merging it cost, and which two
# columns to read it by -- is at rung 5 and is not repeated here.

name = "ablation_birds"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
