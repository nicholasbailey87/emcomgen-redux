# lr_sweep_1_cnn arm: CUB backbones at 5e-5 under gumbel.
#
# See `01_shapeworld_1e-5.toml` for what this experiment measures and why. This
# file differs from that one in `[optimiser.module_lr]` alone.
#
# The identity control at this rate is `baseline_lr_sweeps` arm 07.
#
# Twenty epochs of 30 above a `clip_sender_vision` of 1e3 under identity, and
# a `test_acc` that never left chance. Included so the rate axis is covered
# above the working region and not only inside it.

name = "lr_sweep_1_cnn"

[data]
dataset = "../data/cub"

[sender_language_model]
# This arm ran the straight-through Gumbel-softmax estimator against a
# `DEFAULT.toml` that was still on `"identity"`, which is what the sweep was
# for. It won, and `estimator` was removed on 2026-09-07 -- gumbel is now
# unconditional and the key raises if set. The block is kept as the record of
# what this arm carried; nothing sets it any more.

# The two vision models, and only them, and keyed by the class each of them
# holds rather than by the module group.
#
# **It has to be this table.** `builder.resolve_module_learning_rates` consults
# `[optimiser.implementation_lr].<group>` after `[optimiser.module_lr].<group>`
# and lets it win, because the implementation is the more specific claim. Since
# this sweep's own first pass, DEFAULT.toml has carried a `ResNet56` and a
# `ResNet18` rate in both vision groups -- written there from these very arms --
# so a `[optimiser.module_lr] sender_vision` line here would be read and then
# overridden by the default, and every arm in the folder would run at the same
# rate whatever its filename said. The arms were stated that way until
# 2026-09-11 and were inert for it; the 2026-09-07 pass measured nothing, and
# the 2026-09-11 pass at `8848c4b` is the first one whose arms differ.
#
# Stating the rate per class also means a re-run measures what the key is
# actually keyed on. Every other key in `[optimiser.module_lr]` stays at
# DEFAULT.toml's 1e-4, and DEFAULT's entry for the *other* dataset's backbone
# (ResNet56) is untouched and unreachable from here -- this arm never builds one.
[optimiser.implementation_lr.sender_vision]
ResNet18 = 5e-5

[optimiser.implementation_lr.receiver_vision]
ResNet18 = 5e-5

[scheduler]
epochs = 20

[experiment]
repeats = 1
