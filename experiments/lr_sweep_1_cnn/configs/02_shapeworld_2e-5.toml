# lr_sweep_1_cnn arm: ShapeWorld backbones at 2e-5 under gumbel.
#
# See `01_shapeworld_1e-5.toml` for what this experiment measures and why. This
# file differs from that one in `[optimiser.module_lr]`, and in carrying no
# `[data]` block, since ShapeWorld is the default dataset.
#
# The identity control at this rate is `baseline_lr_sweeps` arm 02 for the
# first 30 epochs, and `baseline_lr_sweeps_2` arms 03 and 04, which run this
# rate under identity at silhouette 0.5 and 0.2.
#
# The one ShapeWorld arm with a shape trajectory under identity: chance over
# epochs 1-3 (0.5026), a trough over 12-17 (0.5064), then a step up held to
# the end (0.5312 over 18-30, ending 0.5342). It also led on `test_acc`, with
# a last-five mean of 0.5907 and epochs 22-23 at 0.6145 and 0.6159, the
# highest in the first sweep on either dataset. That makes it the estimator's
# most informative ShapeWorld rate.

name = "lr_sweep_1_cnn"

[sender_language_model]
# This arm ran the straight-through Gumbel-softmax estimator against a
# `DEFAULT.toml` that was still on `"identity"`, which is what the sweep was
# for. It won, and `estimator` was removed on 2026-09-07 -- gumbel is now
# unconditional and the key raises if set. The block is kept as the record of
# what this arm carried; nothing sets it any more.

[optimiser.module_lr]
# The two vision models, and only them. Every other key in this table
# stays at DEFAULT.toml's 1e-4.
sender_vision = 2e-5
receiver_vision = 2e-5

[scheduler]
epochs = 100

[experiment]
repeats = 1
