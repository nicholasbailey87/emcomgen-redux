# lr_sweep_1_cnn: what backbone learning rate works best under the
# straight-through Gumbel-softmax estimator.
#
# ==========================================================================
# **RESULT, 2026-09-07. Everything below this block was written before the
# runs came back and is kept as the reasoning at the time; read it as a
# proposal, not as a description of the repo.** Two things it says are no
# longer true: DEFAULT.toml *was* touched, and `estimator` no longer exists.
#
# Gumbel won every arm. Against the eight identity arms of
# `baseline_lr_sweeps` at matched rates, epoch for epoch:
#
#   * the birds speaker's `train_clip_sender_vision` fell from 37,961 / 5.2e6
#     / 97,945 at 1e-5 / 2e-5 / 1e-4 to 3.1 / 2.7 / 1.8. The spikes this
#     experiment was written to explain are simply gone, and nothing went
#     quiet either -- the lowest speaker norm anywhere was 5.5e-5, against the
#     3.3e-5 and 9.2e-6 floors named further down;
#   * ShapeWorld learned shape for the first time. `train_acc_md_shape`
#     reached 0.879 against `train_acc_md_color` 0.661 at 2e-5 and was still
#     climbing at epoch 100, where the identity arm peaked at 0.5475 and
#     decayed;
#   * `test_acc` was higher in all eight matched arms.
#
# `estimator` was removed on the strength of it and gumbel is unconditional;
# see `[sender_language_model]` in DEFAULT.toml.
#
# **The rates it gave -- 2e-5 for `ResNet56`, 5e-5 for `ResNet18` -- are
# withdrawn; see the second RESULT block below.** What this pass measured was
# the estimator, and that half stands. The rate half does not, for a reason
# that has nothing to do with the traces: the arms were inert. Each stated its
# swept rate in `[optimiser.module_lr]`, which `implementation_lr` overrides,
# and the very keys this pass wrote into DEFAULT.toml then overrode them, so
# every later reading of this folder was reading one rate nine times.
#
# **This is sweep 1 of eight.** Each rung of the ablation introduces a
# component whose rate is an untested guess, so `lr_sweep_2_sender_vit`
# onwards repeat this one rung at a time, in the presence of the components
# below them, with DEFAULT.toml updated from each before the next is
# launched. See `experiments/README.md`.
# ==========================================================================
#
# ==========================================================================
# **RESULT, 2026-09-11, at `8848c4b` -- the second pass, and the first one
# whose arms actually differ from each other.** Nine arms, 20 epochs, n = 1,
# under `loss = "hinge"` and `warm_up_epochs = 0`. The rates below supersede
# the 2026-09-07 pass on ShapeWorld and leave birds open.
#
# **`ResNet56` on ShapeWorld: 5e-5.** At epoch 20, `train_acc_md_shape` /
# `train_acc_md_color` / `test_acc`:
#
#     1e-5   0.63 / 0.91 / 0.646
#     2e-5   0.52 / 0.90 / 0.582
#     5e-5   0.78 / 0.93 / 0.706
#     1e-4   0.50 / 0.81 / 0.603
#
# 5e-5 is best on all three at once, so nothing is traded for it, and its
# shape curve is the one still climbing -- 0.53 at epoch 9 to 0.78 at 20.
# 1e-4 sits at exactly 0.50 shape in all twenty epochs, the colour shortcut
# in pure form; 2e-5, the rate the first pass chose, is barely better at 0.52
# and is now the worst arm on the grid. DEFAULT.toml carries 5e-5 for both
# vision groups.
#
# **That flip is the objective, not noise.** The first pass was BCE at 100
# epochs with class-blending mixup and a ten-epoch warm-up. Under BCE a
# listener with nothing to read descends to `ln 2` by going quiet, so the slow
# rates looked good by not reaching the colour minimum inside the budget.
# Remove the basin and the rate that wins is the one that learns fastest.
#
# **`ResNet18` on birds: unresolved, and the grid is extended.** `test_acc`
# runs 0.529, 0.505, 0.514, 0.542, 0.593 across 5e-6 to 1e-4 -- monotone over
# the top three, best at the top of the grid, and 1e-4 still climbing over its
# last five epochs (0.575, 0.588, 0.590, 0.612, 0.593). An argmax at a grid
# edge says the optimum is there *or above*, and nothing distinguishes the
# two, so `10_birds_2e-4.toml` and `11_birds_5e-4.toml` were added and
# DEFAULT.toml keeps the first pass's 5e-5 until they come back. Birds is also
# the half that barely leaves chance before about epoch 12, so 20 epochs is a
# weaker instrument here than on ShapeWorld.
# ==========================================================================
#
# Eleven arms, and the grid is not the same on both datasets.
# `[optimiser.implementation_lr] sender_vision` and `receiver_vision` move
# together -- keyed by `ResNet56` on the ShapeWorld arms and `ResNet18` on the
# birds ones, for the reason the block at the foot of each file gives -- with
# `[sender_language_model] estimator = "gumbel"` set in every file.
# `01`-`04` are the four ShapeWorld arms, over 1e-5, 2e-5, 5e-5 and 1e-4 on the
# ShapeWorld baseline (rung 1), and `05`-`11` the seven birds arms, over 5e-6,
# 1e-5, 2e-5, 5e-5, 1e-4, 2e-4 and 5e-4 on the CUB baseline (rung 2) -- birds
# gets the extra arm at the bottom, and two more at the top added 2026-09-11
# when the second pass came back with its best birds arm at the edge of the
# grid. Nothing else differs between the arms, and nothing else differs from
# the rung each one copies.
#
# **DEFAULT.toml is not touched.** `estimator` stays `"identity"` there and the
# ablation ladder is unaffected. DEFAULT.toml:1312-1322 says the A/B has to be
# made by copying a rung and flipping the key rather than by moving the default,
# because a ladder whose rungs differ in two things at once stops being
# readable. This experiment is that A/B. If gumbel wins here, moving the default
# is a separate decision with its own rebaseline.
#
# **Why revisit an estimator that was already rejected.** DEFAULT.toml:1302-1310
# records that `"gumbel"` was the default for a few hours on 2026-08-30 and was
# dropped because it killed runs: on `shapeworld-post-silhouette-update.csv` the
# soft Jacobian took the speaker's four gradient norms to ~2e-7 and the run died
# at epoch 21.
#
# **That exact failure is no longer reachable**, and it is worth knowing why
# before reading these arms. It happened with the channel scale unbounded:
# `MAX_LOGIT_SCALE` arrived the next day, in `9409d40`. 0.99951 unmixed survival
# needs a scale of 2.623, against a ceiling of 0.9945 at the cap. More to the
# point, those runs' ~2e-7 norms are ~6e-11 per element, about 170x below
# AdamW's `eps` of 1e-8, which is where `m / (sqrt(v) + eps)` stops cancelling
# the attenuation and the optimiser degenerates into SGD. The worst case the
# ceiling now permits is ~2e-2, some 650x *above* that floor on the birds trunk.
# So the whole reachable range sits inside AdamW's scale-invariant region. See
# `sender.MAX_LOGIT_SCALE` and docs/channel.md.
#
# What has changed is the regime, and the argument for identity was always
# conditional on it. `sample_symbols` justifies the swap by saying
# `diag(p) - p pT` "at `p ~ onehot` has rank ~1, so all but one direction is
# destroyed before any optimiser or clipper sees it". That is an argument about
# a sharp speaker. The channel is not sharp: across all eight arms of
# `baseline_lr_sweeps`, `train_unmixed_survival` -- the column that docstring
# names as the quantity the gumbel branch differentiates through -- starts near
# 0.20 and ends between 0.41 and 0.60, peaking at 0.6977. At `p_max ~ 0.55` the
# soft Jacobian is well conditioned, its eigenvalues are order 0.25, and it is
# the true Jacobian of the relaxation rather than a stand-in for one. The
# degeneracy that motivated replacing it does not occur at these values.
#
# The other half of the case is asymmetry. Every gradient spike in the first
# sweep is in the *speaker*: the birds listener stayed between 0.06 and 11 while
# the birds speaker reached 5.2e6. The speaker is the only agent whose gradient
# crosses the discretisation -- the listener reads the message embedding on a
# continuous path -- so the estimator is the speaker's unique exposure, and it
# is the only per-agent asymmetry in the backward pass that could produce a
# per-agent asymmetry in the norms.
#
# **Why a rate sweep and not a single arm.** Gumbel multiplies the speaker's
# gradient by a factor of order `p(1 - p)`, about 0.16 to 0.24 at the survival
# these runs reach, so a gumbel arm at a fixed rate is not the same *effective*
# rate on the speaker's trunk as the identity arm it is compared against. AdamW
# absorbs most of a slowly varying rescaling -- `gradboard.optimiser` passes no
# `betas`, so `beta2 = 0.999` averages over ~1000 steps against a drift that
# takes 30 epochs, or ~4,700 steps on birds -- but a single arm would still
# confound "gumbel is better conditioned" with "gumbel is effectively a lower
# rate". Sweeping the rate is what separates them: if gumbel simply rescales,
# its curve is the identity curve shifted along the rate axis, and if it changes
# the conditioning, the curve has a different shape.
#
# What AdamW cannot absorb either way is the part that is not a scale.
# `1/sqrt(v)` normalises elementwise over the trunk's parameters, while the
# Jacobian acts in token space before the gradient reaches the trunk, and a
# rank-structured transform there does not reduce to a per-parameter factor.
#
# **Controls, and why nothing needs re-running to get them.** `[scheduler]
# lr_schedule_shape` is `"flat"` with `warm_up_epochs = 0`, so a 100-epoch run
# is epoch-for-epoch identical to a 30-epoch one at the same rate. The eight
# arms of `baseline_lr_sweeps` are therefore a direct identity control for the
# first 30 epochs of the eight arms here that share their rates, and
# `baseline_lr_sweeps_2` arms 01 and 02 are the identity control at 5e-6 and
# 1e-5 on birds for the full 100. Both branches also sample through the same
# `_gumbel_sample`, so a same-seed pair emits identical messages and differs in
# the backward pass alone.
#
# **What to read, and it is not only the spikes.**
#
# `train_clip_sender_vision` in *both* directions. The spikes are the reason the
#     estimator came under suspicion -- birds reached 5.2e6 at 2e-5 and spiked
#     in 19 or 20 epochs of 30 at the middle rates -- but the recorded gumbel
#     failure is the opposite one, a collapse toward AdamW's `eps` floor. The
#     ceiling makes that unreachable in the form it took, as above, so an arm
#     going quiet here would be a *new* result rather than the old one: the
#     number to check it against is 3.3e-5 on birds and 9.2e-6 on ShapeWorld,
#     the norms at which `eps` starts to dominate `sqrt(v)`.
#
# `train_unmixed_survival`, and not `train_realised_survival`. The uniform
#     mixture is a constant in the logits, so it contributes nothing to the
#     Jacobian: the mixed column is capped at 0.9071 and reads ~0.902 even where
#     the unmixed one is at 0.9945 and the gradient is 46x down. `logit_margin`
#     against `sharpest_logit_margin`'s 3.883 says whether sharpening was bought
#     with the shape budget or with the scale.
#
# `train_eval_mode_acc` against `train_shuffled_message_acc`. Their gap is the
#     message and nothing else -- both passes run on the same inputs under the
#     same conditions -- and it is the honest measure of whether a protocol
#     exists. In the first sweep birds at 1e-5 carried the largest gap on either
#     dataset, 0.1383, and it was also the best arm on `test_acc`.
#
# `train_shuffled_message_acc` on its own, which sat at chance in every arm of
#     the first sweep at both ends of training. That rules out image
#     memorisation, and it is worth confirming it stays ruled out here rather
#     than assuming it: the whole train-versus-test gap on birds is carried by
#     the message, so a widening gap means a protocol that fails to transfer to
#     held-out species, not a listener that has memorised training images.
#
# `train_acc_md_shape` against `train_acc_md_color` on the ShapeWorld arms,
#     which is the standing question there.
#
# **20 epochs, one repeat.** This was 100 until 2026-09-11, and before that 60,
# and the whole argument for the long budgets was ignition: a ShapeWorld run
# could sit at `ln 2` for tens of epochs before the protocol appeared, so a
# sixty-epoch budget bought eleven epochs of measurement and a null result at
# that length was ambiguous between "no rate helps" and "the budget was short
# again". The 2026-09-10 ShapeWorld ViT run is the case that forced 100:
# ignition at epoch 49.
#
# `loss = "hinge"` removes the thing being paid for. The first hinge run on this
# speaker ignited at **epoch 3-4**, and by epoch 20 it had separated from its BCE
# twin on the question these sweeps exist to answer -- `train_acc_md_shape`
# 0.674 against 0.508, at an identical `train_acc_md_color` of 0.84. The
# separation is not marginal at 20 and it does not reverse: the same arm read at
# 99 is 0.726 against 0.525. So the epochs after 20 were buying precision on a
# gap already visible, on a chain of eight serial sweeps.
#
# The standing caution that shape emerges late -- `lr_sweep_1_cnn`'s ShapeWorld
# arm at 2e-5 did not step up until epoch 18 -- was a statement about a run that
# spent its first seven epochs flat. It is not repealed, it is *absorbed*: the
# flat stretch is what moved, not the learning behind it.
#
# What 20 cannot do is settle an argmax, and it was never going to. This sweep's
# own first pass took 98 epochs to separate its top two birds arms and separated
# them by 0.001. One repeat for the same reason: n = 1 across eight sweeps is the
# budget, so between-arm gaps here are the size of within-arm epoch-to-epoch
# wobble and this ranks candidates rather than settling them.
#
# The arms no longer match the ablation rungs they copy on length. That is a
# real cost and it is accepted: the rungs are 100 and these are 20, so an arm
# and its rung now differ in the swept rate *and* the budget, and a rung's trace
# is not a control for an arm's.
#
# **The measured rates in DEFAULT.toml were taken at 100 epochs**, under BCE and
# under the old mixup, so they are not re-derivable from a re-run of this folder
# at 20. What a re-run measures is the ranking, which is what the key was ever
# set from. The 2026-09-11 pass is that re-run, and the ranking it produced on
# ShapeWorld is not the old one -- see the second RESULT block above.
#
# `epochs` and `repeats` are restated in every file: `scripts/job_utils.py` reads
# both straight out of the file rather than out of the merged config. `[slurm]`
# is read from the *first* config in the folder only, sorted by filename, so the
# block here governs the whole array. It sits in a ShapeWorld file and is sized
# for a birds one: the heaviest job in the set is a birds arm, and the array is
# one submission, so the ceiling has to clear its slowest member. The ceiling is
# left where it was after the budget went 100 -> 20 -- it is a ceiling, not a
# reservation, and a job that finishes early releases it. The array is eleven
# wide since 2026-09-11, not nine; the two added arms are birds arms at the top
# of the rate grid and are no slower than the ones below them.

# ---
#
# **This arm: ShapeWorld backbones at 1e-5 under gumbel.** It carries no
# `[data]` block, since ShapeWorld is the default dataset.
#
# The identity control at this rate is `baseline_lr_sweeps` arm 01.
#
# Under identity this arm reached the highest `train_acc_md_shape` in the
# sweep, 0.5475 around epoch 16, and then decayed to 0.5217. A peak that is
# not held.

name = "lr_sweep_1_cnn"

[sender_language_model]
# This arm ran the straight-through Gumbel-softmax estimator against a
# `DEFAULT.toml` that was still on `"identity"`, which is what the sweep was
# for. It won, and `estimator` was removed on 2026-09-07 -- gumbel is now
# unconditional and the key raises if set. The block is kept as the record of
# what this arm carried; nothing sets it any more.

# The two vision models, and only them, and keyed by the class each of them
# holds rather than by the module group.
#
# **It has to be this table.** `builder.resolve_module_learning_rates` consults
# `[optimiser.implementation_lr].<group>` after `[optimiser.module_lr].<group>`
# and lets it win, because the implementation is the more specific claim. Since
# this sweep's own first pass, DEFAULT.toml has carried a `ResNet56` and a
# `ResNet18` rate in both vision groups -- written there from these very arms --
# so a `[optimiser.module_lr] sender_vision` line here would be read and then
# overridden by the default, and every arm in the folder would run at the same
# rate whatever its filename said. The arms were stated that way until
# 2026-09-11 and were inert for it; the 2026-09-07 pass measured nothing, and
# the 2026-09-11 pass at `8848c4b` is the first one whose arms differ.
#
# Stating the rate per class also means a re-run measures what the key is
# actually keyed on. Every other key in `[optimiser.module_lr]` stays at
# DEFAULT.toml's 1e-4, and DEFAULT's entry for the *other* dataset's backbone
# (ResNet18) is untouched and unreachable from here -- this arm never builds one.
[optimiser.implementation_lr.sender_vision]
ResNet56 = 1e-5

[optimiser.implementation_lr.receiver_vision]
ResNet56 = 1e-5

[scheduler]
epochs = 20

[experiment]
repeats = 1

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
