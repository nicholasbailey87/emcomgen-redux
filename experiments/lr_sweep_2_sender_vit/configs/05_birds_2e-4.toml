# lr_sweep_2_sender_vit arm: the speaker's ViT backbone at 2e-4 on CUB.
#
# See `01_birds_1e-5.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate.
#
# ---
#
# **This arm: the speaker's ViT backbone at 2e-4 on CUB**, copying ablation rung 04.

name = "lr_sweep_2_sender_vit"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"

[optimiser.implementation_lr.sender_vision]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
BirdsViT = 2e-4

[scheduler]
epochs = 60

[experiment]
repeats = 1
