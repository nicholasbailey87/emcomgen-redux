# lr_sweep_2_sender_vit: what learning rate the speaker's ViT backbone wants, in
# the presence of everything below it on the ladder.
#
# Ten arms. The speaker's ViT rate moves over 1e-5, 2e-5, 5e-5, 1e-4 and 2e-4 on
# both datasets -- `[optimiser.implementation_lr.sender_vision] ShapeWorldViT`
# on the ShapeWorld arms and `BirdsViT` on the birds ones, the two names one
# class carries so that a rate can be keyed per dataset's stack. `01`-`05` are
# the five ShapeWorld arms, copying ablation rung 03, and `06`-`10` the five
# birds arms, copying rung 04 -- the reverse of the other sweeps in the set,
# whose birds arms come first. ShapeWorld leads here because it is the arm
# this re-run is for: the first pass found no rate that helped there and left
# `ShapeWorldViT` without one. Nothing else differs between the arms, and
# nothing else differs from the rung each one copies.
#
# **Sweep 2 of eight.** `lr_sweep_1_cnn` did the two CNN backbones and is
# where the reasoning for the whole set is written down. The short version:
# every rung of the ablation introduces a component whose learning rate has
# never been measured, `[optimiser] lr`'s 1e-4 is jayelm's default tuned on a
# 113k-parameter `Conv4`, and a rung that inherits a wrong rate differs from the
# rung below it in two things at once -- the architecture it was there to move,
# and how well the rate fits it. That is the confound every rung comment in
# DEFAULT.toml is written to avoid, and it is not one the ladder can be read
# through.
#
# **This sweep takes its rates from DEFAULT.toml and restates none of them.**
# It inherits the two CNN rates from `lr_sweep_1_cnn`. That is
# deliberate and it is also a constraint on when this can run: the sweeps are
# serial, and DEFAULT.toml must already carry sweep 1's result before this one
# is launched. Launching out of order does not fail, it silently measures this
# component against an untuned stack. See `experiments/README.md`.
#
# The listener still runs `ResNet56` on ShapeWorld and `ResNet18` on
# birds, at the rates `lr_sweep_1_cnn` measured, so this arm moves one
# backbone and not both. That is the rung, and it is why the rate has to
# be keyed by class: a `[optimiser.module_lr] sender_vision` would move
# the speaker's trunk at every rung including the ones that hold a CNN
# there.
#
# **The grid, and why it is this one.** 1e-5 to 2e-4, five arms, roughly
# log-spaced. The bottom is where `lr_sweep_1_cnn`'s ShapeWorld arm found its
# floor and the top is twice jayelm's default, so the grid brackets the
# inherited rate on both sides rather than only below it. That matters here in
# a way it did not for the backbones: 1e-4 was tuned on something 99x smaller
# than the trunks this repo runs, so there is no prior reason to think the
# optimum is beneath it.
#
# **100 epochs, one repeat.** 60 was the original figure and the reasoning for
# it still holds as far as it goes: the sweeps are serial and the chain is what
# costs, and 40 is definitely too short, because on `lr_sweep_1_cnn`'s own
# traces the ShapeWorld arms at 2e-5 and 5e-5 are *inverted* at epoch 40 and
# cross at 47. What 60 assumed is that ignition happens early enough for the
# forty epochs after it to be the measurement. The 2026-09-10 ShapeWorld ViT
# run is the counter-example: `train_loss` at ln 2 until epoch 48, ignition at
# 49, and eleven epochs of protocol at the end of a sixty-epoch budget. A rate
# comparison over eleven epochs of a code that is still moving is not a rate
# comparison.
#
# So 100, which is the ablation's own length -- rungs 03 and 04 are what these
# arms copy, and matching it means an arm here and the rung it copies differ in
# the swept rate and nothing else, including the budget. It costs the serial
# chain 40 epochs x 10 arms; the `[slurm]` block below already carries the
# ablation's 24-hour ceiling for the same work, so nothing there moves.
#
# What the extra epochs do not buy is the argmax. `lr_sweep_1_cnn` took 98
# epochs to separate its top two birds arms and then separated them by 0.001,
# which is the size of the question this cannot answer and does not need to.
# One repeat because n = 1 at eight sweeps is already the budget; between-arm
# gaps here are the same size as within-arm epoch-to-epoch wobble, so this ranks
# candidates and does not settle them.
#
# **What to read.** `train_clip_sender_vision` first, in both directions: a
# spike says the rate is too high and a decay toward AdamW's `eps` floor says
# it is too low, and both are visible per-module because the clip groups and the
# rate groups are the same table. Then `train_eval_mode_acc` against
# `train_shuffled_message_acc`, whose gap is the message and nothing else and is
# the honest measure of whether a protocol exists at all. On the ShapeWorld arms
# `train_acc_md_shape` against `train_acc_md_color` is the standing question and
# is what decided `lr_sweep_1_cnn`.
#
# `epochs` and `repeats` are restated in every file: `scripts/job_utils.py` reads
# both straight out of the file rather than out of the merged config. `[slurm]`
# is read from the *first* config in the folder only, sorted by filename, so the
# block below governs the whole array.
#
# ---
#
# **This arm: the speaker's ViT backbone at 1e-5 on ShapeWorld**, copying ablation rung 03.

name = "lr_sweep_2_sender_vit"

[sender]
feature_model = "ShapeWorldViT"

[optimiser.implementation_lr.sender_vision]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
ShapeWorldViT = 1e-5

[scheduler]
epochs = 100

[experiment]
repeats = 1

[slurm]
# Sized for the heaviest job in the set, a 100-epoch birds arm on a ViT trunk,
# and read from the first config by filename only -- so this block governs the
# whole array and belongs here and nowhere else. It sits in a ShapeWorld file
# and is sized for a birds one, because the array is one submission and the
# ceiling has to clear its slowest member. Unchanged when the arms went from 60
# epochs to 100: this is the same allowance `ablation_birds/04_birds_sender_vit`
# carries for a 100-epoch birds ViT run, which is the job these arms copy. It
# leaves ~14 min/epoch against the ~3.4 min/epoch `lr_sweep_1_cnn` measured on
# the CNN trunks; a ViT arm is slower and still has not been timed at this
# length, so the margin is the untested part.
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
