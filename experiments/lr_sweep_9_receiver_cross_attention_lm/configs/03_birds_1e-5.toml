# lr_sweep_9_receiver_cross_attention_lm arm: `ReceiverCrossAttentionLM` at 1e-5 on CUB.
#
# See `01_birds_2e-6.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate alone.
#
# ---
#
# **This arm: `ReceiverCrossAttentionLM` at 1e-5 on CUB**, copying ablation rung 18.

name = "lr_sweep_9_receiver_cross_attention_lm"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerBidirectionalLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7

[receiver]
feature_model = "BirdsViT"
language_model = "ReceiverCrossAttentionLM"

[receiver_language_model]
d_model = 256
heads = 4
ff_inner_size = 320
token_embedding_size = 256
layers = 6
bidirectional = true

[optimiser.implementation_lr.receiver_language_model]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
ReceiverCrossAttentionLM = 1e-5

[scheduler]
epochs = 30

[experiment]
repeats = 1
