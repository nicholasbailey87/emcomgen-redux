# conv4_silhouette_reference: `conv4_lr_reference/02_lr_1e-4.toml` with the
# listener's referents silhouetted half the time. One arm, one variable.
#
# The 10 August run at `a496f01` -- Conv4, flat 1e-4, 100 epochs, and
# `silhouette_p_receiver = 0.5` -- reached 0.859 on `test_acc_md_shape` while
# never learning colour (0.544). The same settings at 0.0 reached 0.484 on
# shape and memorised it: 0.880 on train, and `test_same` no better than
# `test`, so held-out images of *trained* concepts failed as hard as novel
# concepts.
#
# `train_listener_probe` is on by default, so this run also reports
# `train_eval_mode_acc` and `train_shuffled_message_acc`. If the listener is
# still winning on train by recognising individual images, the rolled-message
# column stays near the live train accuracy instead of falling to chance.
#
# `augment_flip` and `augment_affine_degrees` are deliberately left at their
# defaults. They attack the same memorisation from the other side and would
# confound this arm.

name = "conv4_silhouette_reference"

[sender]
feature_model = "Conv4"

[receiver]
feature_model = "Conv4"

[data]
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.5

[scheduler]
epochs = 100
warm_up_epochs = 0
lr_schedule_shape = "flat"

[optimiser]
lr = 1e-4

[optimiser.module_lr]
sender_vision = 1e-4
sender_adapter = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 1e-4
receiver_adapter = 1e-4
receiver_token_embedding = 1e-4
receiver_language_model = 1e-4
receiver_discriminator = 1e-4

[experiment]
repeats = 3

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
