# silhouette_titration_norms 10 of 15: the speaker's channel norm off at silhouette 0.5.
#
# Fifteen arms: a 3x5 over the two normalisation flags and
# `data.silhouette_p_receiver`, with `ResNet18SmallInput` on both agents, thirty
# epochs, one seed, one repeat and rung 1 otherwise. Every arm differs from
# every other in the flags and the rate alone.
#
#     files          normalise_logits  normalise_score
#     01-05          true              false            (the listener revert)
#     06-10          false             true             (the speaker)
#     11-15          false             false            (both)
#
# The fourth cell of the 2x2 -- both flags true, which is today's behaviour --
# is not repeated here. It is `experiments/silhouette_titration_resnet18/`,
# already run over the same five rates on the same thirty epochs at the same
# rung, and that folder is this experiment's control. Read every arm here
# against its rate-matched arm there.
#
# **Why these flags.** No ShapeWorld run has learned shape since 17 August. Two
# commits landed in the 36 hours after the last one that did: `60f9094` moved
# the backbone to `ResNet18SmallInput`, and `4248fca` gave the bilinear comparer
# its operand norms, its `/sqrt(d)` calibration and `log_score_scale`. They are
# perfectly confounded, and since `4248fca`'s stated purpose was to take the
# score's volume "out of the backbone's hands" -- exactly the coupling that
# differed between Conv4 and ResNet18 -- they are two descriptions of one
# intervention rather than two independent suspects. The backbone half is under
# test in `silhouette_titration_conv4/` against `silhouette_titration_resnet18/`;
# this folder is the other half.
#
# Two measurements motivated including the speaker. `logit_scale` climbs
# monotonically from 1.001 and pins at `MAX_LOGIT_SCALE` by epoch 14 of 29 in
# all ten arms of both silhouette titrations, while `logit_margin` sits at
# 0.44-0.88 against a budget of 3.883. `score_scale` decreases on 100% of steps
# in every arm, 0.996 -> 0.21-0.28, never once reversing. Neither scalar is a
# control finding an optimum; both are one-way traverses that run until
# something stops them.
#
# **This cell: `normalise_logits = false`, the speaker.** It removes
# `layer_norm_logits` and the learned `log_logit_scale` together, so the
# speaker's raw logits go to the sampler.
#
# **It is not a revert, unlike the listener cell.** `layer_norm_logits` was
# already present at `ce7d6a5`, having arrived at `1510a55`/`df95063` on
# 10-12 August, so every ShapeWorld run that has ever learned shape ran with
# it on, and the successful configs also carry `logit_scale_lr = 2e-3` and
# `init_energy = 0.9`. These five arms go back past that point, to a channel
# no successful run has used. Read a null here as weak evidence and a
# positive as a surprise. That is the whole reason the speaker and the
# listener are two flags rather than one.
#
# Four channel columns change meaning in these arms and stay computable:
# `logit_margin`, `logit_prior_share`, `unmixed_survival` and
# `realised_survival` are all measured on post-norm logits, and
# `sharpest_logit_margin`'s budget of 3.883 at V = 14 is a property of the
# normaliser that does not exist without it. Do not compare them against the
# other cells. `logit_spread` is taken before normalisation and is
# unaffected; `train_logit_scale` and `train_clip_log_logit_scale` read NaN.
#
# **Why the rate is swept rather than pinned.** It interacts with exactly what
# these flags touch. The 17 August pair that learned shape and kept colour ran
# 0.1; the 9 August pair at 0.5 got shape faster -- onset epoch 7 against 20 --
# but the baseline lost colour to 0.616. If changing the score's normalisation
# changes which side of that trade a run lands on, the sweep is what shows it
# and a single rate would not.
#
# The backbone is stated rather than inherited, as it is in
# `silhouette_titration_resnet18/`, and for the same reason: an arm of a
# controlled comparison that reads its treatment or its control from a default
# is an arm that moves silently the next time the default does, and this pairing
# has already been broken once by a change landing between two sweeps. The flags
# are stated on every arm for the same reason, including where the value is the
# default.
#
# Thirty epochs is inherited from the other titration folders, not argued. Of
# the four Conv4 runs that ever learned shape the durable onsets were epochs 7,
# 20, 28 and 82, so a flat arm at thirty is weak evidence and all of these
# folders should move to 100 together if any does.
#
# One seed and one repeat, so an arm is a single run. The comparison is across
# flags and against the control at matched rates, not within a cell.
#
# Checkpoints do not cross the flags: with a flag off, `log_logit_scale`,
# `log_score_scale` and `score_bias` are absent from the `state_dict`, so
# nothing written under one setting loads under another whatever `resume` says.
# These are new runs, not resumed ones.
#
# No `[slurm]` block: that is read from `01_no_score_norm_0.1.toml`
# alone.

name = "silhouette_titration_norms"

[sender]
feature_model = "ResNet18SmallInput"

[sender_language_model]
normalise_logits = false

[receiver]
feature_model = "ResNet18SmallInput"

[receiver_discriminator]
normalise_score = true

[data]
silhouette_p_receiver = 0.5

[scheduler]
epochs = 30

[experiment]
repeats = 1
