# silhouette_titration_sender_vit arm: `silhouette_p_receiver` at 0.2.
#
# See `01_silhouette_0.1.toml` for what this folder measures and why -- the
# short version is that shape emergence on the speaker's ViT is close to a coin
# flip at 0.0, and this folder asks whether suppression makes it reliable. This
# file differs from that one in the swept rate and in carrying no `[slurm]`
# block, which is read from `01_silhouette_0.1.toml` alone.
#
# ---
#
# **This arm: `silhouette_p_receiver = 0.2`.**
#
# This is the rate the CNN titrations chose and the one `DEFAULT.toml` carried
# until 2026-09-11, so it is the folder's tie to everything the repo ran under
# the ignition recipe. It is also the arm the capacity argument predicts will
# be too weak: if a `ResNet56`-sized transformer needs more suppression than a
# 113k `Conv4` did, 0.2 escapes less often than 0.3 and the CNN's number does
# not transfer.

name = "silhouette_titration_sender_vit"

[sender]
feature_model = "ShapeWorldViT"

[data]
silhouette_p_receiver = 0.2

[scheduler]
epochs = 30

[experiment]
repeats = 6
