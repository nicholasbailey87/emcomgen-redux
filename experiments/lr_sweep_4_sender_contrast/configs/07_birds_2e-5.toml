# lr_sweep_4_sender_contrast arm: `ExampleContrast` at 2e-5 on CUB.
#
# See `01_shapeworld_1e-5.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate.
#
# ---
#
# **This arm: `ExampleContrast` at 2e-5 on CUB**, copying ablation rung 08.

name = "lr_sweep_4_sender_contrast"

[data]
dataset = "../data/cub"

[sender]
feature_model = "BirdsViT"
prototyper = "AttentionPrototyper"
contrast = true

[optimiser.module_lr]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
sender_contrast = 2e-5

[scheduler]
epochs = 100

[experiment]
repeats = 1
