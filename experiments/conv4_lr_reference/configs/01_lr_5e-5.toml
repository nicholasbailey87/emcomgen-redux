# conv4_lr_reference: a flat learning rate of 5e-5 on Conv4, with no
# silhouetting, no warm-up and no per-module split. The arms differ in the rate
# alone.
#
# `[slurm]` below is read from the *first* config in the folder only.

name = "conv4_lr_reference"

[sender]
feature_model = "Conv4"

[receiver]
feature_model = "Conv4"

[data]
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.0

[scheduler]
epochs = 100
warm_up_epochs = 0
lr_schedule_shape = "flat"

[optimiser]
lr = 5e-5

[optimiser.module_lr]
sender_vision = 5e-5
sender_adapter = 5e-5
sender_prototyper = 5e-5
sender_contrast = 5e-5
sender_language_model = 5e-5
receiver_vision = 5e-5
receiver_adapter = 5e-5
receiver_token_embedding = 5e-5
receiver_language_model = 5e-5
receiver_discriminator = 5e-5

[experiment]
repeats = 3

[slurm]
time = "24:00:00"
cpus_per_task = 6
gpus_per_task = 1
mem_gb = 24
