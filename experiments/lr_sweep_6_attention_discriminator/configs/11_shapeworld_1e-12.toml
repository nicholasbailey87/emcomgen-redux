# lr_sweep_6_attention_discriminator arm: `AttentionDiscriminator` at 1e-12 (frozen) on ShapeWorld.
#
# See `01_shapeworld_1e-5.toml` for what this experiment measures and why.
# This file differs from that one in the swept rate, and in carrying no
# `[data]` block, since ShapeWorld is the default dataset.
#
# **A frozen control, not a rate.** 1e-12 rather than 0, because
# `validate_config` requires a positive rate; the same choice as sweep 4's
# control.
#
# ---
#
# **This arm: `AttentionDiscriminator` at 1e-12 (frozen) on ShapeWorld**, copying ablation rung 11.

name = "lr_sweep_6_attention_discriminator"

[sender]
feature_model = "ShapeWorldViT"
prototyper = "AttentionPrototyper"
language_model = "SenderTransformerAutoregressiveLM"

[sender_language_model]
token_embedding_size = 320
d_model = 320
heads = 5    # head_dim 64, as everywhere
layers = 7

[receiver]
feature_model = "ShapeWorldViT"
discriminator = "AttentionDiscriminator"

[receiver_discriminator]
d_model = 256
heads = 4
ff_inner_size = 320
layers = 3

[optimiser.implementation_lr.receiver_discriminator]
# The one key this sweep moves. Every other rate is DEFAULT.toml's,
# including the ones earlier sweeps in this set have already settled.
AttentionDiscriminator = 1e-12

[scheduler]
epochs = 30

[experiment]
repeats = 1
