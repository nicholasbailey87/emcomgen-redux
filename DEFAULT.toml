# Default experimental settings, required to reproduce https://github.com/jayelm/emergent-generalization

name = "DEFAULT" # experiment name - should be the same as file name
resume = true
cuda = true
# `torch.compile` on the sender's and receiver's feature models, applied in
# `train.py` after the checkpoint restore. On because the ablation rungs were
# leaving throughput on the floor: measured on an A100 at 640 images of 64px,
# fwd+bwd, the `ViT2` backbone runs 968ms eager against 303ms compiled -- 18.5
# TFLOP/s against 59.2 -- and `ResNet18SmallInput` 170ms against 81ms. Both
# sides gain, so the comparison between them does not quietly shift.
#
# This used to compile the `Pair` and that did nothing at all. `Pair` has no
# `forward`; it is a container so the two agents share an optimiser and a
# checkpoint. `torch.compile(pair)` therefore wrapped a method nothing calls,
# and the training loop's `pair.sender(...)` and `pair.receiver(...)` went
# through `OptimizedModule.__getattr__` to `_orig_mod`, i.e. to the uncompiled
# submodules. A profile of rung 13 confirms it: no `triton_*` kernel anywhere,
# no Dynamo output at all, and `aten::mul` at 30% of device time with the
# GEMMs under 10%. See `train.py --profile-steps`.
#
# The feature models only. The language models decode autoregressively and would
# break into graphs at every step; the comparers are small. The backbones are
# ~90% of a ViT rung and have no data-dependent control flow.
#
# One consequence, and the reason this is set here rather than per rung.
# `Module.compile()` compiles in place and leaves `state_dict` keys alone, where
# the old `torch.compile(pair)` prefixed every key with `_orig_mod.`. So a
# checkpoint written from here on key-matches neither an old compiled rung nor
# an old uncompiled one. `probe_shape.py` fails loudly on a mismatch rather than
# silently loading nothing, but the files are still incompatible: this is a
# re-run of a whole comparison, not half of one.
compile = true
use_lang = true
copy_receiver = false
receiver_only = false
share_feat_model = false
share_language_model = false
joint_training = false
reference_game = false
reference_game_xent = false
debug = false
vis = false

# Score the listener a second and third time on every training batch, in eval
# mode, once with the real message and once with the batch's messages rolled by
# one. Emits `train_eval_mode_acc` and `train_shuffled_message_acc` beside the
# eval splits' `shuffled_message_acc`.
#
# What it is for. `train_acc` is scored in train mode on sampled messages;
# `test_acc` is scored in eval mode on greedy ones. When the two diverge --
# 0.913 against 0.564 on the 2026-09-03 Conv4 baseline -- nothing in the
# metrics separated the three things that could cause it: the listener
# recognising individual training images, the mode switch, or a protocol that
# genuinely fails to transfer. These two columns separate the first two.
# `train_eval_mode_acc` against `train_acc` is the mode; `train_eval_mode_acc`
# against `train_shuffled_message_acc` is the message. A listener winning by
# memorised images holds its accuracy with the message rolled away.
#
# The cost is two extra listener forwards per training batch, with no backward
# and no graph. That is why this is a switch and not unconditional, and why the
# eval-only version of the control has always been unconditional.
#
# Turning it off restores the exact metrics header this file had before the
# probe existed: the two columns are not written at all rather than written NaN.
train_listener_probe = true
receiver_reset_interval = 0.0

[analysis]
# Settings for the topsim report (see code/emergence.py and
# compute_language_metrics in code/train.py). One variant per signal set S1-S6,
# differing only in the signal distance; each is read against two meaning
# distances -- cosine between sender concept vectors (`topsim_*`) and word-level
# edit distance between the ground-truth logical forms (`topsim_gt_*`). Computed
# once per epoch on the test/test_same eval passes, not on train.
#
# The three soft variants (S1-S3) are additionally reported as `_static`, which
# recomputes them on per-token mean embeddings. Only the soft variants read the
# sender's symbol embeddings, and only they can therefore report a correlation
# that came from the meaning space rather than from the language; `_static`
# leaves their synonymy tolerance intact and removes that channel. It replaces an
# adjustment against a pre-training baseline pass, which read ~0 for every
# variant and so bounded nothing: the leakage it existed to catch is created by
# training. See `emergence.topsim_report`.
max_concepts = 500     # cap on concept prototypes entering one topsim computation.
                       # Measurement is per concept prototype, not per image, and
                       # the soft signal distances are O(n^2) in a Python loop, so
                       # this bounds the measurement cost. The `_static` control
                       # roughly doubles it; dropping the pre-training baseline
                       # pass gives most of that back.

[data]
# 40 images per stored game rather than 80-100. `split_spk_lis` only ever reads
# 20 (10 per agent per polarity), so 40 is the smallest row that keeps the
# concept game's speaker/listener disjointness. See data/shrink_shapeworld.py.
dataset = "../data/shapeworld_40"
# ~9.8 GB train + ~1 GB test fits the 24 GB SLURM allocation, which removes
# ~32 GB of disk reads per epoch.
load_shapeworld_into_memory = true
batch_size = 32
percent_novel = 1.0
n_examples = 20 # number of examples seen by agents, including distractors
n_workers = 0

# Probability of repainting an agent's whole view as flat single-colour
# silhouettes, per game, at training time only. This attacks the colour-only
# local minimum the paper reports (~83% accuracy, appendix A.1): with the six
# colours sitting at six distinct luma values, a grayscale conversion would
# re-encode colour as a scalar rather than remove it, where a flat repaint
# removes it outright.
#
# **Sender 0.0, receiver 0.1**, the latter since 2026-08-30. Both were off for
# the few hours before that, against a receiver rate of 0.5 since 2026-08-25.
# The mechanism works and the measurement below is worth keeping, but 0.5 was
# set against the old channel and is too strong for this one.
#
# The rate did not move when the fill went back to a threshold on 2026-09-01, so
# that one change stands alone between this run and the last. `silhouette_fill`
# below is where that is argued; `experiments/silhouette_titration/` is where
# the rate gets swept under it.
#
# What 0.5 did under the constant channel and the identity estimator. Rung 9
# learned *shape* better than any ShapeWorld run on record -- 0.758 on shape
# concepts and 0.829 on `and_shape_shape`, against ~0.52 for every run that had
# never escaped -- and left colour at exactly chance for all thirty epochs. Eval
# is never silhouetted, so 0.50 there is a failure to communicate colour and not
# a ceiling this key imposes. The aggregate 0.615 was hiding a bimodal result,
# and it is the mirror image of the failure the key exists for: one
# single-feature language traded for the other.
#
# What 0.0 does. The same rung reaches test accuracy 0.661 by **epoch 5** with
# colour at 0.747 *and* shape at 0.646 and still climbing -- past the
# silhouetted run's epoch-29 aggregate, on both features, in a sixth of the
# epochs. Colour arrives first at epoch 3 and shape follows at epoch 4, so on
# this channel colour leads shape rather than blocking it, which is not what the
# paper's local minimum predicts.
#
# The likely reason it is too strong here is that it suppresses the *channel*
# and not only the colour feature: at 0.5, half the receiver's games contain
# nothing worth decoding, and the run's `unmixed_survival` sat at ~0.28 with
# `logit_margin` ~0.40 against ~0.45 and ~0.68 at 0.0. A speaker whose messages
# are useless half the time gets a correspondingly weaker gradient to sharpen
# on, and this channel has no learned scale to compensate with.
#
# So: 0.0 restores the paper's own conditions, and this is the setting the whole
# ablation is being smoke-tested at. If the colour-only minimum returns -- the
# tell is shape falling back to ~0.52 while colour sits near 0.80 -- titrate
# upwards from 0.25 rather than going straight back to 0.5. Read it on the
# `test_acc_md_shape` / `test_acc_md_color` breakdown, never on the aggregate,
# which reads the same for a language with one feature and for one with both.
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.1

# Geometric augmentation of the referents, train-only and drawn per image.
#
# `augment_flip` gives each image an independent 50% horizontal flip and an
# independent 50% vertical flip, so a quarter of images get both.
# `augment_affine_degrees` rotates every image by a uniform draw from
# +/- that many degrees; 0.0 leaves the rotation out entirely.
#
# Why they exist. The store holds 20 positives and 20 negatives per game, and
# `ConceptDataset.__getitem__`'s permutation only decides which agent sees
# which -- the image *set* a game presents never changes. A hundred epochs of
# the same twenty images is what a listener memorises, and the 2026-09-03 Conv4
# baseline is what that looks like: shape at 0.880 on train and 0.484 on both
# eval splits, with colour transferring and shape not at all. These are drawn
# separately for each agent, so the two views of a shared stored image diverge
# and the listener never sees the same pixel array twice.
#
# Note the original ShapeWorld store had 40-50 positives per game and
# `split_spk_lis` read 20 of them, so a fresh subset arrived every epoch;
# `data/shrink_shapeworld.py` kept 20 and that variation went with it. Its
# docstring's defence -- "C(20,10) = 184,756 speaker/listener divisions" --
# counts partitions of a fixed set, not distinct images.
#
# Both default off, so every run recorded before this key existed is
# reproducible from its own config.
#
# What is deliberately absent, and why the transform is pinned rather than
# configurable. The five shapes are circle, ellipse, rectangle, square and
# triangle. Flips alias none of them and small rotations alias none of them,
# but *shear* turns a rectangle into a parallelogram, and *anisotropic* scaling
# maps circle to ellipse and square to rectangle -- two label pairs destroyed
# outright. `RandomResizedCrop` is out for the same reason: its `ratio`
# argument is exactly that scaling. Colour jitter is out on its own terms,
# since colour is a label here rather than a nuisance variable.
augment_flip = false
augment_affine_degrees = 0.0

# Mixup on the listener's candidates: each is replaced by a blend of itself and
# another drawn from the same set with replacement, weight `lambda` from
# `Beta(mixup_alpha, mixup_alpha)`, and its label by the same blend. 0.0 is off.
#
# Positives and negatives are mixed together, so the target becomes continuous:
# a candidate built from 0.7 of a satisfying image and 0.3 of an unsatisfying
# one is labelled 0.7 and the listener has to return a score reflecting it.
# `BCEWithLogitsLoss` takes that natively.
#
# **The label is the mixing weight, not a claim about the picture.** A
# ShapeWorld world holds one object, so blending a red circle with a blue square
# gives two half-lit ghosts rather than an object that is 70% red, and "is the
# object red" has no answer for it. What is well defined is how the image was
# built. This is Zhang et al. 2018 (arXiv:1710.09412) unchanged, including its
# justification -- a linearity prior on the listener's score between training
# points rather than extra supervision -- and its headline result is that it
# stops a network memorising training labels, which is what this is aimed at.
#
# `alpha = 1.0` is `Beta(1, 1)`, i.e. uniform `lambda`, and is what most
# implementations ship. The mixup paper preferred 0.2 on ImageNet because larger
# values underfit; underfitting is not this repo's problem -- `train_acc` 0.913
# against 0.564 -- and 0.2 concentrates `lambda` near 0 and 1, which leaves most
# candidates nearly clean and is the regime where the augmentation does least.
# If 1.0 does underfit it is visible rather than silent: train accuracy falls
# towards eval accuracy rather than eval accuracy rising.
#
# What it costs. `train_acc` scores against `lis_y > 0.5`, i.e. against the
# dominant source of each blend, so with this on it is no longer the same
# quantity as `test_acc` and the two should not be differenced. `train_loss` is
# unaffected. Eval is never mixed, as it is never silhouetted.
mixup_alpha = 0.0

# The colour a lit pixel comes back at, as a per-channel fraction of maximum.
# Every pixel above half the image's peak luma is repainted to it and every
# other pixel to zero, so a silhouette is two-valued.
#
# **A threshold again, since 2026-09-01.** From e884662 (2026-08-29) to that
# date the transform blended by coverage instead -- a pixel at coverage `k` came
# back at `k * fill` -- so an anti-aliased edge survived as a ramp rather than
# being promoted to fully lit. That is the better description of the object. It
# is the worse thing to hand a receiver, and the difference is not small.
# `diagnostics/silhouette_shape_probe.py` (cluster job 123354) trains a fresh
# `Conv4` on silhouetted ShapeWorld positives under each fill and tests it on
# both the same repainting and on clean images, which is what eval actually
# shows the model:
#
#     arm                in_domain    clean
#     clean                  0.999    0.999
#     white_threshold        0.794    0.560
#     white_coverage         1.000    0.483
#     fill_coverage          1.000    0.486     (chance 0.306)
#
# The coverage arms are perfectly readable under their own repainting and lose
# almost all of it at eval; the threshold is the only arm that gives up in-domain
# accuracy and keeps more of it on clean images.
#
# **And that table does not survive its own repeat.** Re-run unchanged at the
# same seed on the same GPU, `white_threshold` read 0.403 where it had read 0.560
# (jobs 123583, 123354) -- convolution backward on cuDNN accumulates with atomics
# -- and a third run read the three live fills at 0.412, 0.553 and 0.506. Six
# single-fit readings across two transforms and three fills, all between 0.40 and
# 0.56, none separable from another. Two things survive it: every repainting arm
# sits well above chance and far below `clean`, so shape does transfer and most of
# it is lost; and the threshold costs in-domain readability on every run, 0.79-0.97
# against the blend's 1.000. Which fill transfers best is **open**. The probe now
# fits each arm five times and reports a range -- run it before quoting a number
# from here, and do not read a gap smaller than the ranges overlap.
#
# Two things follow for the rest of this comment. The repainted region is now
# **larger** than the object it replaces, since every partly lit edge pixel is
# promoted, and the per-channel means below therefore run slightly high against
# what the table says. And the leak that used to close this comment -- grey's
# coarser edge quantisation, ~0.97 recall for a classifier -- is **gone**, since
# there is no ramp left to quantise.
#
# **ShapeWorld's own mean object colour, (149, 149, 106) of 255.** The value did
# not change on 2026-09-01 and neither did most of the argument for it. It was a
# flat 0.5 until then, on an argument that is being deliberately abandoned rather
# than quietly dropped, so it is worth stating what is being given up. Half was
# the maximum-entropy answer for a palette this key does not know, and it was
# robust to how the ignorance was written down: colours uniform over the RGB cube
# give 0.5 per channel; uniform over the six saturated primaries and secondaries
# gives 0.5; uniform over hue at full saturation and value gives 0.5, since the
# trapezoidal hue-to-RGB curve is 1 for a third of the circle, 0 for a third, and
# averages 0.5 across the ramps. That is a real property and this key no longer
# has it. What replaces it is a constant fitted to this dataset, which fails the
# day ShapeWorld's palette changes. The trade is made because half was not merely
# suboptimal, it was colliding.
#
# **The collision.** `0.5 * 255 = 128` is exactly ShapeWorld's `gray`, so
# silhouetting a grey object was bit-identical in and out -- max delta 0 over 0
# pixels. One colour in six was silently exempt from an intervention whose entire
# job is to remove colour. This is the reason the value moved and it is unaffected
# by the edge treatment: a chromatic fill has no fixed point in the palette at
# all. `tests/test_silhouette.py::test_the_fill_collides_with_no_palette_colour`
# pins it.
#
# **The tie lattice, which the threshold has made moot.** Under coverage blending
# a stored edge pixel was `round(coverage * fill * 255)`; at `fill = 0.5` that is
# `coverage * 127.5`, and any colour whose maximum channel is 255 has coverage
# exactly `n/255`, so the product was exactly `n/2` and every odd `n` landed on a
# `.5` tie. Ties resolve by round-half-to-even on a float32 whose last bits differ
# per colour, and 43 of the 256 stored levels made red, blue, green, yellow and
# white disagree -- colour re-encoded in the anti-aliasing. Making `fill * 255` an
# integer per channel removed that, since `n * F / 255` cannot be a half-integer
# when `F` is an integer (255 is odd, `2nF` is even). There are no anti-aliased
# edges left to round, so the property is no longer load-bearing; keep it anyway,
# because it also means the fill is a colour the store can represent exactly.
# Write the channels to at least nine decimal places: `0.584313725 * 255` is
# 149.000000875, which rounds to 149, where `0.58 * 255` is 147.9, which rounds to
# 148 and means nothing in particular.
# `tests/test_silhouette.py::test_the_fill_is_an_integer_number_of_levels` exists
# to make a sloppy literal fail loudly.
#
# **Why chromatic and not simply another integer grey.** The receiver's `ViT2`
# opens with `nn.BatchNorm2d(3)` over raw RGB (`initial_batch_norm=True`, and
# broccoli's `vit.py` puts it at `preprocess[0]`), and ShapeWorld gets no other
# input normalisation, so whatever `silhouette` emits lands directly on that
# layer's statistics. Eval is never silhouetted, so those running statistics are
# gathered on a mixture and then applied to clean images: any gap is a fixed
# offset of `(mu_clean - mu_running) / sigma` on every eval activation, and the
# learned affine cannot absorb it because the offset is zero at train. The
# palette is blue-deficient -- blue appears in two of six colours where red and
# green appear in three -- so the mean object colour is (148.83, 148.83, 106.33)
# and *no* achromatic constant can match all three channels. Raising one only
# trades R and G against B:
#
#     fill (of 255)      R        G        B
#     128 (the old 0.5)  -14.3%   -14.3%   +19.9%
#     135                 -9.3%    -9.3%   +27.0%
#     144                 -3.2%    -3.2%   +35.4%
#     (149, 149, 106)     +0.1%    +0.1%    -0.3%
#
# Those means weight the six colours **uniformly**. Nobody has checked
# ShapeWorld's empirical colour frequencies, so if they are not uniform the
# match is approximate rather than exact. They also assume the repainted region
# is the object's, which the threshold no longer quite honours.
#
# White was worse still by this measure -- the brightest image the model ever
# sees, putting the running means at 1.36x, 1.36x and 1.70x the eval
# distribution. Note that the probe above measured its best transfer at exactly
# that fill, `white_threshold`. Either the BatchNorm gap is not what governs
# transfer, or the threshold is worth more than the gap costs; the two changes
# are confounded in that arm and nothing here separates them. The first re-run
# of the probe under this fill is what settles it, and until then the BatchNorm
# argument is being kept on its own merits rather than on a measurement.
#
# A constant cannot match the second moment at all: a repainted object has zero
# colour variance, so `running_var` still sits below the eval distribution.
# Matching both would need a per-image draw from the colour distribution, which
# was considered and rejected -- a randomly recoloured object is
# indistinguishable from a real one, so the receiver could not learn to gate on
# "colour is absent here" and would instead learn that colour is globally
# unreliable, degrading the games where colour is genuine. A constant stays
# detectable, and that detectability is the point.
#
# **What is left of the grey leak.** The threshold is taken on the *stored*
# image, and grey stores coverage `k` as `round(128k)` where every other palette
# colour stores `round(255k)`, so grey turns on at `k > 0.5039` and the rest at
# `k >= 0.502`. That moves an object's boundary by up to a pixel; it is not the
# colour-dependent gap in every image's value histogram that the coverage
# version could not close. Swept over all 256 stored levels, the six colours
# repaint identically at 255 of them and differ at exactly one.
# `test_the_threshold_is_colour_invariant` pins that, including the exception.
# See docs/data.md and docs/dubious-claims.md.
silhouette_fill = [0.584313725, 0.584313725, 0.415686275]

[optimiser]
class = "AdamW"
accumulator_steps = 4

# Halved from 1e-4 on 2026-08-31, and `[optimiser.module_lr]` below halves with
# it. This is rung 3b's setting promoted to the default; 3b was retired into
# this line, which is why there is no longer a half-rate variant of any rung.
#
# What it was testing. On the 2026-08-30 ablation rung 3 collapsed at epoch 10:
# `logit_prior_share` 0.891 -> 0.9992 and `referent_spread` 0.221 -> 0.0040 in a
# single epoch, then flat to four decimal places for the remaining twenty, with
# `clip_sender_vision` decaying to 4e-4. The speaker's vision trunk stopped
# varying with its input and never restarted.
#
# Epoch 10 is `warm_up_epochs`, but it is not a discontinuity.
# `train.py:build_lr_schedule` puts an `ascent` from zero to base over the
# warm-up and then a `flat` stage that opens at base, so the two meet and the
# rate is continuous through the join -- at epoch 9 it is already near base.
# What epoch 10 actually is, is the first point at which the rate reaches its
# maximum and stays there. A smooth ramp producing a one-epoch collapse is what
# crossing a stability threshold looks like, not what a shock looks like, and
# halving every rate is the direct test of that reading.
#
# The cost, and why it is affordable. Every traverse in this file doubles in
# epochs, and escape speed is what separates the arms that live from the ones
# that die -- rung 9 got out at epoch 3 and rode through epoch 10 untouched,
# rung 3 never did. But rung 9 escaped at roughly 30% of base rate, so escape
# does not need the full one; halved, it should land near epoch 6 and still be
# clear of the join.
lr = 5e-5
# 0.0 for both datasets -- `[birds.optimiser]` does not override it. jayelm uses
# plain Adam with no decay, and bs6, the only run so far to reach the paper's
# ShapeWorld numbers, set this to 0.0 explicitly. At 0.0 AdamW and Adam are the
# same optimiser, so `class` above needs no accompanying override. The 0.01 it
# replaces was never justified against a run that fitted its training set.
weight_decay = 0.0
clip_grad_norm = 1.0
log_interval = 100

# AdamW's epsilon, far below the 1e-8 default it replaces.
#
# The reason to think about it at all is that every argument in this file about
# gradient magnitudes not mattering -- the ones that say a uniform factor on a
# parameter's gradient cancels, because AdamW updates by `m / sqrt(v)` and scales
# both -- holds only while `sqrt(v)` is well above `eps`. It is not a free
# assumption. The 2026-08-29 ShapeWorld run's speaker gradient norms reached
# ~2e-7, where 1e-8 damps the update by about 9%, and an order of magnitude below
# that the parameter is held still by the epsilon rather than by its gradient. So
# the optimiser stopped being scale-invariant in exactly the regime the diagnosis
# was made in.
#
# 1e-12 restores it across the range these runs actually visit. What it costs is
# the other thing `eps` does: it is also what stops a parameter whose gradient is
# numerical noise from taking a near-full `lr` step. At 1e-12 a parameter sitting
# at |g| ~ 1e-11 moves at close to `lr` on noise alone. The tell is a parameter
# that ought to be inert drifting, and `scripts/ignition_audit.py` reports the
# per-group norms to see it in.
eps = 1e-12

# The five keys below -- `logit_scale_lr`, `score_scale_lr`, `score_bias_lr`,
# `mix_logit_lr` and `contrast_gate_lr` -- are the two ends' scaling scalars and
# the one offset that pairs with one of them, and they all sit at 2e-3. Each
# block below carries its own arithmetic for what distance that parameter has to
# cover, and 2e-3 is the value those arithmetics were written against, so they
# read straight rather than needing a factor applied to them.
#
# Why they are elevated at all. Every one is a lone parameter whose whole travel
# over a run is bounded by `lr * steps`, because AdamW moves a parameter by about
# `lr` per step whatever the gradient's size. At the base rate a traverse that
# ought to take a few hundred steps takes a few hundred epochs, and the answer to
# "did the listener use the attention path" would be a fact about the learning
# rate rather than about the run. Overshoot is cheap on all five -- the volume's
# gradient vanishes once the scores are calibrated, the mixing weight parks at
# whatever mix the loss wants, the gate parks at whatever share the branch is
# worth, and the channel scale is projected back to `MAX_LOGIT_SCALE` if it runs
# past it -- so a larger rate buys earlier arrival rather than a different
# endpoint.
#
# 2e-3 rather than the 6e-3 they carried from 2026-08-28 to 2026-08-31, and
# rather than the 3e-3 that halving them with `lr` above would have given. The
# five sit at 40x base now where they sat at 60x, so this is the one place the
# 2026-08-31 halving is not uniform: it is a round number picked against the
# arithmetic in the blocks below rather than derived from the base rate. If a
# traverse turns out to be what a run is waiting on, this is the first knob to
# move, and 6e-3 is on the record as having been survivable.
#
# `logit_scale_lr` was removed on 2026-08-30 and restored on 2026-08-31, and most
# of the argument in this block was written for it in the first place: the
# traverse from a near-random opening up to a usable channel was the run's
# bottleneck, and it was bottlenecked on steps. The reason for removing it was
# that a learned scale climbs until the straight-through estimator is shut. That
# is a property of the *gumbel* Jacobian `diag(p) - p pT`, which collapses to
# rank ~1 as p -> 1; the whole ladder now runs `estimator = "identity"`, whose
# Jacobian is `I` at any sharpness, so saturation costs nothing in the backward
# pass and there is nothing left for a climbing scale to shut. See
# docs/channel.md.
#
# `polarity_embedding_lr` is deliberately not in this group and sits at the
# speaker's module rate, 1e-4. It is a 2-d tag rather than a scalar, it has no
# traverse to cover since it opens as an antipodal draw at
# `referent_layer_norm`'s own scale, and its own block below says why it wants
# to be separable from the channel.

# The speaker's channel scale, `GumbelChannel.log_logit_scale`, reported as
# `train_logit_scale`. Stored as a log and read through `exp`, so it is strictly
# positive and its traverse is proportional rather than additive: at 2e-3 and
# 156.25 optimiser steps an epoch -- true for both datasets, see
# `[birds.optimiser] accumulator_steps` -- that is 0.3125 log-units an epoch.
# 1.0 -> 2.0 is `ln 2` = 0.693, so 2.2 epochs; 1.0 -> 0.1 is 7.4 epochs.
#
# It opens at 1.0, has no floor, and is bounded above at `sender.MAX_LOGIT_SCALE`
# = 2.0 by a projection `train.py` applies after each optimiser step rather than
# by a `clamp` in the forward pass. `clamp`'s gradient is zero past the bound and
# is not directional, so a parameter that overshot would get no gradient in
# either direction and weld there, and `weight_decay` is 0.0 so nothing else
# would pull it back. Projection keeps the gradient live right at the ceiling.
#
# Expect the ceiling to bind, though no longer inside the first epoch. At this
# rate a sign-consistent gradient reaches it in a little over two, which under
# the ten-epoch warm-up means it cannot bind before the rate is at full value.
# Sitting at the bound costs nothing and leaving it is free, so binding is the
# design working; what makes `train_logit_scale` worth watching is whether it
# pins at 2.0 at all, and if so whether 2.0 is the wrong ceiling rather than
# 2e-3 the wrong rate; and whether it ever comes back down, which is the
# behaviour a `clamp` would have made impossible. 6e-3 covered the same range in
# 0.74 of an epoch and was the setting from 2026-08-28 to 2026-08-31; that is
# the fallback if 2e-3 proves slow.
#
# No floor, because a downward slide is no longer self-reinforcing: the scale
# reaches the loss through `model_util.scale_without_attenuating`, so a small
# scale is a noisy channel rather than a starved one. A speaker with nothing to
# say being pushed flatter is self-regulation -- confidently emitting the wrong
# symbol is worse than hedging -- and docs/channel.md records the old parameter
# doing exactly that, 0.9094 -> 0.6547 on rung 10.
#
# No effect under `[sender_language_model] normalise_logits = false`, which
# removes the parameter this rate moves. The key stays live and stays stated
# rather than being conditional on another table.
logit_scale_lr = 2e-3

# The listener's counterpart, `ScoreVolume.log_score_scale`, reported as
# `train_score_scale`. One scalar per discriminator, in front of a score whose
# two operands are layer-normed, exactly as the key above sits in front of the
# layer-normed vocabulary logits, and elevated for the same arithmetic: a lone
# scalar moves about `lr` per step whatever its gradient, so its whole travel
# over a run is bounded by `lr * steps`.
#
# One key covers both arms. `AttentionDiscriminator` used to carry its own
# volume under a second key, `mix_scale_lr`, alongside a `log_mix_scale`
# downstream of the mix; it now uses the same `ScoreVolume` the bilinear arm
# does, so `mix_scale_lr` has no successor.
#
# The history, because this rate was the accused twice over. The listener spent
# it turning its own logits down -- 0.9021 -> 0.3731 on rung 09, monotone and
# never returning -- and a scalar at the front of the score multiplies down
# every gradient going back through the message and the channel into the
# speaker, so going quiet looked like it starved the speaker that would have
# made it worth listening to. `a9a6a9c` answered by deleting both scalars and
# putting each volume in the weight matrices. That stopped the volume moving:
# `bilinear_weight_norm` travelled 1.3% over thirty epochs, because a 320x320
# matrix under Adam spends its step turning and only a small fraction of it
# radially. Rung 10, the one rung that has ever ignited, then sat above `ln 2`
# for a whole run. `7b10d47` answered the same objection the other way, hiding
# the scale from the backward pass.
#
# Both were answering something that never reached the optimiser. AdamW updates
# by `m / sqrt(v)`, so a uniform factor on a parameter's gradient scales the
# numerator and the denominator alike and cancels; `train.py`'s
# `clip_gradients` then renormalises each submodule whenever it binds, which at
# recorded speaker norms of ~10 against `clip_grad_norm = 1.0` it does. So the
# rate was never the problem and neither was the coupling. Shrinking stays
# correct on a message carrying nothing, since BCE's minimiser is `p = 0.5`
# everywhere. Read `train_score_scale` as before: a dip and a return is a
# listener declining to commit, a monotone slide is a collapse.
#
# No effect under `[receiver_discriminator] normalise_score = false`, which
# removes the readout this rate moves.
score_scale_lr = 2e-3

# The offset half of the same readout: `ScoreVolume.score_bias`, added after
# the volume, on both discriminators.
#
# `train.py` decides on `lis_scores > 0`, so this is the parameter that places
# the scores against that fixed origin. Before it existed only
# `AttentionDiscriminator` could -- it had a `mix_bias`, and the twelve rungs on
# the bilinear arm had no bias anywhere, `bilinear` being built `bias=False` and
# the readout a bare multiply. `mix_bias` is retired into this: same position,
# same arithmetic, both arms, and now with a key and a column.
#
# Elevated for the reason every lone scalar here is. A 0-d parameter moves about
# `lr` per step whatever its gradient, so its whole travel is bounded by
# `lr * steps`. At the 156.25 steps an epoch both datasets now run, 2e-3 gives
# 0.31 an epoch against a score whose opening spread is 0.577 -- a threshold it
# can actually place within a run. `mix_bias` had no key and so sat at the base
# rate, which at today's 5e-5 would bound its entire thirty-epoch travel at
# 0.23; that looks like an oversight rather than a decision.
#
# What to expect in `train_score_bias`, and this is not the usual "bigger is
# better". Games are balanced 10 positive / 10 negative, so the loss-optimal
# global offset is about zero and staying there is the healthy reading -- it
# means the scores already sit where the threshold assumes. A large sustained
# value is a *finding*: the scores are systematically off, and worth
# understanding rather than celebrating. A scalar also cannot correct a
# per-game offset, and the bilinear score's per-game mean is
# `mean_j(LN(r_j)) . proj`, which varies by game. If this moves and accuracy
# does not, the offset was per-game and the answer is a different readout.
#
# No effect under `[receiver_discriminator] normalise_score = false`. That key
# gates the offset as well as the volume, by design: an inner constant is
# annihilated by nothing and would simply be degenerate with the outer one.
score_bias_lr = 2e-3

# The same elevated rate, for `SenderTransformerLM.polarity_embedding` -- the
# learned tag that tells that speaker which of its two prototypes is the
# positive concept. Deliberately a second key rather than a reuse of the one
# above: `log_score_scale` belongs to the listener and this tag to one speaker,
# so a shared rate would tie two questions the ablation wants to ask separately.
# One of them is also Transformer-only.
#
# It was originally here for the same reason the speaker's channel scale once
# had a rate of its own: the tag was zero-initialised, so it had a distance to
# cover before it did anything at all, and that traverse sat in the window
# where the GRU speaker gets its polarities free from `init_h`. The tag now
# opens as an antipodal draw at `referent_layer_norm`'s own scale, so there is
# no distance to cover and that argument is retired.
#
# What is left is a rate the tag can still move at, in whichever direction the
# loss wants. It opens at `2 * sqrt(d_model)`, which on rung 8's 320-wide
# speaker is 35.8, against the 13.2 that rung 10 -- the one rung on this ladder
# that learns -- reached from a zero init by epoch 29. So the opening is a
# factor of 2.7 high rather than the order of magnitude it might look, and
# whether what follows is a descent or a further climb is an open question this
# key does not decide.
#
# It still wants to be a key of its own for the reason above: it is
# Transformer-only, and hurrying it through a rate shared with the listener's
# volume would move something the ablation is trying to hold still. Separable is
# not the same as elevated, and the two questions
# were being answered by one number.
#
# Demoted to the speaker's module rate on 2026-08-29, from the 2e-3 it carried
# while it was one of the lone scalars, and halved with the rest of the table on
# 2026-08-31. The elevation was the retired traverse's, and nothing replaced the
# argument when the traverse went: 2e-3 was 20x the base rate of the day and 10x
# the group the parameter physically sits in, held there by inheritance rather
# than by a claim. 1e-4 is `[optimiser.module_lr] sender_language_model`, which
# is the clip group `polarity_embedding` belongs to and the rate every other
# speaker tensor takes. A tag that wants to be separable from the channel does
# not thereby want to be separable from the module it lives in.
#
# The two arguments for elevating an embedding both fail here. muP's rule is
# that embedding-like tensors take a Theta(1) rate rather than 1/fan_in -- do
# not scale them *down* with width, not scale them up -- and muP is gone from
# this repo since `dc16734` in any case. The other is sparse vocabulary tables,
# where a row is updated only on the steps its token appears and the rate is
# raised to compensate; this is two rows, tagging positive against negative on
# every example of every batch, which is the least sparse embedding in the
# model.
#
# There is still no arithmetic here, because there is no target to compute one
# against. How large a tag the cross-attention wants is set by whatever scale
# `referent_layer_norm` hands it, which is a property of the trained backbone.
# `polarity_separation` in metrics.csv is the readout, and it is what says the
# old rate was not binding: under the zero init rung 10 ran 0.098 at epoch 0,
# crossing 1.0 at epoch 4, 6.1 by epoch 7, 13.2 by 29, with `train_acc` leaving
# chance in the same epoch the tag crossed 1.0 and plateauing when it did --
# the lockstep that is why the init changed. Under the antipodal init the tag
# opens at 23.5-24 and barely moves: 24.03 -> 23.93 over rung 9's thirty epochs
# and 23.46 -> 21.91 over rung 10's. Neither trace is straining against a
# ceiling, so this drop is expected to be readable in `polarity_separation` as
# no change at all. If it is not, the tag was doing more than those traces show
# and this key is where to put it back.
#
# Applies only to `SenderTransformerLM`; `build_models` skips it for a GRU
# speaker, which is told its polarities apart by `init_h`.
polarity_embedding_lr = 1e-4

# `AttentionDiscriminator.mix_logit`, the weight on the attention path,
# reported as `train_mix_alpha`. Named `mix_*` and not `alpha_*` because this
# table already carries an `alpha`, which is DeepNorm's residual scaling on the
# referent stack and has nothing to do with the mix.
# Elevated for the same reason the two keys above are: it is a lone scalar, and
# Adam moves one about `lr` per step whatever the gradient's size, so its whole
# travel over a run is bounded by `lr * steps`.
#
# A mixing weight is not a volume, which is why this key survived the round
# that took the listener's volumes out and did not come back with them. It says
# what the score is *made of*; `score_scale_lr` above says how loudly it is
# stated. `mix_scale_lr` was a third key and has no successor -- both
# discriminators now share one `ScoreVolume`.
#
# What it has to cover is larger than either of theirs. The mixing weight opens
# at 0.116 -- `mix_floor` 0.1 plus a sigmoid at logit -4.0 -- and a listener
# that decided attention was worth half its score would need the logit to reach
# -0.85, a traverse of 3.15 log-units. At the base 5e-5 and 156.25 steps an
# epoch that is 0.0078 an epoch, so the crossing alone would take 403 epochs of
# a 100-epoch run and the answer to "did attention get used" would be a fact
# about the learning rate. At 2e-3 the ceiling is 0.31 an epoch and the traverse
# is affordable inside eleven, which is what makes `train_mix_alpha` readable as
# evidence rather than as a floor effect.
#
# Note the ceiling is not a prediction. Only a sign-consistent gradient spends
# it, and the probe's free-alpha arms climbed to 0.33-0.44 over 2,000 steps,
# well inside it.
mix_logit_lr = 2e-3

# `ExampleContrast.contrast_gate`, the one scalar between the speaker's contrast
# stage and the identity. Inert unless `[sender] contrast` is true.
#
# It opens at exactly zero, which is what makes the stage an ablation of one
# thing, and the lone-scalar arithmetic above then decides whether it ever
# leaves: AdamW moves a parameter by about `lr` per step whatever the
# gradient's size, so a lone scalar cannot travel further than `lr * steps`. At
# the base 5e-5 and the 156.25 steps an epoch both datasets now run, that is
# 0.0078 an epoch, so a gate reaching even 0.1 -- a tenth of the branch, at the
# scale `out_projection` emits -- would take thirteen epochs of perfectly
# sign-consistent gradient. At 2e-3 it takes fifty steps.
#
# This is also why the gate is a scalar rather than a zero-initialised
# projection matrix. The matrix opens at the identity too, but it would have to
# climb from zero to its own init scale one `lr`-step at a time before it
# contributed anything at all, and `out_projection` starting at a properly
# scaled random direction means the branch is at a sensible magnitude the moment
# the gate opens. See `ExampleContrast`'s docstring.
contrast_gate_lr = 2e-3

# One learning rate per module clip group, and the only mechanism in the
# codebase giving different modules different rates.
#
# The keys are the names in `models.builder.MODULE_GROUPS`, which is also what
# `train.py` clips over: one table, so a module cannot be rateable without being
# clipped or the other way round. An absent key means the base `lr` above; a key
# naming no group raises in `parse_config`, so a typo cannot sit here looking
# like a setting while the module it was meant for runs at base. `build_models`
# writes the resolved rates back as `[optimiser] resolved_module_lrs` so
# args.json records what each group actually ran at, and which groups existed --
# `sender_contrast` is absent when the stage is off.
#
# Stated rather than computed, and that is a reversal. Until August 2026 these
# rates came out of a rule -- `lr * reference_width / d_model / layers`. The
# width half was muP, whose claim is that Adam's stable rate for a matrix
# mapping one width to another goes as 1/fan_in, so a rate tuned at jayelm's
# 1024 is too small at 320 by the ratio. The depth half was not muP and had no
# parametrisation behind it at all; the exponent the literature gives this
# architecture is 1/sqrt(L) rather than 1/L, and broccoli's DeepNorm already
# puts the stack in that regime -- its alpha and beta give an effective branch
# scale of exactly 0.5 * L^(-1/2).
#
# The rule was tried twice and neither half survived on its own terms. `89ab6fc`
# reinstated the width half alone and rungs 9 and 10 both failed to converge,
# which says those rungs sit nearer their stable rate than the flat-at-`ln 2`
# reading assumed. `afcefd0` added the depth half to pull the other way, and the
# rates below are what it produced. So what the rule bought was never a
# principled exponent; it was the per-module *structure*, and the structure is
# what is kept here. A number in this table is a number somebody chose, and can
# be argued with on the evidence of a run rather than defended as a derivation.
#
# Note also what a width rule could not have expressed: at 320 wide it cannot
# tell a ten-block ViT from a one-layer scoring projection. Every rate below
# that differs from another at the same width does so because of the depth
# term, which is the half with nothing behind it.
#
# No rung overrides any of these today, so this table is the whole of the
# per-module story on every rung. Rungs 9 and 10 briefly restated the four rates
# the removed rule had been producing for them; those contradicted the ordering
# below -- they put the speaker's language model at 5.3e-5 against the
# listener's 1e-4, i.e. the listener running ahead -- and were dropped when the
# ordering was adopted.
#
# The opening rates are not flat, and they are not eight independent numbers
# either. Every one of them is `5e-5` times one factor of two:
#
#                        every module
#     speaker            1e-4
#     listener           5e-5
#
# **The whole listener runs at half the whole speaker, and nothing is split
# within an agent.** One claim, one factor, and the ratio is the setting --
# `5e-5` is only where the grid is pinned, at the listener's language model,
# because that is the module jayelm tuned `lr` on. He tuned it at 1e-4, which is
# where this grid was pinned until 2026-08-31; the whole table then halved with
# the base rate, so the shape below is unchanged and only its scale moved. See
# `[optimiser] lr` above for what that halving was testing.
#
# *The listener slower than the speaker* is Rita et al., "On the role of
# population heterogeneity in emergent communication" (arXiv:2204.12982). They
# vary the two agents' training speeds against each other and find that a
# speaker running ahead of its listener gives markedly better compositionality
# and lower message entropy, while the reverse ordering gives the reverse
# effects -- a slow listener acting as a bottleneck that forces a clearer
# protocol. They also report that the *ratio* matters far more than the absolute
# speeds, which is the same thing this repo's own rung 9 runs kept saying: the
# 5e-5 run's `pool_score_norm` grew 17x in 11 epochs against 4.2x in 18 at twice
# the rate, so the pre-ignition creep is limited by gradient sign consistency
# and by the scalar-to-module ratio, not by the step size.
#
# Their knob is not this one, and the transfer is worth stating rather than
# assuming. They control speed by the *number* of gradient updates -- a
# probability `p` of an agent being optimised on any iteration -- where this
# controls the size of each. Under AdamW the two meet at `lr * steps`, which
# bounds how far a parameter can travel however large its gradient is, so
# halving `p` and halving `lr` buy the same travel budget. They are not the same
# thing in the second moment: skipping updates leaves stale momentum and changes
# the noise the optimiser averages over, where a smaller rate does not. Treat
# this as their ordering applied through the knob this codebase has.
#
# *Vision slower than the rest of its agent* was the second claim, and it is
# withdrawn as of 2026-08-29. The backbones now take their own agent's rate:
# `sender_vision` 1e-4 -> 2e-4, `receiver_vision` 5e-5 -> 1e-4, both since
# halved to 1e-4 and 5e-5 with the rest of the table.
#
# It was taken from the VLM fine-tuning literature, where the ordering is about
# not wrecking a representation you already have. Nothing here is pretrained --
# `pretrained` appears nowhere in this repo and `ViT2` is built from scratch --
# so there is no representation to protect, and the transfer was a copy-over
# rather than an argument.
#
# The version stated here was a different argument wearing the same result: the
# backbone is deep, so its function moves further per step than any one of its
# matrices, and everything downstream is grounding on it, so a backbone that
# keeps moving is a moving target. That bites once the backbone computes
# something worth grounding on. At initialisation it does not: a slow backbone
# is not a stable target, it is a stationary random one, and a readout with
# nothing input-dependent to say is exactly the condition under which it starts
# buying channel fidelity by concentrating its logits instead. See
# docs/anecdotes.md for rung 9's version of that.
#
# What this does *not* claim is that the vision rate caused any particular run
# to fail. Under AdamW a parameter's travel is `lr * steps * sign consistency`
# and a gradient norm measures none of the three, so the collapsed speaker
# gradients on rung 9 are not evidence either way. The claim is only that the
# ordering had no argument behind it, and an unargued factor of two is not worth
# keeping.
#
# Note the direction of travel. muP was producing 3.2e-5 for both backbones --
# 1e-4 x 1024/320/10 at ViT2's ten layers -- so `dc16734`'s flat table had
# already raised them to 1e-4 and 5e-5, and this raises them again. Vision has
# been the fastest-moving entry in this table across three regimes.
#
# The speaker's prototyper and contrast stage, and the listener's token
# embedding and discriminator, took their agent's rate under the two-claim grid
# too. Nothing about them changes; there is simply no longer a split for them to
# be on a side of.
#
# What this is not. One claim with a literature behind it, at a magnitude with
# nothing behind it -- a factor of two, chosen because the ordering is the claim
# and the size is not. There is no transfer guarantee here of the kind muP
# offers for width, and no run yet separates the ordering from the magnitude.
#
# Note also what it does to the baselines. Rungs 1 and 2 are jayelm's
# architecture, and since the 2026-08-31 halving no module on them sits at
# jayelm's own `lr = 1e-4` except the four speaker groups, which arrive there
# from the other side -- the listener, the half he actually tuned, now runs at
# 5e-5. The ablation stays internally consistent, since every rung takes the
# same table; what is given up is the claim that the bottom of the ladder
# reproduces jayelm exactly. If a baseline reading has to be comparable to
# theirs, flatten the table in that rung rather than everywhere.
[optimiser.module_lr]
sender_vision = 1e-4
# The adapter takes its agent's rate rather than a rate of its own. It is an
# architectural constant present at every rung, so a rate here would be a knob
# on every rung at once, and the speaker's stages are all at 1e-4 -- there is no
# argument for this one stage sitting between the vision model and the
# prototyper at a third rate. See `model_util.ReferentAdapter`.
sender_adapter = 1e-4
sender_prototyper = 1e-4
sender_contrast = 1e-4
sender_language_model = 1e-4
receiver_vision = 5e-5
receiver_adapter = 5e-5
receiver_token_embedding = 5e-5
receiver_language_model = 5e-5
receiver_discriminator = 5e-5

[scheduler]
epochs = 100

# Ten epochs of linear ascent to the configured rates before the schedule
# proper, set 2026-08-28 alongside the elevation of the scaling scalars -- 6e-3
# then, 2e-3 since 2026-08-31.
#
# The two are one change. The elevation is there so that the traverses -- the
# listener's volume and offset, the contrast gate -- are not what
# a run is waiting on; the ramp is there so that arriving fast is not the same
# as arriving first. A lone scalar at 2e-3 crosses its whole useful range in a
# few hundred steps, and a listener that calibrates while the speaker's argmax
# is still close to input-independent co-adapts to a degenerate code. Under the
# ramp the scalars reach full
# rate only at epoch 10, by which time the representations have had ten epochs
# at their own rates.
#
# Ten of `epochs` above is a tenth of a real run and a third of the 30-epoch
# smoke runs rungs 9 and 10 have been using; if this is kept, revisit it as a
# fraction rather than as a count. `train.py` takes
# `min(warm_up_epochs, epochs)`, so a run shorter than this is all ramp rather
# than an error.
#
# `PASS` scales each parameter group from its own recorded base rate, so the
# ramp applies to the elevated scalar groups and the module groups alike and
# holds the ratio between them constant throughout. That ratio is the quantity
# rung 9's 5e-5 and 4e-3 runs suggested ignition is actually set by, so a warm-up
# that preserved it was the only kind worth adding: one that ramped only the
# base `lr` would have moved the thing under test.
#
# **None of the above described a run until 2026-08-28.** The warm-up went in
# without touching `cool_point_multiplier`, which was 1.0, and `PASS` applied
# that floor to every cycle alike -- pinning the rate to base from the first step
# and flattening the schedule out of existence. `build_lr_schedule` now carries
# the floor in the descending cycle rather than in `PASS`, and `warm_up_epochs`
# does what it says. Traces written before that date ran flat whatever their
# `[scheduler]` said. See `train.build_lr_schedule` and `tests/test_lr_schedule.py`.
warm_up_epochs = 10

# `flat` or `cosine` -- an intention, not a curve.
#
# `flat` holds the configured rates for the whole run after the warm-up. `cosine`
# descends from them to `cool_point_multiplier` of them along the falling half of
# a cosine. Both *open* at the base rate, so the warm-up hands over continuously
# whichever is chosen; that is the property the sentinel surface exists to
# guarantee, and it is why `gradboard.cycles.FN_LIBRARY`'s own names are no
# longer accepted here. Two of them -- `ascent` and `triangle` -- open at their
# trough, so a warm-up in front of one threw its rate away at the handover and
# re-climbed it over the remaining epochs, with nothing in the config saying so.
#
# `flat` stays the default because it is what every trace in this repo was
# actually run under, whatever its config said, and because a decay is a claim
# about a run that has already ignited. See `parse_config.LR_SCHEDULE_SHAPES`.
lr_schedule_shape = "flat"

# `cool_point_multiplier` belongs here, and is deliberately absent: `flat` does
# not descend, so there is nothing for a floor to mean, and `validate_config`
# rejects one set beside it rather than leaving it to sit unread. Set it -- the
# fraction of the base rate the schedule descends to, in [0, 1) -- in the same
# breath as `lr_schedule_shape = "cosine"`, and nowhere else.

range_test = false

[sender]
class = "Sender"
feature_model = "ResNet18SmallInput"
vision_dropout = 0.0    # On per-image embeddings, before pooling. jayelm's
                        # speaker has no dropout here, and it would stack a
                        # second regulariser on the same pathway.
prototype_dropout = 0.1 # On the pooled concept vectors, before the language
                        # model. This is where jayelm's single speaker-side
                        # `--dropout` sits (at 0.1 in their runs).
prototyper = "AveragePrototyper"
language_model = "SenderGRULM"
# Run one self-attention over all the referents, positive and negative together,
# and add it back as a residual before they are pooled. Both prototypers work
# *within* a polarity, so without this nothing in the speaker ever compares a
# positive example against a negative one -- the two halves first meet as single
# vectors in the language model's cross-attention.
#
# A boolean rather than a class name because there is one of these or there is
# nothing: it is a residual on the referents, so "off" is the absence of a
# module and not a different one. It opens at exactly the identity either way;
# see `contrast_gate_lr` above and `models/sender.py`.
#
# Off by default, and note what it costs when it is on: the message becomes a
# function of the sampled negatives rather than of the concept alone, so the
# same concept with different distractors gets a different message. That is what
# `topsim` penalises, so this can raise accuracy and lower compositionality at
# once -- `train_contrast_share` and `train_contrast_within_share` are what make
# that readable. See docs/measurement.md.
contrast = false

[sender_contrast]
# Inert unless `[sender] contrast` is true.
#
# One `MHAttention` and no feedforward: this stage exists to let the referents
# see each other, and the prototyper and language model downstream are where the
# depth already is. `d_model` 320 with 5 heads is head_dim 64, the head
# dimension every attention module in the repo now has -- see
# `[sender_feature_model]` for where that number comes from. The referents
# arrive at whatever width the backbone emits (512 for ResNet18, 640 for a
# concat-pooled ViT2), and this stage owns the projection between the two, as
# the listener's slots own theirs.
d_model = 320
heads = 5 # head_dim 64
self_attention_dropout = 0.0

[sender_feature_model]
# The one ViT specification, used by every rung that swaps a CNN for a
# Transformer on either agent. Sized against ResNet18's 11,176,512 parameters:
# 320 wide, 10 layers, feedforward inner 576 comes to 10,317,986, or 92%. It was
# 384/9/384 for birds and 128/4/128 for ShapeWorld, which matched each dataset's
# own baseline backbone -- but `SenderTransformerLM` pins its width to the vision
# model's, so the ShapeWorld language model inherited 128 and came out 12.8x
# smaller than the GRU it is meant to be compared against. One width for both
# datasets is what makes that comparison mean anything.
#
# `heads` is 5 for a head dimension of 64. Every attention module in the repo now
# has that same head dimension -- see `[receiver_discriminator]`, which reaches it at
# 256 wide with 4 heads. The previous rule was head_dim 32, chosen as broccoli's
# 2D axial-RoPE floor; 64 clears that floor with room, so the constraint no
# longer decides the number.
d_model = 320 # Only applies to Transformer vision models
layers = 10 # Only applies to Transformer vision models
heads = 5 # head_dim 64. Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models
# Architecture settings that used to be hardcoded in the model classes, and so
# were neither recorded in a run's `args.json` nor sweepable. Every value here
# is the one that was previously hardcoded, so promoting them changed nothing.
#
# Not everything broccoli accepts is exposed. Arguments that select a *class*
# (`linear_module`, `head`, `logit_projection_layer`) stay in Python, since TOML
# cannot hold one; `activation` is the exception, via the name -> class map in
# `models/model_util.py`. Arguments determined by the data or by the surrounding
# code -- `source_size`, `input_size`, `in_channels`, the pooling kernel
# geometry -- are derived rather than configured. The `cnn_*` group is inert
# while `cnn` is False and stays in Python too.

# 576 rather than the 554 the ResNet18 parameter budget solves for exactly, and
# the two extra points of budget above buy alignment. SwiGLU makes this number
# the shape of two matmuls -- `Linear(320 -> 2*ff_inner_size)` and
# `Linear(ff_inner_size -> 320)` -- which between them are about 47% of the
# ViT's FLOPs. bf16 is two bytes and the tensor-core kernels want 16-byte
# aligned rows, so cuBLAS's fast path wants those dimensions to be multiples of
# 8, and NVIDIA asks for 64 or 128 for good tile efficiency. 554 and its double
# 1108 are neither; 576 is a multiple of 64 and 1152 a multiple of 128.
#
# 576 over the other aligned candidates because it stays closest to the budget.
# 512 aligns no better in practice and drops the backbone to 86% of ResNet18,
# four points *below* the target where 576 is two above; 552 is a multiple of 8
# but not 64.
#
# Worth 1.2-2x on the affected matmuls at best, not the whole gap to the ~35
# TFLOP/s per GPU the ImageNet ViT in `vit-representation-learning` sustains --
# note that run reaches 896 (128 x 7) by setting `transformer_ff_ratio`, which
# makes broccoli discard `ff_inner_size` entirely. See `compile` at the top of
# this file for the other half, and `scripts/vit_throughput.py` to measure both.
ff_inner_size = 576 # Only applies to Transformer vision models
# Off, as in all four stacks below; the argument is at
# [sender_language_model]. Not the stack that argument is about -- this one is
# not inside the sampling loop -- but a bootstrap failure is not diagnosed with
# regularisers running.
stochastic_depth = 0.0 # Only applies to Transformer vision models
depthwise_linear_stochastic_depth = true # ramp the rate linearly over depth
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
# Rotary, and rotary only. There is no `absolute_position_embedding` key any
# more: it is pinned False at every construction site in the repo.
#
# The two are not complementary. RoPE encodes position where it is used, as a
# rotation of the query and key subspace, and rotating a subspace is sufficient
# for relative position -- the unrotated dimensions are not a gap for an
# absolute table to fill. What an absolute embedding adds is a second,
# differently-shaped answer to the same question, learned from scratch, added
# once to the residual stream at the input, and relearned per sequence length.
# broccoli's own `ViT` defaults to exactly this pair for the same reason.
#
# Dropping it took ~190k parameters off every Transformer rung, most of it two
# 289-position tables in the ViT2 backbones, and made the listener's comparer
# identical in size on ShapeWorld and CUB -- the whole difference between them
# had been the absolute table sized to `message_length`.
relative_position_embedding = true
# `pre_norm` and `post_norm` are coupled and must be flipped together: broccoli
# rejects a transformer that is both, so setting `pre_norm = true` without also
# setting `post_norm = false` raises at construction rather than picking one.
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
pooling_type = "concat" # max, average or concat
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
self_attention_dropout = 0.0
# DeepNorm's residual scaling, `alpha` on the skip and `beta` on the branch.
# "deepnorm" resolves both from the stack's own `layers` at construction --
# `(2N)^(1/4)` and `(8N)^(-1/4)` -- so a config that changes its depth cannot
# leave them behind at constants derived for a different one. A number pins
# either of them instead; 1.0 is the no-scaling identity.
#
# Post-norm at `alpha = beta = 1.0` is vanilla post-LN, which is the
# configuration these stacks are least likely to train in: the depths here are
# 4 to 10, so the constants are not close to 1 (1.68/0.42 at four layers,
# 2.06/0.34 at nine). broccoli applies `beta` as a forward multiplier on the
# branch rather than as an initialisation scaling on its projections, and the
# post-norm `RMSNorm` after it carries a learnable gain, so a branch that earns
# it can learn its way back out of the opening ratio. These set where a stack
# starts, not a ceiling it is held to.
alpha = "deepnorm"
beta = "deepnorm"

[sender_language_model]
token_embedding_size = 500
d_model = 1024
vocabulary = 14
message_length = 7 # max message length. note this includes sos/eos token, i.e. the true length is this - 2
# There are exactly two exploration controls, and they do different jobs.
#
# `uniform_weight` (w) is the *ceiling* on fidelity, and so the floor under
# exploration. Mixing caps a slot's winner at `1 - w + w/V` however sharp the
# logits are, so at least `w * (1 - 1/V)` of symbols are flipped no matter what
# -- 0.093 at w = 0.1, V = 14. That is a permanent per-symbol corruption rate
# training cannot reduce, which is the point: it keeps late training from
# committing the channel entirely. This is jayelm's `--uniform_weight`, and its
# role here is the one it has there.
#
# V is `vocabulary` above, the emittable tokens only: the four reserved slots
# (PAD/SOS/EOS/UNK) are masked to -inf before the mixture, which is spread over
# the finite entries, so these divide by 14 rather than by 18.
uniform_weight = 0.1

# There is no key for the channel's scale. `GumbelChannel.log_logit_scale` is a
# parameter that opens at 1.0 and is bounded above at `sender.MAX_LOGIT_SCALE` =
# 2.0; `[optimiser] logit_scale_lr` is what governs it and carries the argument
# for the ceiling and for the rate. Recorded here is only where that leaves the
# channel, since these are the numbers `realised_survival` and
# `unmixed_survival` are read against.
#
# The two ends of the scale's range, as unmixed survival, at V = 14 and V = 20:
#
#                            scale 1.0   scale 2.0
#     fresh speaker            0.280       0.511      (V = 14)
#     sharpest legal shape     0.789       0.995
#     fresh speaker            0.226       0.455      (V = 20)
#     sharpest legal shape     0.838       0.998
#
# The first row of each pair is the opening: a freshly initialised speaker's
# normalised logits are i.i.d. standard normal, so it holds its argmax about
# 28% of the time on ShapeWorld. That is deliberately modest -- a fresh
# speaker's argmax barely varies with its input, so a confident opening means it
# emits near enough one message for everything from the first batch and the
# listener co-adapts to that before the speaker's embeddings are worth grounding
# anything on.
#
# The second row is the ceiling `layer_norm_logits` imposes on *shape*: one token
# at sqrt(V-1) and the rest at -1/sqrt(V-1), a margin of V/sqrt(V-1). It is
# reached at a scale of one, which is the point -- fidelity has never had to come
# from the scale, and `logit_margin` is the column that says which route a run
# took. Multiply the two bounds and 0.995 is the most confident a ShapeWorld
# speaker can ever be before `uniform_weight` mixes anything in.
#
# `realised_survival`, `unmixed_survival`, `logit_margin` and `logit_scale`
# report each epoch where a run actually went. Note survival is a *mean* over
# slots and confidence is skewed, so it hides a wide spread: exploration
# concentrates on the slots the speaker is unsure about, which is the behaviour
# wanted.

# Which gradient estimator the speaker learns through. The forward pass is the
# same either way -- a hard one-hot drawn as `argmax(logits + Gumbel)`, which is
# a faithful categorical sample -- so this changes what the speaker learns from
# and not what it says. At the same seed the two branches emit identical
# messages.
#
# `"gumbel"` differentiates the soft sample `gumbel_softmax` builds on the way,
# whose Jacobian is `diag(p) - p pT`. `"identity"` replaces that with I:
#
#     y = onehot.detach() + (z - z.detach())
#
# The reason to want the second is *rank*, not magnitude. The per-token gradients
# are summed into one vector before they reach the language model and the vision
# trunk, and `diag(p) - p pT` at p near one-hot has rank ~1, so all but one
# direction is destroyed before any optimiser or clipper sees it. Magnitude
# largely cancels -- AdamW updates by `m / sqrt(v)`, and `clip_gradients`
# renormalises what survives -- but no per-parameter normaliser recovers a rank.
# Bounding the speaker's sharpness bounds that collapse; only this removes it,
# which is why `logit_scale_lr` could be given back on 2026-08-31.
#
# `"identity"` is the default as of 2026-08-30, having been `"gumbel"` for the
# few hours between the switch being added and the first runs coming back. Two
# things decided it.
#
# The failure it was written for is real and was killing rungs. On
# `shapeworld-post-silhouette-update.csv` the gumbel Jacobian took the speaker's
# four gradient norms to ~2e-7 and the run died at epoch 21; the first identity
# runs hold them at 0.3-1.5 against `clip_grad_norm = 1.0`, and birds' six-epoch
# flat start -- previously the `log_logit_scale` traverse -- is simply gone.
#
# And a ladder cannot afford to differ in two things at once. Every rung on the
# ablation is a single change from the one below it, so an estimator set on some
# rungs and not others would confound the backward pass with whatever
# architecture that rung was there to move. One estimator for the whole ladder
# is the only setting that keeps the steps readable.
#
# What that costs is the A/B: nothing on the ladder now runs the gumbel backward
# pass, so the comparison has to be made deliberately by copying a rung and
# flipping this key. It is worth doing that way round -- both branches sample
# through the same `_gumbel_sample`, so a same-seed pair emits identical
# messages and differs in nothing else. See docs/channel.md.
estimator = "identity"

# Whether the channel is normalised at all: `layer_norm_logits` on the emittable
# logits, and the learned `log_logit_scale` in front of it. `true` is today's
# behaviour and is bit-identical to the code before the key existed. `false`
# removes both.
#
# The two go together because the scale has no meaning without the normaliser.
# It multiplies a quantity pinned to unit variance, which is what makes
# `MAX_LOGIT_SCALE = 2.0` a statement about survival probability rather than
# about whatever magnitude `outputs2vocab` happens to emit; raw logits carry a
# scale of their own already, and a second one in front of them would be
# degenerate with the projection that produced them.
#
# **Why the switch exists.** `logit_scale` climbs monotonically from 1.001 and
# pins at `MAX_LOGIT_SCALE` by epoch 14 of 29 in all ten arms of both silhouette
# titrations, while `logit_margin` sits at 0.44-0.88 against a budget of 3.883.
# The speaker is asking for fidelity it cannot have, through the only route the
# normaliser leaves open, and a one-way traverse that runs until something stops
# it is not a control finding an optimum. Its counterpart is
# `[receiver_discriminator] normalise_score`.
#
# **This is not a revert, unlike its counterpart.** `layer_norm_logits` was
# already present at `ce7d6a5`, having arrived at `1510a55`/`df95063` on 10-12
# August, so every ShapeWorld run that has ever learned shape ran with it on.
# `false` goes back past that point, to a channel no successful run has used.
# That is why these are two keys and not one.
#
# **Four columns change meaning when this is off, and stay computable.**
# `logit_margin`, `logit_prior_share`, `unmixed_survival` and
# `realised_survival` are all measured on post-norm logits, "in units of the
# logits' own standard deviation", and `sharpest_logit_margin`'s fixed budget of
# 3.883 at V = 14 is a property of the normaliser and does not exist without it.
# They are read against a raw spread here instead, so do not compare them across
# this key. `logit_spread` is taken *before* normalisation and is unaffected;
# `train_logit_scale` and `train_clip_log_logit_scale` read NaN.
#
# Checkpoints do not cross this key: with it off, `log_logit_scale` is absent
# from the `state_dict`, so nothing written under one setting loads under the
# other whatever `resume` says.
normalise_logits = true

tau = 1.0                     # Gumbel-softmax tau. Gradient shaping only:
                              # the emitted symbol is an argmax and so is
                              # invariant to it. jayelm's `--tau`. It shapes the
                              # soft surrogate the `"gumbel"` estimator
                              # differentiates; the `"identity"` estimator
                              # discards that surrogate, so on that branch this
                              # key does nothing at all.
dropout = 0.1
layers = 1

# One key, two speakers, and on the Transformer it selects an architecture
# rather than a mask. In both cases `false` is the causal, left-to-right
# speaker:
#
#   false  SenderGRULM          unidirectional `nn.GRU` -- the baseline
#          SenderTransformerLM  autoregressive Transformer decoder: `layers`
#                               blocks at message length, each cross-attending
#                               into the latent array, one symbol sampled at a
#                               time conditioned on the symbols before it
#
#   true   SenderGRULM          `nn.GRU(bidirectional=True)`
#          SenderTransformerLM  Perceiver IO: `layers` blocks of self-attention
#                               over the *latent* array, and a learned query
#                               that reads it back out as every symbol at once
#
# `false` here, so the decoder is what a speaker is unless a config says
# otherwise. The ablation rungs that run the parallel arm say so explicitly --
# 13 and 14, and see rung 7 for the argument about which arm belongs where.
#
# What this no longer does on `SenderTransformerLM` is set `causal` on the
# latent self-attention stack, which is what it used to mean and which bought
# nothing. The latent array is not a sequence in time: it is read back out in
# one shot, so latent index 0 is no earlier than latent index 9 in any sense the
# task can see, and masking it left to right only hid most of the image from the
# low-index latents. No Transformer in this repository now runs a causal mask
# except the decoder arm's self-attention, over the message, where it means what
# it says.
#
# Note the two arms are not the same size at the same `layers` -- a decoder
# block carries a cross-attention an encoder block does not -- so a config that
# flips this and nothing else changes the parameter count by about 43%. See
# `layers` in rungs 7 and 13.
bidirectional = false
heads = 4 # Heads per layer - only applies to Transformer language models

# How much longer the speaker's *latent* array is than the message it produces.
# Only applies to `SenderTransformerLM`, which is the only speaker with a latent
# array at all; `SenderGRULM` receives this key through the same splat and
# ignores it.
#
# A learned query array cross-attends into the two prototypes, and this knob sets
# how many positions that query array has. What happens to the result depends on
# `bidirectional` above: the parallel arm processes it with a self-attention
# stack and then reads it back out at the message's length, while the decoder arm
# treats it as a fixed memory that every block cross-attends into. Either way
# nothing downstream can see this number -- `message_length` and the receiver are
# untouched by it.
#
# It is here because the channel from the referents into the message is narrower
# than it looks. broccoli's `MHAttention` has no residual and the speaker's byte
# array is two prototypes, so each query position's whole dependence on the
# referents is one softmax weight per head: the referents reach the language
# model through `heads * latent_length` scalars and nothing else. Under the
# previous ShapeWorld configuration that was 4 heads x 5 positions = 20 numbers.
# At 2.0 and the new 5 heads it is 50 for ShapeWorld and 80 for birds.
#
# Rounded, not floored. 2.0 is exact at both message lengths (5 content symbols
# -> 10 latents, 8 -> 16), so the rounding only matters if this is swept.
#
# 1.0 is now the floor, and it is enforced. The message is the *tail* of the
# latent array on both arms, so what this knob buys is free slots ahead of the
# message rather than a separately-sized array behind it; an array shorter than
# the message has nowhere to put the message and `SenderTransformerLM` raises.
# At 2.0 that is 5 free slots plus 5 message slots on ShapeWorld, 8 plus 8 on
# birds.
#
# Those free slots are load-bearing and not merely spare capacity. Nothing ever
# overwrites them, so under the causal mask every message slot reads all of them
# at every step -- which is what cross-attending into a memory used to do, folded
# into the self-attention branch. At 1.0 there are none, and a measured init-time
# code strength falls from 0.2236 to 0.2059 (see docs/anecdotes.md for what that
# number is). Raising it further does very little: 3.0 measures 0.2254.
#
# It used to describe a *separately sized* array that an `output_query` read back
# down to the message's length, and 1.0 then still built that readout so a sweep
# varied one thing rather than two. The readout is gone; the tail is the message.
latent_message_multiplier = 2.0
# Learned prefix tokens on the stack that runs over the latent array. One stack
# on both arms now, so they sit ahead of the whole array -- ahead of the free
# slots, which sit ahead of the message -- and every message slot attends back to
# them through the causal mask.
utility_tokens = 4 # Only applies to Transformer language models
# See [sender_feature_model] for what these are and why they are here. Note the
# vocabulary logits are always layer-normalised before sampling and there is no
# knob for it: `logit_scale` multiplies logits of unit variance, and
# `MAX_LOGIT_SCALE` bounds it against that, so the two are a pair.
#
# 512 rather than the 576 every other stack takes, and this is a sizing argument
# rather than a taste one. When the speaker's blocks stopped cross-attending into
# a latent memory they lost a sublayer each, about 1.6M parameters across the
# stack, and the ladder is matched on parameters against rung 1's GRU. Six blocks
# at 512 restores it at 1.015x on both datasets -- 5,854,089 against 5,764,923 on
# ShapeWorld, 5,859,855 against 5,774,073 on birds -- which is closer to 1.0 than
# the 1.029x the ladder carried before. `test_ablation_configs.py` pins both.
#
# Still a multiple of 64, which is what [sender_feature_model] asks for: 8 x 64
# here against the ViT's 9 x 64. Only Transformer language models read this;
# `SenderGRULM` ignores it, and `[birds.sender_language_model]` inherits it, so
# this one key sizes the speaker on every rung from 9 up.
ff_inner_size = 512 # Only applies to Transformer language models
# 0.1, matching every other stack. It was 0.2 here alone, from when the speaker's
# language model was the deepest thing in the run relative to what it had to say;
# at 5 layers over a latent array of 10 or 16 it is now the shallowest of the
# three transformer stacks, and there is no argument left for regularising it
# twice as hard as the ViT in front of it.
# Off. Turned off on 2026-08-25 while chasing rung 09's failure to ignite, and
# this is the stack the argument is actually about.
#
# broccoli redraws the keep mask per `forward`, per example, and
# `decode_autoregressively` runs the stack once per symbol. So every symbol of a
# message was generated by a differently-dropped network: the speaker's concept
# -> logits map jittered within a single message. (The stack was a
# `TransformerDecoder` when this was written; it is the shared
# `TransformerEncoder` now, and the redraw is the same.) That is a second noise source on top of the Gumbel
# channel, and one `realised_survival` cannot see, because it takes the logits
# as given and measures only what the channel does to them.
#
# Why that might matter here. The channel opens when the listener learns the
# speaker's *accidental* code -- the random but fixed concept -> symbol map a
# fresh speaker has. That used to be measurable as the sign consistency of the
# gradient on the then-learned `log_logit_scale`: an audit of rung 09 put it at
# 49-52% over 1100 steps, against rung 07 crossing to ~79% at step 475. The scale
# is a constant now and that particular reading is gone, but the point stands --
# a code the listener can learn is one that holds still, and stochastic depth is
# one of the few things in the speaker that stops it holding still.
#
# 0.1 is small and this may well not be the cause. It is off because a
# regulariser is a poor thing to leave running while diagnosing a bootstrap
# failure, not because it has been shown to matter. Restore to 0.1 in all five
# places if runs come back overfitting.
stochastic_depth = 0.0 # Only applies to Transformer language models
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
relative_position_embedding = true
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
# See [receiver_language_model] for what these two are.
#
# `cross_attention_dropout` covers every cross-attention in the speaker, on both
# arms: the one that reads the prototypes into the latent array, the parallel
# arm's readout back down to message length, and the decoder arm's per-block
# reads of the latent memory -- `layers` of them rather than one, so this knob
# reaches considerably further on that arm than on the other.
# `self_attention_dropout` covers the stack, which is the self-attention over the
# latent array on the parallel arm and over the emerging message on the decoder
# arm.
self_attention_dropout = 0.0
cross_attention_dropout = 0.0
alpha = "deepnorm" # see [sender_feature_model]
beta = "deepnorm"

[receiver]
class = "Receiver"
feature_model = "ResNet18SmallInput"
# Two slots, not one `comparer`. The listener encodes the message and then scores
# the candidates from that encoding, and until these were split a single key
# chose both halves at once: swapping `BilinearGRUComparer` for
# `TransformerCrossAttentionComparer` changed the message encoder (790k of GRU
# for 2.3M of decoder stack) *and* the comparison (a bilinear form for a second
# decoder stack) in one move, so "attention helps" could not be attributed to
# either. Four combinations are reachable now, and the two new ones are what
# separate "an encoder that reads the candidate set helps" from "a comparison
# built on attention helps".
#
# Exactly one message encoder is built, always. `AttentionDiscriminator` carries
# an internal bilinear path, and that is a second *comparison* reading whatever
# this language model produced -- there is no key that turns on a second encoder,
# and if one ever looks necessary the slot contract is wrong. See
# code/models/receiver.py.
language_model = "ReceiverGRULM"         # or ReceiverCrossAttentionLM
discriminator = "BilinearDiscriminator"  # or AttentionDiscriminator
# Note this renames every listener key in the checkpoint --
# `receiver.comparer.*` becomes `receiver.language_model.*` and
# `receiver.discriminator.*` -- so no checkpoint written before the split loads
# after it, whatever `resume` says. `probe_shape.py` fails loudly on a mismatch
# rather than silently loading nothing, but the files are incompatible: this is
# a re-run of a whole comparison, not half of one. Same situation as the
# `compile` note at the top of this file, and for the same reason.
# The listener's only dropout, and it lives here now rather than in either slot:
# `Receiver` masks the referent embeddings once and hands the same masked tensor
# to both, so no configuration can regularise twice. Counterpart to the sender's
# `prototype_dropout`, and set to match it — the literature says listeners want
# at least as much regularisation as speakers for compositional languages to
# emerge, and jayelm's single `--dropout` (0.1) gave both agents the same weak
# setting.
#
# It masks *elements* of `(batch, n_objects, features)`, so it removes features
# within each candidate rather than removing whole candidates, which would leak
# the label ordering.
#
# The message operand is not masked. It arrives through the Gumbel channel, whose
# noise `logit_scale` and `uniform_weight` already calibrate, so a mask on top is
# a second and uncalibrated perturbation of a signal that has one. The referents
# arrive clean, which is what makes that the side where a mask regularises rather
# than compounds.
#
# Note this now applies *before* each slot's norm, where both of the modules it
# replaces applied it after. A LayerNorm following dropout renormalises the
# corrupted vector, so the two are genuinely different operations and the
# pre-split numbers reproduce only at 0.0.
dropout = 0.1
# No `vision_dropout` here, unlike [sender]: it would mask the same tensor as
#     `dropout` above, with nothing but a reshape between them, so the two would
#     compose into a single mask at a rate neither knob names.

[receiver_feature_model]
d_model = 320 # Only applies to Transformer vision models
layers = 10 # Only applies to Transformer vision models
heads = 5 # head_dim 64. Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models
# See [sender_feature_model] for what these are and why they are here.
ff_inner_size = 576 # Only applies to Transformer vision models
# Off; see [sender_language_model].
stochastic_depth = 0.0 # Only applies to Transformer vision models
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
relative_position_embedding = true
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
pooling_type = "concat" # max, average or concat
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
self_attention_dropout = 0.0
alpha = "deepnorm" # see [sender_feature_model]
beta = "deepnorm"

[receiver_language_model]
# Both listener language models read the token embedding table, so its width is
# theirs to state and `build_models` sizes `nn.Embedding` from here.
token_embedding_size = 500
# The GRU's hidden size, and the decoder stack's model width. One key per table
# rather than one shared between them: these are different modules and there is
# no reason they should agree.
#
# This used to have to be read alongside `heads` below, with a warning that 1024
# does not divide 5. That contradiction was an artefact of one table describing
# two modules and is now gone: `heads` is read only by
# `ReceiverCrossAttentionLM`, which sets its own width here, and no broccoli
# `d_model % n_heads == 0` assertion is reachable from these defaults.
d_model = 1024
# GRU depth. 1 layer, unidirectional -- jayelm's listener exactly, and the
# baseline this ladder's rung 1 is meant to be.
#
# Parity with the transformer arm has moved. It used to be sought at a *shared
# width* of 256, with this key at 2 and `bidirectional = true`: 1,972,224
# against `ReceiverCrossAttentionLM`'s 2,318,427 at rung 11's widths, where a
# 1-layer bidirectional GRU is 789,504. Note 2 layers bidirectional is 2.5x 1
# layer and not 2x -- the second layer's input is the first's concatenated
# output, so its `weight_ih` is double.
#
# The trouble is that nothing in the ladder sets both widths, so at the 1024 and
# 500 stated above -- which every rung up to 14 inherits -- those keys did not
# buy parity, they bought a listener of 28,262,400 parameters against 2,466,139
# for the transformer arm. That is 49% of the baseline pair, spent reading a
# 7-symbol message from a 14-word vocabulary: at most 26.6 bits. The rung 14 ->
# 15 comparison spanned an 11.5x listener.
#
# So parity is now sought at jayelm's width instead, and the transformer arm is
# the one that moves. This GRU is 4,687,872 here; rungs 15 and 16 take
# `ReceiverCrossAttentionLM` to 6 layers for 4,784,566, which is +2.1%. Deepening
# the arm that is being tested is the cheaper distortion: it leaves the baseline
# listener the published one, and the claim "attention helps" stays a claim about
# attention rather than about a parameter gap.
#
# Parity is still a property of the pair of widths rather than of this key. Set
# both widths together, or set neither: a rung that overrides `d_model` here and
# nothing in the transformer table has broken the match again, in whichever
# direction.
#
# And parameter parity is not interface parity. `output_size` is 1024 on this
# GRU against 256 on the transformer, so the discriminator downstream is a
# different size on the two arms even at matched language-model parameters.
layers = 1
# Read by both, and meaning something different to each. `ReceiverGRULM` passes
# it to `nn.GRU(bidirectional=)`; `ReceiverCrossAttentionLM` reads it as
# `causal = not bidirectional`, on the stack that encodes the incoming message.
#
# `false` here is jayelm's GRU, per `layers` above. Every rung that builds
# `ReceiverCrossAttentionLM` states `true` in its own file, which is the right
# value for that class and not the same decision: masking that stack left to
# right would model a listener committing to symbol 1 before it has seen symbol
# 5, and the message arrives whole.
bidirectional = false
message_length = 7 # Only applies to Transformer language models. Should be the same as sender_language_model.message_length
# Transformer language model only, whose depth is `layers` above, shared with the
# GRU. 4 heads at 256 wide is what rung 11 sets, for the head dimension of 64
# that every attention module in the repo has; 5 is here so the key exists.
heads = 5 # Only applies to Transformer language models
utility_tokens = 0 # Only applies to Transformer language models
ff_inner_size = 576 # Only applies to Transformer language models
# Off; see [sender_language_model]. Was already inert at a single block, where
# a linear depth ramp gives one rate of 0.0 anyway -- stated as 0.0 so the
# five keys read the same.
stochastic_depth = 0.0 # Only applies to Transformer language models
# Attention dropout. Named per attention type, and kept strictly separate from
# `[receiver] dropout`, which regularises the referent embeddings rather than
# anything inside a module. `self_attention_dropout` covers the message reading
# itself; `cross_attention_dropout` covers the message reading the candidate set,
# once per block. The speaker carries the same two keys with the same meanings,
# so both agents are regularised on the same terms. Note broccoli's
# attention-pooling layer (`SequencePool`, used by `AttentionPrototyper` and the
# ViT head) takes no dropout argument at all, so it is covered by neither.
self_attention_dropout = 0.0 # Only applies to Transformer language models
cross_attention_dropout = 0.0 # Only applies to Transformer language models
# See [sender_feature_model] for what this is and why it is here. It drives the
# message stream, whose axis is an order. The candidate set this stack
# cross-attends into is a set and takes no positional embedding at all.
relative_position_embedding = true # Only applies to Transformer language models
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
# Resolved for this stack's own depth with `decoder=True`, which counts three
# sublayers to the block -- self-attention, cross-attention, feedforward -- so
# what is passed is the block count and not a multiple of it. Pinning a number
# still passes straight through. Otherwise as [sender_feature_model].
alpha = "deepnorm"
beta = "deepnorm"

[receiver_discriminator]
# Whether the score is normalised at all. `true` is today's behaviour and is
# bit-identical to the code before the key existed. `false` removes, together:
# `BilinearDiscriminator`'s two operand layer norms, the `/sqrt(d)` calibration
# that follows them, and the whole `ScoreVolume` readout -- both
# `log_score_scale` and `score_bias`, on either discriminator. What is left on
# the bilinear arm is the bare form `r_j . W m`, which is exactly what `ce7d6a5`
# scored with and what jayelm's `CopyListener.compare` has always computed.
#
# The four go together because they are one decision rather than four. The norms
# are what make the calibration exact and what make a volume in front of the
# score mean the same thing under every backbone; a readout over unnormalised
# operands would be neither today's design nor the old one.
#
# **Why the switch exists.** `4248fca` added all of this on 19 August, its
# stated purpose to take the score's volume "out of the backbone's hands", and
# no ShapeWorld run has learned shape since. `60f9094` landed the day before and
# moved the backbone to `ResNet18SmallInput`, so the two are perfectly
# confounded -- and since the coupling `4248fca` removed is exactly the one that
# differed between Conv4 and ResNet18, they are two descriptions of one
# intervention. The backbone half is under test in
# `experiments/silhouette_titration_conv4/` against its `_resnet18` control;
# this key is the other half, and `false` is an exact return to `ce7d6a5`'s
# arithmetic on the listener.
#
# The gradient argument for the norms is also weaker than it was. `4248fca`
# reasoned about the straight-through Gumbel Jacobian, and the ladder has run
# `estimator = "identity"` since `681ef0b`; Hyperion's GPUs report
# `is_bf16_supported()`, so `model_util.scale_without_attenuating` is inert by
# its own docstring and where a volume scalar sits relative to the backward pass
# no longer changes what the optimiser sees.
#
# `[optimiser] score_scale_lr` and `score_bias_lr` stay live and simply have no
# effect when this is off; `train_score_scale`, `train_score_bias` and
# `train_clip_log_score_scale` read NaN. `AttentionDiscriminator`'s own
# `referent_layer_norm` and `memory_layer_norm` are *not* touched by this key:
# they are its decoder stack's input and memory norms, and a post-norm stack
# never normalises its own memory, which is why they exist. `mix_floor`,
# `mix_logit` and `mix_logit_init` are untouched too.
#
# Checkpoints do not cross this key, for the same reason as its counterpart:
# `log_score_scale` and `score_bias` are absent from the `state_dict` when it is
# off.
normalise_score = true

# `BilinearDiscriminator` reads nothing else from this table. It is sized
# entirely by the referent width and by the language model's `output_size`,
# which `build_models` passes in rather than restating as a key that could be
# wrong. Everything below is `AttentionDiscriminator`'s.
#
# 320 at 5 heads for the head dimension of 64 that every attention module in the
# repo has. A default should be the smallest thing that runs, not a guess at a
# good shape; rung 11 states 256 and 4 alongside its sizing argument.
d_model = 320
layers = 1
heads = 5
ff_inner_size = 576
# Off; see [sender_language_model]. Was already inert at a single block, as
# above.
stochastic_depth = 0.0
self_attention_dropout = 0.0 # The candidates reading each other.
cross_attention_dropout = 0.0 # The candidates reading the message.
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
pre_norm = false
post_norm = true
knocking_heads = false
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
alpha = "deepnorm" # As above, resolved for this stack's own depth.
beta = "deepnorm"
# The attention path's minimum share of the score:
#
#     score = s * [ (1 - a) * bilinear + a * attention ] + bias
#     a     = mix_floor + (1 - mix_floor) * sigmoid(mix_logit)
#
# Neither path is standardised before the mix, so `a` is a *weight* and not a
# share: a loud branch can dominate a heavily-weighted quiet one. Deliberate --
# standardising per branch would make `a` mean composition exactly and close off
# the escape of turning one branch down, which is the failure `mix_share`
# against `mix_alpha` exists to catch.
#
# The floor exists because at `a = 0` the whole attention stack would receive
# zero gradient and could never earn its way in. At 0.1 it always contributes and
# so always learns, but not enough to derail a listener the bilinear path is
# already carrying. It is in the *parameterisation* and must never become a
# `clamp`: `clamp`'s gradient is zero below its bound, so a weight that drifted
# under the floor would weld there permanently. That bug cost an afternoon in the
# prototype.
#
# The floor does not stop the attention path going quiet, though: with the
# branches unstandardised it can shrink its own magnitude and contribute little
# at any `a`. `mix_share` against `mix_alpha` is what reads that, and a gap
# between them is the finding.
mix_floor = 0.1
# -4.0 puts `a` at 0.116 for the floor above, so the discriminator opens
# essentially *as* the bilinear comparison and departs only if attention pays.
# That matters because the attention path alone does not bootstrap: at a nuisance
# level where the bilinear comparison reaches 0.938 it sits at 0.469 with its
# polarity tag barely moving, since at initialisation nothing in the pair yet
# looks like a pattern and uniformity is the cheapest thing a listener can do.
# This is the recipe `AttentionPrototyper` already follows -- open at pooling
# that *is* the mean, and depart if it pays.
#
# Read `train_mix_alpha` and `train_path_agreement` together. Attention that is
# never used and attention that has learned to imitate the bilinear path look
# identical from accuracy and from `mix_alpha` alone, and they are different
# findings. See docs/measurement.md.
mix_logit_init = -4.0

# ====== Defaults for the CUB birds data set below here ======

[birds.data]
dataset = "../data/cub"
ref_dataset = "../data/cub"
# Off for CUB, and `cub.py` does not thread these through in any case. The
# colour-only minimum is ShapeWorld-specific (the paper says so explicitly), and
# CUB species genuinely depend on plumage colour, so removing it would lower the
# ceiling with no shortcut to break. Thresholding a photograph would also
# destroy texture and pattern, not just colour.
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.0
batch_size = 16
n_workers = 4
n_examples = 10 # number of examples seen by agents, including distractors

# Games per training epoch. Read only by `cub.py`: ShapeWorld's epoch is the
# size of the stored game file, so there is no matching key under `[data]`.
#
# jayelm's value was 1,000, and with `batch_size` 16 and `accumulator_steps` 1
# that makes an epoch 62 optimiser steps against ShapeWorld's 156 (20,000 games
# at an effective batch of 128). The two datasets were therefore getting a
# 2.5-fold different optimisation budget per epoch while sharing a 100-epoch
# schedule that is keyed to the epoch counter.
#
# 2,500 was chosen because it satisfied two things at once: it equalised the step
# count with ShapeWorld, and it was roughly the coupon-collector point at which
# an epoch first covers the training images (100 species at ~59 images is a
# ~5,900-image pool, 20 images a game, `N ln N / 20` = 2,566).
#
# Those two came apart when the `test_same` holdout landed: it leaves 150 species
# at ~47 training images, a ~7,050-image pool, whose coupon-collector point is
# `N ln N / 20` = 3,123. 3,100 was set against coverage alone and gave up step
# parity, at 194 steps an epoch against ShapeWorld's 156.
#
# **5,000 as of 2026-08-31, and both constraints are satisfied again.** With
# `[birds.optimiser] accumulator_steps` now 2, 5,000 / (16 x 2) = 156.25 steps
# an epoch, and ShapeWorld's 20,000 / (32 x 4) = 156.25 -- the same number and
# the same remainder, so the odd trailing batch is left unstepped on both. That
# matters because the learning-rate schedule is keyed to the epoch counter and
# every `lr * steps` traverse in `[optimiser]` above is quoted per epoch: one
# steps-per-epoch figure now describes both datasets, and the arithmetic in
# those blocks is written against it.
#
# Coverage is not traded away to get there -- 5,000 clears the 3,123 point by
# 60%. What is still not equalised is gradient quality: birds sees 5,000 games
# an epoch at an effective batch of 32 against ShapeWorld's 20,000 at 128. The
# steps are matched; what goes into each of them is not.
#
# Nothing is exhausted by raising it. `CUBDataset.__getitem__` ignores its index
# and samples a fresh game, so an epoch is a draw rather than a pass, and the
# space is combinatorially large. The cost is wall-clock: an epoch is 61% longer
# than at 3,100.
games_per_epoch = 5000

# Eval games per species, for `test` and `test_same` alike: 50 x 16 = 800 games
# and 150 x 16 = 2,400. Read only by `cub.py`; ShapeWorld's eval splits are
# stored files.
#
# Per species rather than flat because the two eval splits hold different numbers
# of species, and topsim measures one prototype per concept -- the modal message
# over that concept's instances -- so it is coverage *per species* that has to
# match for the two splits to be read against each other. jayelm's flat 200 gave
# `test` four games a species and would have given `test_same` 1.3.
#
# 16 rather than jayelm's effective 4 because 200 games was too few to see
# through, `test_same` or not. Across the three recorded birds runs `test_acc`
# jittered by 1.2-1.9 points epoch-to-epoch against a signal only ~5 points above
# chance, and `test_topsim_s3` by 0.06-0.08 on a value of ~0.7. Eval is
# forward-only and epochs run ~32s, so quadrupling it is affordable where it
# would not be if eval trained.
eval_games_per_species = 16

[birds.optimiser]
# Effective batch 32 -- `[birds.data] batch_size` 16 twice over -- against
# ShapeWorld's 128. Was 1 until 2026-08-31.
#
# This is the batch-side arm of the observation that the birds arm wants either
# half the rate or twice the batch. That the two are interchangeable at all is
# the diagnosis: they only buy the same thing in a noise-dominated regime, since
# a step that were simply too large for the curvature would not be rescued by
# averaging more samples into it. The target is therefore the variance of the
# speaker's gradient rather than the size of the step, and this arm attacks it
# where halving `lr` only makes the run less sensitive to it. The rate was
# halved as well, in `[optimiser] lr`, so the birds arm now carries both.
#
# What it costs, and what pays for it. Accumulation halves the step count at a
# fixed game count, and a halved step count is a halved `lr * steps` travel
# budget. The cost falls hardest on the lone scalars -- the speaker's channel
# scale, the listener's volume and offset, the contrast gate -- and
# docs/anecdotes.md works out why: sign consistency less 0.5 grows as the root
# of the batch while the step count falls as the batch, so accumulation is a net
# loss for a lone Adam scalar even where it is a net gain for the modules above
# it. `[birds.data] games_per_epoch` moves with it for exactly that reason:
# 5,000 games at an effective batch of 32 restores the 156 steps an epoch that
# 3,100 at 16 was producing, so no travel budget is given up and the epoch stays
# a comparable clock across the two datasets.
accumulator_steps = 2

[birds.sender]
feature_model = "ResNet18"

[birds.sender_language_model]
# Neither exploration knob is overridden here, and both are doing work.
#
# No `uniform_weight` override, unlike jayelm's run_cub.sh, which passes no
# --uniform_weight and so explored CUB with the argparse default of 0.0. That
# left birds with no ceiling at all: its fidelity floated with whatever scale the
# architecture happened to produce -- 0.24 for the ViT sender, ~1.0 for a Conv4
# one -- so the two datasets differed in their channel rather than in their task.
# Inheriting w gives birds the same irreducible `w * (1 - 1/V)` corruption
# ShapeWorld gets. At the 0.1 that 119b2de made the default, that is 0.095 here
# against ShapeWorld's 0.093 -- the vocabularies differ (20 against 14) but the
# floor barely moves, which is the point of sharing the knob rather than the
# rate.
#
# Note this applies on the train pass only, so train and eval do not run through
# the same channel: eval decodes greedily, with no noise, no mixture and no
# scale. Train accuracy is therefore depressed relative to test accuracy by
# construction, and the two columns understate the real generalisation gap.
#
# No channel-scale override either. `logit_scale` opens at 1.0 and is bounded at
# `MAX_LOGIT_SCALE` on both datasets, so the two speakers start and end their
# channel at the same multiplier and the vocabulary difference shows up where it
# belongs -- in what that multiplier buys. At a scale of one the sharpest shape
# `layer_norm_logits` permits reaches 0.789 unmixed survival at ShapeWorld's
# V = 14 and 0.838 at the 20 here, so the wider vocabulary is slightly the
# louder channel at equal scale rather than being handed a different bound.
#
# Note the two datasets are still not identical at the message level, and cannot
# be: 8 content tokens here versus 5 on ShapeWorld makes a whole message here
# harder to pin down. `message_length` is the knob that governs that, not these. The opening also differs -- a fresh speaker holds
# its argmax at 0.294 here against 0.386 on ShapeWorld -- because the same cap at
# a larger vocabulary needs a smaller multiplier to reach it.
vocabulary = 20
message_length = 10 # max message length. note this includes sos/eos token, i.e. the true length is this - 2

[birds.receiver]
feature_model = "ResNet18"

[birds.receiver_language_model]
message_length = 10 # Only applies to Transformer language models. Should be the same as sender_language_model.message_length