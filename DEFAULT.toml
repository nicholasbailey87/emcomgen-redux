# Default experimental settings, required to reproduce https://github.com/jayelm/emergent-generalization

name = "DEFAULT" # experiment name - should be the same as file name
resume = true
cuda = true
compile = false
use_lang = true
copy_receiver = false
receiver_only = false
share_feat_model = false
share_language_model = false
joint_training = false
reference_game = false
reference_game_xent = false
debug = false
vis = false
receiver_reset_interval = 0.0
save_interval = 10

[analysis]
# Settings for the six topsim variants (see code/emergence.py and
# compute_language_metrics in code/train.py). One variant per signal set S1-S6;
# they differ only in the signal distance, the meaning distance being cosine
# between sender concept vectors throughout. Computed once per epoch on the
# test/test_same eval passes (not on train), plus one pre-training baseline pass
# per split that the reported `_adj` columns are measured against.
max_concepts = 500     # cap on concept prototypes entering one topsim computation.
                       # Measurement is per concept prototype, not per image, and
                       # the soft signal distances are O(n^2) in a Python loop, so
                       # this bounds the ~30-55 s/epoch measurement cost.

[data]
# 40 images per stored game rather than 80-100. `split_spk_lis` only ever reads
# 20 (10 per agent per polarity), so 40 is the smallest row that keeps the
# concept game's speaker/listener disjointness. See data/shrink_shapeworld.py.
dataset = "../data/shapeworld_40"
# ~9.8 GB train + ~1 GB test fits the 24 GB SLURM allocation, which removes
# ~32 GB of disk reads per epoch.
load_shapeworld_into_memory = true
batch_size = 32
percent_novel = 1.0
n_examples = 20 # number of examples seen by agents, including distractors
n_workers = 0

[optimiser]
class = "AdamW"
accumulator_steps = 4
lr = 1e-3
weight_decay = 0.06
clip_grad_norm = 1.0
log_interval = 100

[scheduler]
warm_up_epochs = 5
epochs = 100
lr_schedule_shape = "cosine"
cool_point_multiplier = 0.01667
range_test = false

[sender]
class = "Sender"
feature_model = "Conv4"
vision_dropout = 0.0    # On per-image embeddings, before pooling. jayelm's
                        # speaker has no dropout here, and it would stack a
                        # second regulariser on the same pathway.
prototype_dropout = 0.5 # On the pooled concept vectors, before the language
                        # model. This is where jayelm's single speaker-side
                        # `--dropout` sits (at 0.1 in their runs).
prototyper = "AveragePrototyper"
language_model = "SenderGRULM"

[sender_feature_model]
d_model = 16 # Only applies to Transformer vision models
layers = 4 # Only applies to Transformer vision models
heads = 4 # Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models

[sender_language_model]
token_embedding_size = 500
d_model = 1024
vocabulary = 14
message_length = 7 # max message length. note this includes sos/eos token, i.e. the true length is this - 2
uniform_weight = 0.1
tau = 1.0                     # Gumbel-softmax tau. Gradient shaping only:
                              # the hard forward sample is an argmax and so
                              # is invariant to it. jayelm's `--tau`.
exploration_temperature = 1.0 # Divides the log-probs before sampling.
                              # jayelm's `--softmax_temp`; unused there and
                              # here, `uniform_weight` is the live knob.
batch_norm_logits = false
dropout = 0.1
layers = 1
bidirectional = false
heads = 4 # Heads per layer - only applies to Transformer language models
utility_tokens = 4 # Only applies to Transformer language models

[receiver]
class = "Receiver"
feature_model = "Conv4"
comparer = "BilinearGRUComparer"
# No `vision_dropout` here, unlike [sender]: it would mask the same tensor as
#     the referent side of `receiver_comparer.dropout`, with nothing but a
#     reshape between them, so the two would compose into a single mask at a
#     rate neither knob names. The listener's regularisation is the one
#     `receiver_comparer.dropout` below.

[receiver_feature_model]
d_model = 16 # Only applies to Transformer vision models
layers = 4 # Only applies to Transformer vision models
heads = 4 # Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models

[receiver_comparer]
token_embedding_size = 500
d_model = 1024
dropout = 0.5 # The listener's only dropout, applied equally to both operands
              # of the comparison: the pooled message embedding and the
              # incoming referent embeddings. Counterpart to the sender's
              # `prototype_dropout`, and set to match it — the literature says
              # listeners want at least as much regularisation as speakers for
              # compositional languages to emerge, and jayelm's single
              # `--dropout` (0.1) gave both agents the same weak setting. Also
              # passed to `nn.GRU(dropout=)`, which is inert while `layers = 1`.
layers = 1
bidirectional = false
message_length = 7 # Only applies to Transformer comparers. Should be the same as sender_language_model.message_length
heads = 4 # Only applies to Transformer comparers
utility_tokens = 0 # Only applies to Transformer comparers

# ====== Defaults for the CUB birds data set below here ======

[birds.data]
dataset = "../data/cub"
ref_dataset = "../data/cub"
batch_size = 16
n_workers = 4
n_examples = 10 # number of examples seen by agents, including distractors

[birds.optimiser]
accumulator_steps = 1

[birds.sender]
feature_model = "ResNet18"

[birds.sender_language_model]
# jayelm's run_cub.sh passes no --uniform_weight, so the CUB runs explored
# with the argparse default of 0.0 rather than ShapeWorld's 0.1.
uniform_weight = 0.0
vocabulary = 20
message_length = 10 # max message length. note this includes sos/eos token, i.e. the true length is this - 2

[birds.receiver]
feature_model = "ResNet18"

[birds.receiver_comparer]
message_length = 10 # Only applies to Transformer comparers. Should be the same as sender_language_model.message_length