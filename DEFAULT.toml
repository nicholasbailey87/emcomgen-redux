# Default experimental settings, required to reproduce https://github.com/jayelm/emergent-generalization

name = "DEFAULT" # experiment name - should be the same as file name
resume = true
cuda = true
# `torch.compile` on the agent pair, applied in `train.py` after the checkpoint
# restore so a resume still key-matches. On because the ablation rungs were
# leaving throughput on the floor: a ShapeWorld ViT epoch is ~18.2 PFLOPs
# (20,000 games x 20 examples x 2 agents, 22.7 GFLOPs each fwd+bwd) and was
# taking 22 minutes, i.e. ~14 TFLOP/s, against the ~35 TFLOP/s per GPU the
# ImageNet ViT in `vit-representation-learning` sustains on the same hardware --
# where `torch.compile` is on. A CPU profile of `ViT2` puts `aten::mul` at 22%
# of self time over 1,373 calls, which is the elementwise traffic compile exists
# to fuse.
#
# Expect graph breaks rather than one graph: the autoregressive decode loop in
# `SenderTransformerLM`/`SenderGRULM`, the Gumbel sampling, and the per-batch
# `.cpu()` calls in the training loop all force them. The win is real but is
# unlikely to be the full 2.5x.
#
# One consequence, and the reason this is set here rather than per rung. A
# compiled module prefixes every `state_dict` key with `_orig_mod.`, so the
# `final_model.pt` a compiled rung writes does not key-match one from an
# uncompiled rung. `probe_shape.py` fails loudly on the mismatch rather than
# silently loading nothing, but the files are still incompatible: flipping this
# means re-running a whole comparison, not half of one.
compile = true
use_lang = true
copy_receiver = false
receiver_only = false
share_feat_model = false
share_language_model = false
joint_training = false
reference_game = false
reference_game_xent = false
debug = false
vis = false
receiver_reset_interval = 0.0

[analysis]
# Settings for the topsim report (see code/emergence.py and
# compute_language_metrics in code/train.py). One variant per signal set S1-S6,
# differing only in the signal distance; each is read against two meaning
# distances -- cosine between sender concept vectors (`topsim_*`) and word-level
# edit distance between the ground-truth logical forms (`topsim_gt_*`). Computed
# once per epoch on the test/test_same eval passes, not on train.
#
# The three soft variants (S1-S3) are additionally reported as `_static`, which
# recomputes them on per-token mean embeddings. Only the soft variants read the
# sender's symbol embeddings, and only they can therefore report a correlation
# that came from the meaning space rather than from the language; `_static`
# leaves their synonymy tolerance intact and removes that channel. It replaces an
# adjustment against a pre-training baseline pass, which read ~0 for every
# variant and so bounded nothing: the leakage it existed to catch is created by
# training. See `emergence.topsim_report`.
max_concepts = 500     # cap on concept prototypes entering one topsim computation.
                       # Measurement is per concept prototype, not per image, and
                       # the soft signal distances are O(n^2) in a Python loop, so
                       # this bounds the measurement cost. The `_static` control
                       # roughly doubles it; dropping the pre-training baseline
                       # pass gives most of that back.

[data]
# 40 images per stored game rather than 80-100. `split_spk_lis` only ever reads
# 20 (10 per agent per polarity), so 40 is the smallest row that keeps the
# concept game's speaker/listener disjointness. See data/shrink_shapeworld.py.
dataset = "../data/shapeworld_40"
# ~9.8 GB train + ~1 GB test fits the 24 GB SLURM allocation, which removes
# ~32 GB of disk reads per epoch.
load_shapeworld_into_memory = true
batch_size = 32
percent_novel = 1.0
n_examples = 20 # number of examples seen by agents, including distractors
n_workers = 0

# Probability of rendering an agent's whole view as white-on-black silhouettes,
# per game, at training time only. This attacks the colour-only local minimum
# the paper reports (~83% accuracy, appendix A.1): with the six colours sitting
# at six distinct luma values, only thresholding actually removes colour.
#
# The receiver is the side to constrain. Silhouetting the *sender* teaches it
# shape-from-silhouette, which is not the shape-from-colour-image competence
# that eval requires and `probe_shape.py` measures, and it shifts the sender's
# input distribution out from under that probe. Silhouetting the receiver
# leaves the sender's inputs alone but makes colour messages unrewardable, so
# the shape gradient still reaches the sender's vision model through the
# channel. It also denies the receiver the option of clustering its own set by
# colour and treating the message as a coarse pointer.
#
# Cost: a colour concept needs both agents to see colour, so it is answerable
# only (1 - p) of the time. Setting both rates to p makes that (1 - p)^2 --
# strictly worse ceiling for the same shape pressure.
#
# The rate: 0.5 was never titrated -- it arrived in 536c59e and stayed -- and by
# the time the last ShapeWorld run reached epoch 37 it had colour at 0.788 and
# shape at exactly chance, which is the paper's failure mode rather than the one
# silhouetting was added to prevent. 0.1 keeps some pressure against colour
# while costing far less of the colour concepts, which are 62% of eval games.
#
# Birds overrides both rates to 0.0 in `[birds.data]`: CUB species genuinely
# depend on plumage colour, and `cub.py` does not thread these through anyway.
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.1

[optimiser]
class = "AdamW"
accumulator_steps = 4
lr = 1e-4
# 0.0 for both datasets -- `[birds.optimiser]` does not override it. jayelm uses
# plain Adam with no decay, and bs6, the only run so far to reach the paper's
# ShapeWorld numbers, set this to 0.0 explicitly. At 0.0 AdamW and Adam are the
# same optimiser, so `class` above needs no accompanying override. The 0.01 it
# replaces was never justified against a run that fitted its training set.
weight_decay = 0.0
clip_grad_norm = 1.0
log_interval = 100

# Learning rate for the speaker's `log_logit_scale` alone. Set to `lr` to
# disable the override.
#
# This exists because that one scalar is the run's bottleneck, and it is
# bottlenecked on *steps* rather than on gradient. AdamW normalises by the
# gradient's own second moment, so a parameter with a consistently signed
# gradient moves at about `lr` per step whatever that gradient's size; a lone
# scalar therefore cannot travel further than `lr * steps` over a run, no matter
# how badly the loss wants it to.
#
# The distance it has to travel is fixed by the other two knobs.
# `layer_norm_logits` pins the emittable logits to unit variance, so the scale
# *is* the channel's fidelity, and `init_energy` opens it at 0.839 for birds --
# deliberately near-random, so the listener has no premature structure to
# co-adapt to. A usable channel is somewhere around 4 to 6, which is
# `ln(6/0.839)` = 1.9 log-units away.
#
# Birds could not cover that. At 62 steps an epoch and `lr` 1e-4 the ceiling
# over 100 epochs was 0.62 log-units, reaching a scale of 1.56 at best -- and
# the ablation measured 0.33 symbol survival at a comparable sd, which is dead
# at ln 2. `games_per_epoch` 3,100 lifts that ceiling to 1.94 on its own.
#
# 2e-3 clears it with room to spare, and is set above what the arithmetic asks
# for. At `games_per_epoch` 2,500 -- 156 steps an epoch -- the scale could travel
# 0.31 log-units per epoch, covering 1.9 in about six epochs at full
# sign-consistency and twelve at half. That was borne out: the predicted takeoff
# of 6.1 epochs was observed at 6.
#
# `games_per_epoch` is now 3,100, so the arithmetic moves with it: 194 steps an
# epoch, 0.39 log-units per epoch, and a traverse of 1.9 covered in 4.9 epochs at
# full sign-consistency and 9.8 at half -- against a whole-run ceiling of 39,
# roughly twenty times the distance. Treat 4.9 as a fresh prediction rather than
# a restatement; the next birds run tests it the same way. The intent either way
# is to stop the traverse being the binding constraint at all, so that what the
# run measures is the language rather than the channel opening.
#
# Overshoot is cheap, and that is why this can be set high. `uniform_weight`
# caps the effective logit gap at `log(((1-w)+w/V)/(w/V))` = 4.84, so fidelity
# saturates and the scale's own gradient vanishes with it: the parameter parks
# rather than running away, and a larger value buys earlier arrival rather than
# a sharper endpoint.
#
# What it does cost is the bootstrapping window. `init_energy` 0.9 is there to
# keep the speaker near-random while its embeddings become worth grounding, and
# a takeoff around epoch five spends that window in the first twentieth of a run --
# a reliable channel over a speaker whose argmax is still close to
# input-independent is exactly the co-adaptation `logit_scale`'s docstring warns
# about. The `uniform_weight` floor is the brake: 10% of tokens are resampled
# uniformly however sharp the speaker gets, so a code formed early still has to
# survive that corruption. Whether the brake is enough at this rate is the thing
# the run tests. The tell is `realised_survival` against shape accuracy -- a
# channel that opens while accuracy stays at chance is the failure, not a slow
# channel.
#
# Two other things move with it. The tau coupling in `sampling_tau` tracks
# `logit_scale / initial_logit_scale`, so a fast climb makes the surrogate very
# soft very early, and straight-through bias is at its worst exactly while the
# pair is choosing its code. And `training_progress` retires that coupling on
# the epoch counter, calibrated in 3b3b857 against takeoff at epoch 11 for
# ShapeWorld and 40 for birds; at this rate both take off fully coupled and the
# honest-tau phase arrives long after the code has settled.
#
# If `realised_survival` climbs promptly and accuracy still does not follow,
# the traverse was never the constraint and this knob should go rather than
# grow.
#
# Only the scale gets this. `outputs2vocab.bias` is the other shape parameter
# and must *not* be raised with it: it is a vector, it has no distance to cover,
# and it competes with `Wh` for control of the message. LayerNorm bounds the
# magnitude of `Wh + b` but not the ratio between them, so a bias that outruns
# the matrix leaves an input-independent message -- the single-message collapse.
logit_scale_lr = 2e-3

# The same elevated rate, for `SenderTransformerLM.polarity_embedding` -- the
# learned tag that tells that speaker which of its two prototypes is the
# positive concept. Deliberately a second key rather than a reuse of the one
# above, even though they open at the same number: `log_logit_scale` exists on
# both speakers, so turning that knob up to hurry the tag along would also
# retune the GRU baseline's channel and move the comparison the ablation is
# there to make. These two want to be separable, and one of them is
# Transformer-only.
#
# It is here for the same reason as the rate above. The tag is zero-initialised,
# so like the logit scale it has a distance to cover before it does anything at
# all, and until it has covered it the speaker cannot distinguish "the concept
# is X" from "the concept is not-X" except through whatever content cue survives
# `referent_layer_norm`. At initialisation nothing does: an untrained backbone
# makes both prototypes the mean of noise. So the traverse sits in exactly the
# bootstrapping window where the GRU speaker gets the same information for free,
# and the arms are least comparable while it lasts.
#
# Unlike the logit scale there is no arithmetic here yet, because there is no
# target to compute one against. The scale's ceiling is known -- `init_energy`
# fixes where it starts and `uniform_weight` caps where it usefully ends -- but
# how large a tag the cross-attention needs is set by whatever scale
# `referent_layer_norm` hands it, which is a property of the trained backbone.
# `polarity_separation` in metrics.csv is the readout: if it is still near zero
# late in a run, either the speaker found the content cue sufficient or this
# rate is too low, and the two are told apart by whether the Transformer arm's
# accuracy tracks the GRU's over the first few epochs.
#
# Applies only to `SenderTransformerLM`; `build_models` skips it for a GRU
# speaker, which is told its polarities apart by `init_h`.
polarity_embedding_lr = 2e-3

# The listener's counterpart, for `BilinearGRUComparer.log_score_scale` -- the
# one scalar that sets how loudly it states a conclusion. Both comparer operands
# are layer-normalised without an affine and the dot product is divided by
# `sqrt(referent_embedding_size)`, so nothing else can reach the score's
# magnitude: `bilinear` sets the *direction* of the comparison and this sets its
# volume.
#
# A third key rather than a reuse, on the same argument as the one above. This
# one exists on every rung, `logit_scale_lr` moves a speaker and this moves a
# listener, and an ablation that varies one agent wants to be able to hold the
# other's rate still.
#
# 2e-3 is not inherited by analogy, despite matching. Unlike the speaker's scale
# this one opens *at* its target -- 1.0 is the calibrated value by construction
# -- so it has no traverse to cover and the arithmetic that set 2e-3 there does
# not apply. What sets it here is the dip. `29b18ea` measured a healthy speaker
# falling ~0.2 log-units below its opening and returning within a few epochs,
# which is the pair correctly refusing to commit while the message is still
# noise; at the base 1e-4 and 194 steps an epoch that is 0.019 log-units an
# epoch, so a 0.2 dip would take ten epochs and the listener would be
# recalibrating an order of magnitude slower than the speaker it is aimed at.
# At 2e-3 the ceiling is 0.388 an epoch and the speaker's observed dip used
# about 11% of the same budget, so the headroom goes unspent when the gradient
# is not sign-consistent.
#
# Read `train_score_scale` against `29b18ea`'s separation, which is the whole
# reason the column exists: a healthy arm dips to ~0.8x and comes back, and the
# arm that died fell 0.94 log-units and never did. There is deliberately no
# floor -- that was tried in `e3fcabd` and cost fifteen epochs before `29b18ea`
# removed it.
#
# Applies only to `BilinearGRUComparer`, and `build_models` gates on that class
# rather than on finding the parameter. `TransformerCrossAttentionComparer` no
# longer has a learnable scale at all: it standardises its readout and
# multiplies by a fixed `decision_gain`, because on rungs 11 and 12 the scale
# this key exists to move went monotonically to 0.27 and pinned `train_loss` at
# ln 2 for thirty epochs. `train_score_scale` is therefore a bilinear-only
# column now, and `decision_spread` and `decision_kurtosis` are what the other
# arm reports instead -- see `decision_gain` under `[receiver_comparer]` for the
# argument, and read the kurtosis column first.
#
# Which leaves the baseline comparer holding the mechanism that failed on the
# other one. That is a scoping decision and not a verdict: `BilinearGRUComparer`
# is the ablation's baseline listener, its score is a scaled cosine with the
# same first-order exposure to "become less confident", and changing its readout
# would invalidate every rung rather than the two under investigation. Worth
# revisiting once the fixed-gain readout has been seen to work.
score_scale_lr = 2e-3

[scheduler]
epochs = 100
warm_up_epochs = 0
lr_schedule_shape = "ascent"
cool_point_multiplier = 1.0
range_test = false

[sender]
class = "Sender"
feature_model = "ResNet18SmallInput"
vision_dropout = 0.0    # On per-image embeddings, before pooling. jayelm's
                        # speaker has no dropout here, and it would stack a
                        # second regulariser on the same pathway.
prototype_dropout = 0.1 # On the pooled concept vectors, before the language
                        # model. This is where jayelm's single speaker-side
                        # `--dropout` sits (at 0.1 in their runs).
prototyper = "AveragePrototyper"
language_model = "SenderGRULM"

[sender_feature_model]
# The one ViT specification, used by every rung that swaps a CNN for a
# Transformer on either agent. Sized against ResNet18's 11,176,512 parameters:
# 320 wide, 10 layers, feedforward inner 576 comes to 10,317,986, or 92%. It was
# 384/9/384 for birds and 128/4/128 for ShapeWorld, which matched each dataset's
# own baseline backbone -- but `SenderTransformerLM` pins its width to the vision
# model's, so the ShapeWorld language model inherited 128 and came out 12.8x
# smaller than the GRU it is meant to be compared against. One width for both
# datasets is what makes that comparison mean anything.
#
# `heads` is 5 for a head dimension of 64. Every attention module in the repo now
# has that same head dimension -- see `[receiver_comparer]`, which reaches it at
# 256 wide with 4 heads. The previous rule was head_dim 32, chosen as broccoli's
# 2D axial-RoPE floor; 64 clears that floor with room, so the constraint no
# longer decides the number.
d_model = 320 # Only applies to Transformer vision models
layers = 10 # Only applies to Transformer vision models
heads = 5 # head_dim 64. Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models
# Architecture settings that used to be hardcoded in the model classes, and so
# were neither recorded in a run's `args.json` nor sweepable. Every value here
# is the one that was previously hardcoded, so promoting them changed nothing.
#
# Not everything broccoli accepts is exposed. Arguments that select a *class*
# (`linear_module`, `head`, `logit_projection_layer`) stay in Python, since TOML
# cannot hold one; `activation` is the exception, via the name -> class map in
# `models/model_util.py`. Arguments determined by the data or by the surrounding
# code -- `source_size`, `input_size`, `in_channels`, the pooling kernel
# geometry -- are derived rather than configured. The `cnn_*` group is inert
# while `cnn` is False and stays in Python too.

# 576 rather than the 554 the ResNet18 parameter budget solves for exactly, and
# the two extra points of budget above buy alignment. SwiGLU makes this number
# the shape of two matmuls -- `Linear(320 -> 2*ff_inner_size)` and
# `Linear(ff_inner_size -> 320)` -- which between them are about 47% of the
# ViT's FLOPs. bf16 is two bytes and the tensor-core kernels want 16-byte
# aligned rows, so cuBLAS's fast path wants those dimensions to be multiples of
# 8, and NVIDIA asks for 64 or 128 for good tile efficiency. 554 and its double
# 1108 are neither; 576 is a multiple of 64 and 1152 a multiple of 128.
#
# 576 over the other aligned candidates because it stays closest to the budget.
# 512 aligns no better in practice and drops the backbone to 86% of ResNet18,
# four points *below* the target where 576 is two above; 552 is a multiple of 8
# but not 64.
#
# Worth 1.2-2x on the affected matmuls at best, not the whole gap to the ~35
# TFLOP/s per GPU the ImageNet ViT in `vit-representation-learning` sustains --
# note that run reaches 896 (128 x 7) by setting `transformer_ff_ratio`, which
# makes broccoli discard `ff_inner_size` entirely. See `compile` at the top of
# this file for the other half, and `scripts/vit_throughput.py` to measure both.
ff_inner_size = 576 # Only applies to Transformer vision models
stochastic_depth = 0.1 # Only applies to Transformer vision models
depthwise_linear_stochastic_depth = true # ramp the rate linearly over depth
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
# Rotary, and rotary only. There is no `absolute_position_embedding` key any
# more: it is pinned False at every construction site in the repo.
#
# The two are not complementary. RoPE encodes position where it is used, as a
# rotation of the query and key subspace, and rotating a subspace is sufficient
# for relative position -- the unrotated dimensions are not a gap for an
# absolute table to fill. What an absolute embedding adds is a second,
# differently-shaped answer to the same question, learned from scratch, added
# once to the residual stream at the input, and relearned per sequence length.
# broccoli's own `ViT` defaults to exactly this pair for the same reason.
#
# Dropping it took ~190k parameters off every Transformer rung, most of it two
# 289-position tables in the ViT2 backbones, and made the listener's comparer
# identical in size on ShapeWorld and CUB -- the whole difference between them
# had been the absolute table sized to `message_length`.
relative_position_embedding = true
# `pre_norm` and `post_norm` are coupled and must be flipped together: broccoli
# rejects a transformer that is both, so setting `pre_norm = true` without also
# setting `post_norm = false` raises at construction rather than picking one.
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
pooling_type = "concat" # max, average or concat
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
self_attention_dropout = 0.0
# DeepNorm's residual scaling, `alpha` on the skip and `beta` on the branch.
# "deepnorm" resolves both from the stack's own `layers` at construction --
# `(2N)^(1/4)` and `(8N)^(-1/4)` -- so a config that changes its depth cannot
# leave them behind at constants derived for a different one. A number pins
# either of them instead; 1.0 is the no-scaling identity.
#
# Post-norm at `alpha = beta = 1.0` is vanilla post-LN, which is the
# configuration these stacks are least likely to train in: the depths here are
# 4 to 10, so the constants are not close to 1 (1.68/0.42 at four layers,
# 2.06/0.34 at nine). broccoli applies `beta` as a forward multiplier on the
# branch rather than as an initialisation scaling on its projections, and the
# post-norm `RMSNorm` after it carries a learnable gain, so a branch that earns
# it can learn its way back out of the opening ratio. These set where a stack
# starts, not a ceiling it is held to.
alpha = "deepnorm"
beta = "deepnorm"

[sender_language_model]
token_embedding_size = 500
d_model = 1024
vocabulary = 14
message_length = 7 # max message length. note this includes sos/eos token, i.e. the true length is this - 2
# There are exactly two exploration controls, and they do different jobs.
#
# `uniform_weight` (w) is the *ceiling* on fidelity, and so the floor under
# exploration. Mixing caps a slot's winner at `1 - w + w/V` however sharp the
# logits are, so at least `w * (1 - 1/V)` of symbols are flipped no matter what
# -- 0.093 at w = 0.1, V = 14. That is a permanent per-symbol corruption rate
# training cannot reduce, which is the point: it keeps late training from
# committing the channel entirely. This is jayelm's `--uniform_weight`, and its
# role here is the one it has there.
#
# V is `vocabulary` above, the emittable tokens only: the four reserved slots
# (PAD/SOS/EOS/UNK) are masked to -inf before the mixture, which is spread over
# the finite entries, so these divide by 14 rather than by 18.
uniform_weight = 0.1
#
# `init_energy` is the *starting point*, and the range the speaker can move
# through. It is the fraction of the maximum possible entropy that a freshly
# initialised speaker's per-position distribution retains: 1.0 is a speaker that
# has committed to nothing and emits uniformly at random, 0.0 one that emits a
# single token with certainty. A fraction, not a percentage.
#
# It is not the scale itself. The emittable logits are normalised to unit
# variance, and `logit_scale` in `models/sender.py` solves once at construction
# for the multiplier that delivers this entropy at this `vocabulary` and this
# `uniform_weight`. At 0.9 that is a scale of 0.802 here and 0.839 for birds,
# and an argmax the speaker holds with probability 0.22 and 0.18 respectively.
#
# Why entropy rather than a symbol error rate or a channel capacity: at
# initialisation there is no correct symbol to have an error rate against --
# argmax is an accident of the initialisation, not an intended message -- and
# capacity runs backwards, since a high-capacity channel is a *sharp* one with
# less room to explore. Entropy needs no reference symbol and runs the way
# intuition does. `logit_scale`'s docstring carries the full argument.
#
# The reason to start high is bootstrapping. A fresh speaker's argmax barely
# varies with its input, so a low-entropy start means it emits near enough one
# message for everything, confidently, from the first batch -- and the listener
# co-adapts to that degenerate language before the speaker's embeddings are
# worth grounding anything on. Near-random messages carry no premature structure
# to co-adapt to.
#
# 0.9 is a design decision, not a derived bound, and it is set from one measured
# run: a birds run started at 0.62 retained, flattened *itself* to ~0.94 over 35
# epochs, and left chance accuracy on the way back up at ~0.82-0.85. That
# descent is a cost, so start near where it chose to go. Revisit it when there
# are more runs. `logit_scale` records the reference points to rederive from.
#
# `realised_survival` and `logit_spread` report each epoch where a run actually
# went. Note survival is a *mean* over slots and confidence is skewed, so it
# hides a wide spread: exploration concentrates on the slots the speaker is
# unsure about, which is the behaviour wanted.
init_energy = 0.9
tau = 1.0                     # Gumbel-softmax tau. Gradient shaping only:
                              # the hard forward sample is an argmax and so
                              # is invariant to it. jayelm's `--tau`. With a
                              # constant scale the ratio between the two is
                              # fixed, so the straight-through estimator sits at
                              # one operating point for the whole run.
dropout = 0.1
layers = 1

# One key, two speakers, and on the Transformer it selects an architecture
# rather than a mask. In both cases `false` is the causal, left-to-right
# speaker:
#
#   false  SenderGRULM          unidirectional `nn.GRU` -- the baseline
#          SenderTransformerLM  autoregressive Transformer decoder: `layers`
#                               blocks at message length, each cross-attending
#                               into the latent array, one symbol sampled at a
#                               time conditioned on the symbols before it
#
#   true   SenderGRULM          `nn.GRU(bidirectional=True)`
#          SenderTransformerLM  Perceiver IO: `layers` blocks of self-attention
#                               over the *latent* array, and a learned query
#                               that reads it back out as every symbol at once
#
# `false` here, so the decoder is what a speaker is unless a config says
# otherwise. The ablation rungs that run the parallel arm say so explicitly --
# 13 and 14, and see rung 7 for the argument about which arm belongs where.
#
# What this no longer does on `SenderTransformerLM` is set `causal` on the
# latent self-attention stack, which is what it used to mean and which bought
# nothing. The latent array is not a sequence in time: it is read back out in
# one shot, so latent index 0 is no earlier than latent index 9 in any sense the
# task can see, and masking it left to right only hid most of the image from the
# low-index latents. No Transformer in this repository now runs a causal mask
# except the decoder arm's self-attention, over the message, where it means what
# it says.
#
# Note the two arms are not the same size at the same `layers` -- a decoder
# block carries a cross-attention an encoder block does not -- so a config that
# flips this and nothing else changes the parameter count by about 43%. See
# `layers` in rungs 7 and 13.
bidirectional = false
heads = 4 # Heads per layer - only applies to Transformer language models

# How much longer the speaker's *latent* array is than the message it produces.
# Only applies to `SenderTransformerLM`, which is the only speaker with a latent
# array at all; `SenderGRULM` receives this key through the same splat and
# ignores it.
#
# A learned query array cross-attends into the two prototypes, and this knob sets
# how many positions that query array has. What happens to the result depends on
# `bidirectional` above: the parallel arm processes it with a self-attention
# stack and then reads it back out at the message's length, while the decoder arm
# treats it as a fixed memory that every block cross-attends into. Either way
# nothing downstream can see this number -- `message_length` and the receiver are
# untouched by it.
#
# It is here because the channel from the referents into the message is narrower
# than it looks. broccoli's `MHAttention` has no residual and the speaker's byte
# array is two prototypes, so each query position's whole dependence on the
# referents is one softmax weight per head: the referents reach the language
# model through `heads * latent_length` scalars and nothing else. Under the
# previous ShapeWorld configuration that was 4 heads x 5 positions = 20 numbers.
# At 2.0 and the new 5 heads it is 50 for ShapeWorld and 80 for birds.
#
# Rounded, not floored. 2.0 is exact at both message lengths (5 content symbols
# -> 10 latents, 8 -> 16), so the rounding only matters if this is swept.
#
# On the parallel arm, 1.0 does not restore the pre-latent-phase architecture:
# the readout cross-attention is built either way, so that a sweep over this knob
# varies one thing rather than two, and so that `state_dict` shapes stay
# comparable across sweep points. At 1.0 it is a learned re-read of an array of
# its own length -- redundant, but honestly so. The cost of it is 4*d_model^2,
# about 419k parameters at 320 wide. The decoder arm has no readout to build, so
# this does not arise there.
latent_message_multiplier = 2.0
# Learned prefix tokens on the stack that reads the latent array -- the
# self-attention stack on the parallel arm, the message sequence on the decoder
# arm, where they sit ahead of the SOS position and every symbol attends back to
# them through the causal mask.
utility_tokens = 4 # Only applies to Transformer language models
# See [sender_feature_model] for what these are and why they are here. Note the
# vocabulary logits are always layer-normalised before sampling and there is no
# knob for it: `init_energy` above is resolved against unit
# variance, so the two are a pair.
ff_inner_size = 576 # Only applies to Transformer language models
# 0.1, matching every other stack. It was 0.2 here alone, from when the speaker's
# language model was the deepest thing in the run relative to what it had to say;
# at 5 layers over a latent array of 10 or 16 it is now the shallowest of the
# three transformer stacks, and there is no argument left for regularising it
# twice as hard as the ViT in front of it.
stochastic_depth = 0.1 # Only applies to Transformer language models
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
relative_position_embedding = true
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
# See [receiver_comparer] for what these two are.
#
# `cross_attention_dropout` covers every cross-attention in the speaker, on both
# arms: the one that reads the prototypes into the latent array, the parallel
# arm's readout back down to message length, and the decoder arm's per-block
# reads of the latent memory -- `layers` of them rather than one, so this knob
# reaches considerably further on that arm than on the other.
# `self_attention_dropout` covers the stack, which is the self-attention over the
# latent array on the parallel arm and over the emerging message on the decoder
# arm.
self_attention_dropout = 0.0
cross_attention_dropout = 0.0
alpha = "deepnorm" # see [sender_feature_model]
beta = "deepnorm"

[receiver]
class = "Receiver"
feature_model = "ResNet18SmallInput"
comparer = "BilinearGRUComparer"
# No `vision_dropout` here, unlike [sender]: it would mask the same tensor as
#     the referent side of `receiver_comparer.dropout`, with nothing but a
#     reshape between them, so the two would compose into a single mask at a
#     rate neither knob names. The listener's regularisation is the one
#     `receiver_comparer.dropout` below.

[receiver_feature_model]
d_model = 320 # Only applies to Transformer vision models
layers = 10 # Only applies to Transformer vision models
heads = 5 # head_dim 64. Only applies to Transformer vision models
utility_tokens = 0 # Only applies to Transformer vision models
# See [sender_feature_model] for what these are and why they are here.
ff_inner_size = 576 # Only applies to Transformer vision models
stochastic_depth = 0.1 # Only applies to Transformer vision models
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
relative_position_embedding = true
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
pooling_type = "concat" # max, average or concat
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
self_attention_dropout = 0.0
alpha = "deepnorm" # see [sender_feature_model]
beta = "deepnorm"

[receiver_comparer]
token_embedding_size = 500
d_model = 1024
dropout = 0.1 # The listener's only dropout, and in both comparers it masks
              # one operand of the comparison: the incoming referent
              # embeddings, after their norm and immediately before they are
              # compared. Counterpart to the sender's `prototype_dropout`, and
              # set to match it — the literature says listeners want at least
              # as much regularisation as speakers for compositional languages
              # to emerge, and jayelm's single `--dropout` (0.1) gave both
              # agents the same weak setting. Also passed to `nn.GRU(dropout=)`,
              # which is inert while `layers = 1`.
              #
              # It used to mask the message operand too. The message arrives
              # through the Gumbel channel, whose noise `sampling_tau` and
              # `uniform_weight` already calibrate, so a mask on top is a
              # second and uncalibrated perturbation of a signal that has one.
              # The referents arrive clean, which is what makes that the side
              # where a mask regularises rather than compounds.
layers = 1
bidirectional = false
message_length = 7 # Only applies to Transformer comparers. Should be the same as sender_language_model.message_length

# The volume `TransformerCrossAttentionComparer` states its conclusion at, and
# the whole of it: that comparer standardises its readout with a BatchNorm and
# then multiplies by this number, which never moves. Read by that class only —
# `BilinearGRUComparer` keeps the learnable `log_score_scale` this replaces, and
# ignores this key.
#
# Why fixed rather than learned. BCE will always reduce a loss it cannot
# otherwise reduce by becoming less confident, and that pressure is first-order
# where learning a useful direction is not, so a learnable volume collapses
# first and starves everything upstream of it. Twice, now: once through
# `decision.weight`'s magnitude (scores sd 0.42 -> 0.016 inside one epoch) and
# once through `log_score_scale` (rungs 11 and 12, monotone to 0.27 over 30
# epochs, `train_loss` pinned at ln 2 throughout). This is the speaker's
# conclusion applied to the listener: set the gain, don't learn it.
#
# Why a BatchNorm and not simply a frozen scalar. Freezing closes the scalar and
# leaves the shape: the listener can still go quiet by shrinking the *spread* of
# its readout — rotating towards where the candidates do not differ — which
# reaches the same ln 2 by a slower route and without a column to show for it.
# Standardising renormalises that straight back out, and sends a genuinely
# constant readout to exactly 0, which sigmoids to 0.5. There is no longer a
# resting place at chance.
#
# Why 2.0. This sets how confident an untrained listener is forced to be, and
# therefore how much a confident error costs. Untrained BCE against balanced
# labels, measured over 2e6 samples:
#
#   gain   1.0    2.0    3.0    6.0     (ln 2 = 0.693)
#   nats   0.805  1.067  1.394  2.496
#
# and a build of the rung 12 comparer opens at 1.061, matching the 2.0 row. All
# of them are above ln 2, which is the point: there is no setting at which
# chance is free, so the run starts worse than chance and has to earn its way
# down.
#
# 2.0 rather than 6.0 because the cost is not symmetric. 6.0 opens at 2.5 nats
# and puts `sigmoid` on its saturated tails almost everywhere, where
# `dL/dz = sigmoid(z) - y` is +/-1 whatever `z` is, so the loss stops
# distinguishing "slightly wrong" from "badly wrong" and degenerates towards a
# sign signal. Gradients stay bounded either way — this costs calibration, not
# stability — but a stronger forcing function is not what is scarce here. Raise
# it if a run sits at 1.07 without moving; that would be evidence the listener
# is comfortable rather than stuck.
#
# What to watch, and it is not accuracy. Removing the resting place forces the
# listener to be confident about something; it does not make the message the
# route. In a concept game the positives are images of one species, and
# `referent_self_attention` is the machinery for clustering the set without
# reading anything — permutation-equivariance means that yields the partition
# but not which half is positive, so the pair need smuggle only one bit through
# the channel to convert it into high accuracy. That would read as success.
# `test_topsim_*` and `unique_message_fraction` are what separate a protocol
# from a one-bit shortcut; `decision_spread` in metrics.csv reports the readout's
# own health.
#
# What standardising does not close, and it has since been observed. Pinning the
# variance leaves the *shape* free, and the shape is a way out. BCE against a
# coin-flip label costs `|s|/2 + ln(1 + exp(-|s|))`: quadratic in `s` near zero,
# but only linear far out, while variance costs `s**2`. So an outlier is cheap
# per unit of variance it absorbs, and the cheapest uninformative allocation at a
# fixed spread is a few enormous scores with everything else at zero, where
# sigmoid is 0.5 and the cost is ln 2. At gain 2.0, measured over 2e6 samples
# with no information present anywhere:
#
#   shape    Gaussian  4% at ±10  1.8% at ±15  1% at ±20  → ∞
#   nats     1.068     0.865      0.814        0.786      0.693
#
# `receiver-cross-attention-birds.csv` runs 0.875 → 0.810 across thirty epochs
# and its ShapeWorld counterpart 0.828 → 0.765, both on that curve, both holding
# `train_acc` at 0.5000 to four places throughout, both leaving the speaker inert
# (`pool_effective_examples` never departs 4.99, or 10.0 on ShapeWorld). A
# falling loss is therefore not evidence of anything on its own here.
#
# Hence `decision_kurtosis`, which is the column to read first. Excess kurtosis
# of the readout, and the sign is the reading: negative means bimodal scores,
# which is what discriminating looks like, with -2 the two-point floor; sustained
# positive alongside `train_acc` at 0.5 is the failure above. Measured against
# this comparer on a synthetic game, an informative message gave -2.0 at 100%
# accuracy and a scrambled one +11..+23 at chance, while `decision_spread`
# overlapped between the two (1.4-2.1 against 2.7-5.1) and could not tell them
# apart.
#
# The fix, when there is a reading to justify it, is to change what the loss
# buys rather than to raise the gain: normalise by `E|s|` rather than by the
# standard deviation. BCE's far field is linear and so is an L1 budget, which
# removes the mismatch that makes outliers cheap — at equal budget it reverses
# the arbitrage, so spreading beats concentrating (0.98 against 1.44 nats).
decision_gain = 2.0
# 5, for head_dim 64 at the 320 width the Transformer comparer takes in rung 11
# -- the same head dimension every attention module in the repo now has.
#
# Note this does not divide the `d_model = 1024` above, and that is not the
# contradiction it looks like: the two describe different modules. 1024 is
# `BilinearGRUComparer`'s hidden size, and that class builds an `nn.GRU`, which
# has no heads and no broccoli in it. `heads` is read only by
# `TransformerCrossAttentionComparer`, which sets its own width. No configuration
# reaches broccoli's `d_model % n_heads == 0` assertion with this pair.
#
# What can is code that builds the Transformer comparer straight from the
# defaults, so anything doing that must override `d_model` -- see
# `tests/test_backbones.py`.
heads = 5 # Only applies to Transformer comparers
utility_tokens = 0 # Only applies to Transformer comparers
ff_inner_size = 576 # Only applies to Transformer comparers
stochastic_depth = 0.1 # Only applies to Transformer comparers, and only to
                       # the message encoder: the three attention stages around
                       # it are bare `MHAttention`, with no branch to drop.
                       # Suppressed entirely at `layers = 1`, where a linear
                       # depth ramp would give a single rate of 0.0 anyway --
                       # see `TransformerCrossAttentionComparer`.
# Attention dropout. Named per attention type, and kept strictly separate from
# the `dropout` above, which regularises the two operands of the comparison
# rather than anything inside a module. `self_attention_dropout` reaches every
# TransformerEncoder block; `cross_attention_dropout` reaches the single
# MHAttention that compares message against referents. The speaker carries the
# same two keys with the same meanings, so both agents are regularised on the
# same terms. Note broccoli's attention-pooling layer (`SequencePool`, used by
# `AttentionPrototyper` and the ViT head) takes no dropout argument at all, so
# it is not covered by either key.
cross_attention_dropout = 0.0 # Only applies to Transformer comparers
# See [sender_feature_model] for what this is and why it is here. It drives the
# comparer's message encoder only; the three attention stages around it take
# `rotary_embedding=None` by construction, two of them because their sequence
# axis is the referent set and a set has no order to embed.
depthwise_linear_stochastic_depth = true
activation = "SwiGLU" # one of ReLU, GELU, SquaredReLU, SwiGLU
relative_position_embedding = true
pre_norm = false
post_norm = true
return_bos_tokens = false
knocking_heads = false
ff_inner_dropout = 0.0
ff_outer_dropout = 0.0
self_attention_dropout = 0.0
# Resolved twice in this comparer rather than once: the message encoder takes
# `layers`, and the three hand-written residuals around it take depth 1. Those
# three are bare attention sublayers -- one on the message stream, two on the
# referent stream -- and DeepNorm's depth argument counts attention-plus-
# feedforward layers, so a stream of two attention sublayers and no feedforward
# is one layer's worth of residual path. Pinning a number still passes straight
# through to both. Otherwise as [sender_feature_model].
alpha = "deepnorm"
beta = "deepnorm"

# ====== Defaults for the CUB birds data set below here ======

[birds.data]
dataset = "../data/cub"
ref_dataset = "../data/cub"
# Off for CUB, and `cub.py` does not thread these through in any case. The
# colour-only minimum is ShapeWorld-specific (the paper says so explicitly), and
# CUB species genuinely depend on plumage colour, so removing it would lower the
# ceiling with no shortcut to break. Thresholding a photograph would also
# destroy texture and pattern, not just colour.
silhouette_p_sender = 0.0
silhouette_p_receiver = 0.0
batch_size = 16
n_workers = 4
n_examples = 10 # number of examples seen by agents, including distractors

# Games per training epoch. Read only by `cub.py`: ShapeWorld's epoch is the
# size of the stored game file, so there is no matching key under `[data]`.
#
# jayelm's value was 1,000, and with `batch_size` 16 and `accumulator_steps` 1
# that makes an epoch 62 optimiser steps against ShapeWorld's 156 (20,000 games
# at an effective batch of 128). The two datasets were therefore getting a
# 2.5-fold different optimisation budget per epoch while sharing a 100-epoch
# schedule -- and `training_progress`, which retires the tau coupling, is keyed
# to the epoch counter.
#
# 2,500 was chosen because it satisfied two things at once: it equalised the step
# count with ShapeWorld, and it was roughly the coupon-collector point at which
# an epoch first covers the training images (100 species at ~59 images is a
# ~5,900-image pool, 20 images a game, `N ln N / 20` = 2,566).
#
# Those two no longer agree. The `test_same` holdout leaves 150 species at ~47
# training images, a ~7,050-image pool, whose coupon-collector point is
# `N ln N / 20` = 3,123. Coverage is the binding reason and step parity is
# retired deliberately: an epoch that does not reach all of its training images
# makes the epoch counter a poor clock, and `training_progress` and the
# `logit_scale` traverse are both keyed to it. The cost is 194 steps an epoch
# against ShapeWorld's 156, a 24% larger optimisation budget per epoch; the
# `logit_scale_lr` comment above carries the revised traverse arithmetic.
#
# Nothing is exhausted by raising it. `CUBDataset.__getitem__` ignores its index
# and samples a fresh game, so an epoch is a draw rather than a pass, and the
# space is combinatorially large.
games_per_epoch = 3100

# Eval games per species, for `test` and `test_same` alike: 50 x 16 = 800 games
# and 150 x 16 = 2,400. Read only by `cub.py`; ShapeWorld's eval splits are
# stored files.
#
# Per species rather than flat because the two eval splits hold different numbers
# of species, and topsim measures one prototype per concept -- the modal message
# over that concept's instances -- so it is coverage *per species* that has to
# match for the two splits to be read against each other. jayelm's flat 200 gave
# `test` four games a species and would have given `test_same` 1.3.
#
# 16 rather than jayelm's effective 4 because 200 games was too few to see
# through, `test_same` or not. Across the three recorded birds runs `test_acc`
# jittered by 1.2-1.9 points epoch-to-epoch against a signal only ~5 points above
# chance, and `test_topsim_s3` by 0.06-0.08 on a value of ~0.7. Eval is
# forward-only and epochs run ~32s, so quadrupling it is affordable where it
# would not be if eval trained.
eval_games_per_species = 16

[birds.optimiser]
accumulator_steps = 1

[birds.sender]
feature_model = "ResNet18"

[birds.sender_language_model]
# Neither exploration knob is overridden here, and both are doing work.
#
# No `uniform_weight` override, unlike jayelm's run_cub.sh, which passes no
# --uniform_weight and so explored CUB with the argparse default of 0.0. That
# left birds with no ceiling at all: its fidelity floated with whatever scale the
# architecture happened to produce -- 0.24 for the ViT sender, ~1.0 for a Conv4
# one -- so the two datasets differed in their channel rather than in their task.
# Inheriting w gives birds the same irreducible `w * (1 - 1/V)` corruption
# ShapeWorld gets. At the 0.1 that 119b2de made the default, that is 0.095 here
# against ShapeWorld's 0.093 -- the vocabularies differ (20 against 14) but the
# floor barely moves, which is the point of sharing the knob rather than the
# rate.
#
# Note this applies on the train pass only, so train and eval do not run through
# the same channel: eval decodes greedily, with no noise, no mixture and no
# scale. Train accuracy is therefore depressed relative to test accuracy by
# construction, and the two columns understate the real generalisation gap.
#
# No `init_energy` override either, and that is the point of solving for the
# scale rather than stating one. Both datasets ask for the same *entropy*, and
# `logit_scale` resolves whatever multiplier each vocabulary needs to deliver it
# -- 0.839 here against ShapeWorld's 0.802 -- so the two start their speakers
# equally uncommitted rather than differing in their channel because one has a
# bigger vocabulary. A shared bare scale would not do that, and neither did the
# `c * ln(V)` form this replaced, which over-corrected for vocabulary by roughly
# four times.
#
# Note the two datasets are still not identical at the message level, and cannot
# be: the same per-symbol entropy over 8 content tokens here versus 5 on
# ShapeWorld makes a whole message here harder to pin down. `message_length` is
# the knob that governs that, not these.
vocabulary = 20
message_length = 10 # max message length. note this includes sos/eos token, i.e. the true length is this - 2

[birds.receiver]
feature_model = "ResNet18"

[birds.receiver_comparer]
message_length = 10 # Only applies to Transformer comparers. Should be the same as sender_language_model.message_length